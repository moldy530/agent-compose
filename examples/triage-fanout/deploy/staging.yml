# Selected by `--target staging`; never imported. Only this layer forks per
# environment: agents/, flows/, stores/, and tools/ are env-invariant
# (PRD 5.8 per-target invariant).
version: "0.1"

# The process that owns the graph: scheduler, journal, wait board and triggers
# (grammar 14.2, PRD resolved q37). `join_token` is the bearer credential every
# worker presents at join, as an `${ENV}` reference and never a literal, and
# holding it is being trusted with the mesh (PRD resolved q38). `public_url` is
# the base every ingress URL this deployment hands out derives from.
hub:
  join_token: ${MESH_JOIN_TOKEN}
  public_url: "https://triage.internal.example"

# Logical names a worker claims at join — capability affinity, not load
# assignment, which is why nothing here is an address (grammar 14.1). Components
# named in no placement execute on the hub, which is every other component of
# this project.
placements:
  patchers:
    members:
      - agent.fixer
      - tool.repo_grep
    description: >-
      The machines holding a checkout: agent.fixer reads files under the repo
      root, and tool.repo_grep — reached from a `function:` node, so its own
      placement governs it — greps the same tree.

storage_backends:
  defaults:
    kv:
      provider: redis
      url: ${REDIS_URL}
  aliases:
    # store.docs declares `backend: docs_db`; this is where that abstract slot
    # becomes physical. Swapping staging to pgvector is a one-line edit here.
    docs_db:
      provider: chroma
      url: ${CHROMA_URL}
      index: project-docs

# Where this target's execution journal lives (grammar 14.7, PRD resolved q62).
# The composition says nothing about durability — every invocation of every flow
# is journaled, with no key to turn it on or off — and this block says only where
# the record goes. `local` keeps the SQLite file beside the project; staging is
# several processes on several machines, so it binds Postgres: the hub's record
# then survives the hub's disk, and a `serve` restarted elsewhere recovers every
# open execution. The address is an `${ENV}` reference like every other
# credential, and it belongs to the hub's environment and to no worker's — the
# hub is the single writer, and workers stream their effect records home to it.
journal:
  provider: postgres
  url: ${JOURNAL_URL}

# Where the installer of a built project resolves packages from (grammar 14.6,
# PRD resolved q59). This network mandates an internal mirror, so `build` writes
# a `bunfig.toml` and an `.npmrc` into the artifact — which is what makes the
# `bun install` every worker runs at materialise reach the mirror instead of the
# public registry it cannot see. The tokens are `${ENV}` references and stay
# references in the emitted bytes: nothing secret is in the build directory, and
# rotating one does not change the artifact hash.
package_registry:
  url: "https://npm.internal.example/repository/npm-group/"
  token: ${NPM_MIRROR_TOKEN}
  scopes:
    # The private scope lives on its own path, with its own credential.
    "@corp":
      url: "https://npm.internal.example/repository/corp/"
      token: ${NPM_CORP_TOKEN}

# Where every settled execution's trace ships (grammar 14.5, PRD resolved q50).
# One address for the whole target, delivered on the same journal-backed
# at-least-once machinery a `callback:` uses — a collector that is down costs
# deliveries a retry and the executions nothing. The credential is a deploy-layer
# variable and belongs to the hub's env manifest: the hub owns the trace, so no
# worker is ever asked for this token. No allowlist key here, and none is wanted:
# this address is written on the line above by whoever deploys, not lifted out of
# a request payload the way a `callback:` URL is.
trace_sink:
  url: "https://collector.internal.example/v1/traces"
  auth:
    bearer:
      token: ${TRACE_SINK_TOKEN}

# RESERVED (PRD 5.11): binds the logical `source: bug_reports` of the `ingest`
# trigger to infrastructure. Delivery is at-least-once with inbound dedupe.
event_sources:
  bug_reports:
    kind: redis_streams
    url: ${REDIS_URL}
    stream: bug-reports
    consumer_group: agent-compose
