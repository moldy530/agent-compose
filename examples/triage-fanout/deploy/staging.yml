# Selected by `--target staging`; never imported. Only this layer forks per
# environment: agents/, flows/, stores/, and tools/ are env-invariant
# (PRD 5.8 per-target invariant).
version: "0.1"

# The process that owns the graph: scheduler, journal, wait board and triggers
# (grammar 14.2, PRD resolved q37). `join_token` is the bearer credential every
# worker presents at join, as an `${ENV}` reference and never a literal, and
# holding it is being trusted with the mesh (PRD resolved q38). `public_url` is
# the base every ingress URL this deployment hands out derives from.
hub:
  join_token: ${MESH_JOIN_TOKEN}
  public_url: "https://triage.internal.example"

# Logical names a worker claims at join — capability affinity, not load
# assignment, which is why nothing here is an address (grammar 14.1). Components
# named in no placement execute on the hub, which is every other component of
# this project.
placements:
  patchers:
    members:
      - agent.fixer
      - tool.repo_grep
    description: >-
      The machines holding a checkout: agent.fixer reads files under the repo
      root, and tool.repo_grep — reached from a `function:` node, so its own
      placement governs it — greps the same tree.

storage_backends:
  defaults:
    kv:
      provider: redis
      url: ${REDIS_URL}
  aliases:
    # store.docs declares `backend: docs_db`; this is where that abstract slot
    # becomes physical. Swapping staging to pgvector is a one-line edit here.
    docs_db:
      provider: chroma
      url: ${CHROMA_URL}
      index: project-docs

# RESERVED (PRD 5.11): binds the logical `source: bug_reports` of the `ingest`
# trigger to infrastructure. Delivery is at-least-once with inbound dedupe.
event_sources:
  bug_reports:
    kind: redis_streams
    url: ${REDIS_URL}
    stream: bug-reports
    consumer_group: agent-compose
