triggers:
  # Session-scoped stores need a session identity. On a manual trigger the CLI
  # supplies it as `--session <key>`, exposed to the binding as payload.session —
  # which is also this key's default, spelled out here (grammar 13.2, PRD 5.8).
  cli:
    type: manual
    flow: flow.triage
    session_key: "payload.session"

  on_report:
    type: http
    flow: flow.triage
    path: /reports
    method: POST
    input:
      report: "payload.body.report"
      pattern: "payload.body.pattern"
    session_key: "payload.body.project"
    respond: async
    callback: "payload.body.callback_url"

  # Fired by `serve` (grammar 13.4, PRD resolved q78): once per tick, 03:00 UTC,
  # and a tick that fell while nothing was serving is skipped, not back-filled.
  nightly:
    type: schedule
    flow: flow.triage
    cron: "0 3 * * *"
    timezone: UTC
    input:
      report: "'nightly sweep'"
      pattern: "'TODO|FIXME'"
    session_key: "'nightly'"

  # Fed by its source (grammar 13.5): a logical name the deploy layer binds
  # under `event_sources:` — a Redis stream in deploy/staging.yml (grammar 14.4).
  ingest:
    type: event
    flow: flow.triage
    source: bug_reports
    input:
      report: "payload.body.text"
      pattern: "payload.body.pattern"
    session_key: "payload.body.project"
    dedupe_key: "payload.id"
