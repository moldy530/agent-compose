# examples/triage-fanout — bug triage with heterogeneous fan-out.
#
# Exercises: discriminator-routed `map` with per-variant narrowing and a
# `default:` catch-all, a detached sink route, an `exec`-backed tool used as a
# `function` node, kv and vector stores (both consumption surfaces), a `human`
# node, reduced state channels, and the reserved grammar (schedule + event
# triggers, placements, event_sources).
version: "0.1"

imports:
  - providers.yml
  - models.yml
  - agents/triage.yml
  - agents/fixer.yml
  - agents/summarizer.yml
  - tools/repo_grep.yml
  - tools/review_queue.yml
  - tools/dead_letter.yml
  - stores/docs.yml
  - stores/triage_memory.yml
  - flows/enrich.yml
  - flows/triage.yml
  - triggers.yml

defaults:
  timeout: 90s
  retry: { max: 1, backoff: 2s }
  on_error: fail

state:
  report_normalized:
    description: The report after flow.enrich has normalized it.
    type: string
    default: ""

  matches:
    description: Raw grep hits handed to the triage agent.
    type: array
    items: { type: string }

  # Written from inside a `map`, so it MUST declare a reduce policy (PRD 5.6).
  # Appended values are index-tagged and reordered by source-item index before
  # the join, which is what keeps replay deterministic.
  patches:
    description: Patches produced by the fixer instances.
    type: array
    max_items: 200
    items: { type: string }
    reduce: append

  summary:
    description: Human-readable summary of the triage run.
    type: string
    default: ""

  human_decision:
    description: What the reviewer decided about the run as a whole.
    enum: [approve, reject]
    default: approve
