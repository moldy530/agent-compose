flow.triage:
  description: Triage a bug report, fan out fixes, and get a human sign-off.
  inputs:
    report:
      description: The raw bug report.
      type: string
      min_length: 1
    pattern:
      description: Repository search pattern used to ground the triage agent.
      type: string
  outputs:
    summary:
      type: string
    patches:
      type: array
      max_items: 200
      items: { type: string }

  nodes:
    # Subgraph instantiation with explicit bindings and an instantiation-site
    # policy override — the highest level of the resolution chain (grammar 9.3).
    enrich:
      flow: flow.enrich
      input:
        report: "input.report"
      context: isolated
      policy:
        timeout: 30s
        on_error: fail

    # A tool definition invoked deterministically as a graph node.
    scan:
      function: tool.repo_grep
      input:
        pattern: "input.pattern"
        max_matches: "25"

    classify:
      agent: agent.triage
      input:
        report: "state.report_normalized"
        matches: "state.matches"

    # Heterogeneous fan-out. Bounding is mandatory on both axes: `max_items` on
    # the source array (agent.triage) and `max_concurrency` here (PRD 5.6).
    # Every variant is routed — auto_fixable and needs_human explicitly,
    # duplicate through `default:` — so no item can be unroutable.
    dispatch:
      map:
        over: classify.output.findings
        as: finding
        route_by: kind
        max_concurrency: 8
        # `on_item_error: retry` carries its policy inline, in the shape §9.1
        # defines and `on_error:` already uses (grammar 8.6 rule 10). Exhausted
        # item retries fail the item; the map node's own `on_error:` below is
        # where that failure is absorbed — "retry each item, and if one still
        # fails, skip the fan-out". `over` reads `classify.output`, and
        # `classify` dominates this node, so the array is guaranteed to exist
        # when the map dispatches (rule 11).
        on_item_error:
          retry: { max: 2, backoff: 2s }
        routes:
          auto_fixable:
            node: agent.fixer
            max_concurrency: 4
            input:
              file: "finding.file"
              patch_hint: "finding.patch_hint"
            writes:
              patch: patches
          needs_human:
            node: tool.review_queue
            input:
              summary: "finding.summary"
              severity: "finding.severity"
        # `default:` is narrowed to the UNROUTED variants (grammar 8.6 rule 4),
        # here just `duplicate` — which is why `finding.of` type-checks.
        #
        # `detach:` is spelled out as false because this project ships a
        # non-local deploy target: `detach: true` is a v0 validation error under
        # any durably checkpointed target, i.e. every target except `local`
        # (grammar 8.6 rule 7 / 14, PRD 5.6), so with `deploy/staging.yml` in the
        # tree a detached route would make `validate --target staging` fail.
        # Spelling it out also keeps this sink INSIDE the join: a detached
        # dispatch is resolved at dispatch, so it is neither waited for nor
        # covered by `on_item_error` (grammar 8.6 rules 6, 7 / D94), and a failed
        # dead-letter enqueue would pass unnoticed.
        default:
          node: tool.dead_letter
          detach: false
          input:
            kind: "finding.kind"
            payload: "finding.of"
      # Applies to the fan-out as a whole (grammar 8.6 rule 9), and the
      # unconditional edge to `verify` is the escape §7.6.3 rule 3 requires of a
      # node declaring `skip`.
      on_error: skip

    # The sibling of `dispatch` in a pair of concurrent branches (grammar 7.3
    # rule 6): both edges leaving `classify` are unconditional, so both fire and
    # the two nodes run in one step. Node config CEL never reads another node's
    # output (D42), so the body comes from a channel.
    announce:
      http:
        method: POST
        url: "https://${QUEUE_HOST}/v1/triage-started"
        headers:
          authorization: "Bearer ${QUEUE_TOKEN}"
        body:
          report: "state.report_normalized"
        output:
          status: { type: integer }
      timeout: 10s
      # On failure this node's own edges are NOT evaluated; the fallback target
      # is scheduled instead (grammar 9.2), so this branch reaches `end` through
      # `announce_failed` rather than converging on `verify`.
      on_error: { fallback: announce_failed }

    # Reached ONLY by that fallback — no edge targets it. Node reachability
    # counts the two control-transfer positions (`on_error: {fallback: ...}` and
    # `human.on_timeout:`) alongside edges, which is what makes a dedicated
    # error-handling node legal rather than an unreachable-node error
    # (grammar 7.8 / D95). It still needs an outgoing edge of its own: reaching
    # `end` is how a branch retires (grammar 7.6.3 rule 1).
    #
    # `command:` and `args:` may embed ${ENV} references — the whole `exec:`
    # surface is interpolable (grammar 4.3 class 2 / D92) — while carrying no
    # CEL (D24).
    announce_failed:
      exec:
        command: "${OPS_BIN}/log-event"
        args: ["--kind=announce-failed", "--env=${DEPLOY_ENV}"]
      on_error: skip

    # Inline subprocess step. The bound input object is passed to the child as
    # environment variables, upper-snake-cased (`patches` -> `PATCHES`), and the
    # declared output is all envelope fields, so stdout is never parsed
    # (grammar 8.2 / PRD 5.5).
    #
    # `expect_exit: [0, 1]` is what makes "the checks failed" DATA rather than a
    # node error: the failure predicate is the same on both surfaces, and
    # declaring `exit_code:` does not by itself change it (grammar 6.1, 8.2 /
    # D84). `on_error: skip` therefore covers what is left — the child failing to
    # spawn, or the 5m timeout — and the unconditional edge to `summarize` is the
    # escape a node declaring `skip` requires (grammar 7.6.3 rule 3).
    verify:
      exec:
        command: run-checks
        args: ["--fast"]
        cwd: "${REPO_ROOT}"
        env:
          CI: "true"
        expect_exit: [0, 1]
        output:
          exit_code: { type: integer }
          stdout: { type: string }
      input:
        patches: "state.patches"
      timeout: 5m
      on_error: skip

    summarize:
      agent: agent.summarizer
      input:
        report: "state.report_normalized"
        patches: "state.patches"

    # Store-op node: deterministic, graph-invoked, schema-checked against the
    # store's value_schema. Session-scoped, so every trigger targeting this flow
    # supplies a session_key (PRD 5.8, 5.11).
    remember:
      store: store.triage_memory
      op: set
      key: "execution.session_key"
      value:
        last_report: "input.report"
        patch_count: "size(state.patches)"
      on_error: skip

    # Human-in-the-loop pause. The output is routable structured output like any
    # other, and resume payloads are validated against it (PRD 5.11).
    approve:
      human:
        input:
          summary: { type: string }
          patch_count: { type: integer }
        output:
          decision: { enum: [approve, reject] }
          note: { type: string }
        timeout: 24h
        on_timeout: escalate
      input:
        summary: "state.summary"
        patch_count: "size(state.patches)"
      writes:
        decision: human_decision

    # Inline HTTP step. `status` is an envelope field bound from the response
    # itself, never decoded out of its body (grammar 8.3).
    escalate:
      http:
        method: POST
        url: "https://${QUEUE_HOST}/v1/escalations"
        headers:
          authorization: "Bearer ${QUEUE_TOKEN}"
        body:
          summary: "state.summary"
        output:
          status: { type: integer }
      timeout: 10s
      retry: { max: 3, backoff: 1s }

  edges:
    - { from: start, to: enrich }
    - { from: enrich, to: scan }
    - { from: scan, to: classify }
    # Two unconditional edges leave `classify`, so both fire: `dispatch` and
    # `announce` are concurrent branches running in one step (grammar 7.6.1).
    - { from: classify, to: dispatch }
    - { from: classify, to: announce }
    # The downstream edge is the fan-out barrier: it fires when every dispatched
    # instance has completed or been resolved by `on_item_error`. The branches
    # converge on `verify` at equal depth — dist(verify) = {2} from `classify` —
    # so `verify` runs ONCE with both branches' writes already applied
    # (grammar 7.6.2 P2), rather than once per arrival. An unbalanced
    # convergence, say a third edge `classify -> verify`, would be a compile
    # error.
    - { from: dispatch, to: verify }
    - { from: announce, to: verify }
    # `announce_failed` has no INBOUND edge — it is reached through `announce`'s
    # `on_error: { fallback: ... }` (grammar 7.8) — but it still needs an
    # outgoing one, so its branch retires at `end` instead of vanishing.
    - { from: announce_failed, to: end }
    - { from: verify, to: summarize }
    - { from: summarize, to: remember }
    - { from: remember, to: approve }
    - { from: approve, to: end, when: "approve.output.decision == 'approve'" }
    - { from: approve, to: escalate, when: "approve.output.decision == 'reject'" }
    - { from: escalate, to: end }
