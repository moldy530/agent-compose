# Behavior layer (PRD 5.9), read by a coder node exactly as an agent node reads
# it: the address is what the composition names, and the adapter maps it down to
# the provider-native id in harness config.
#
# One key of each `settings:` block crosses the boundary and the rest does not:
# `thinking:` is the Agent SDK's thinking budget, `reasoning_effort:` is the
# Codex SDK's, and `max_tokens:` shapes a *request* this runtime composes, which
# is not a request a harness run ever makes. The block that crosses whole is the
# **connection** behind `provider:` — see `providers.yml` (grammar 8.9, 12.2,
# D141, D143).
model.implementer:
  provider: provider.anthropic
  id: claude-sonnet-4-5
  settings:
    thinking:
      budget_tokens: 8000
    max_tokens: 16000

model.reviewer:
  provider: provider.openai
  id: gpt-5-codex
  settings:
    reasoning_effort: medium
