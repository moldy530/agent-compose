[package]
name = "agent-compose"
description = "Declarative YAML DSL for agent graphs, compiled to LangGraph TypeScript"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Declared rather than left to cargo's auto-detection, because this package has
# *two* files called `build.rs` and only one of them is a build script: this one
# stamps the commit and the target into `--version`, while `src/build.rs` is the
# module behind the `build` verb. Naming the script here says which is which to
# a reader who meets the other one first.
build = "build.rs"

[dependencies]
compose-core = { workspace = true }
clap = { workspace = true }
# The snippet renderer behind `validate`'s human output. Chosen over
# `codespan-reporting` on three counts: its dependency footprint is one crate
# (`unicode-width`), which keeps the single static binary of PRD 5.12 small; it
# renders to a `String` rather than to a `WriteColor` stream, so the exact bytes
# a report produces are testable without a terminal abstraction; and it
# annotates byte ranges over a plain `&str`, which is what a `Span` already
# carries — there is no file database to keep in step with the compiler's own.
# It is also the renderer rustc's diagnostics use, which is the bar PRD G3 sets.
annotate-snippets = "0.12"
# `--format json`. `Diagnostic` is `Serialize` in `compose-core`, so all this
# writes is the enclosing object — and, since the `worker` verb landed, every
# body of `docs/distributed.md` §3's wire.
serde_json = "1"
# The HTTP client behind `agent-compose worker`. The verb is a complete protocol
# client (`docs/distributed.md` §3): it long-polls a hub, streams effect batches
# home and fetches an artifact, so this binary needs a client where it needed
# none before. Chosen for three properties the protocol asks for by name:
#
#   * **blocking**, so the worker is threads and not an async runtime — §2 gives
#     it one held `GET` and one running node, which is two threads;
#   * **TLS**, because a worker dials *out* to a hub over whatever network is
#     between them (§1: "a Mac behind NAT with a dynamic IP joins the way a CI
#     runner joins"), and an `https://` hub URL is the ordinary case;
#   * **per-request timeouts**, which a 25-second hold that must not be cut
#     short and a `POST` that must not hang for ever need to set differently.
#
# It is the one dependency the shipped binary gains for this milestone, and it
# carries `rustls` rather than the platform's TLS so the single static binary of
# PRD 5.12 stays single and static.
ureq = "3"
# Gunzip, for the artifact `/workers/artifact/{hash}` serves — §3.5 fixes its
# `Content-Type: application/gzip`, and that is the *body's* encoding rather than
# the transfer's, so no HTTP client decodes it. Already in the tree through
# `ureq`'s own `gzip` feature; named here because this crate calls it directly.
# The **tar** beside it is read by hand (`worker::artifact`), the way `src/mesh.ts`
# writes it by hand and for the same reason.
flate2 = "1"

[target.'cfg(unix)'.dependencies]
# Signal delivery, which `run` and `serve` need and `std` has no API for: both
# verbs launch the emitted project as a child and must hand it the `SIGINT` or
# `SIGTERM` they were sent, or a stopped `serve` leaves a listening app behind
# (see `launch::spawn`). `libc` is the crate that declares those two calls —
# `sigaction` and `kill` — and nothing else: it adds no code to the binary that
# `std`, which already links the platform's C library, does not link anyway.
# Unix-gated because signals are a POSIX facility; the Windows build keeps the
# plain wait it has always had.
libc = "0.2"

[dev-dependencies]
# The CLI integration tests. Chosen over `trycmd` because one harness has to pin
# three different things about a run — the exact bytes on each stream, the exit
# code, and how long it took (`perf_smoke`) — and only a programmatic harness
# expresses the third. `Command::cargo_bin` also builds and locates the binary
# under test, which is what makes the tests runnable with a bare `cargo test`.
assert_cmd = "2"
# The M1 acceptance harness (`tests/compiled_graph_acceptance.rs`): the scripted provider a
# compiled graph runs against, with no API keys and no network. A dev-dependency
# rather than a dependency — the shipped binary never talks to it, and the
# single static binary of PRD 5.12 must not carry an HTTP stack it does not use.
mock-provider = { workspace = true }
# `tests/trace_format_stability.rs`: the trace format is a documented public
# surface (`docs/trace.md`), and what pins it is a committed snapshot of the
# shape real runs produce — so a renamed or removed field is a reviewable diff
# rather than a downstream reader's discovery. Already `compose-core`'s choice
# for the IR snapshots, and the same reason applies here.
insta = "1"
