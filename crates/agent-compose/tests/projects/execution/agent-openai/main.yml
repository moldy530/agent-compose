# M1 acceptance fixture: the same agent, on the other HTTP surface.
#
# `openai_compatible` is the kind grammar 12.1 gives to "ollama, vllm, proxies" —
# anything speaking Chat Completions at a URL — so it is both a realistic
# provider for a local model and the way this suite reaches the mock's OpenAI
# surface. The graph is deliberately the same shape as `agent-anthropic`: what a
# test comparing the two asserts is that the *provider kind* is the only
# difference, which is PRD 5.9's whole claim about the provider/model split.
#
# `flow.triage` is the one thing here with no Messages-API twin: an output schema
# whose nested object declares `optional:`, which OpenAI's strict decoder cannot
# be asked to close. It is what makes the `strict-is-refused-by-an-optional-
# property` row of `codegen::runtime`'s ledger reachable from ordinary grammar
# rather than a claim about a schema nobody writes.
#
# `flow.research` is `agent-anthropic`'s twin one level further in: an agent with
# `tools:`, so this surface's **tool loop** runs a compiled graph too. It is what
# makes a refused tool call a claim about both wire shapes rather than about the
# Messages API alone (grammar 5.4, Decision D119) — a refusal travels back as a
# `tool` role message here and as an `is_error` `tool_result` block there, and a
# runtime that got either wrong would be caught by a provider that refuses it.
version: "0.1"

state:
  verdict:
    enum: [approve, revise]
    default: approve
  feedback:
    type: string
    default: ""
  meta:
    description: >-
      The triager's metadata. Its `owner` is `optional:`, which is what makes
      the whole output schema unstrictable on this surface — see `flow.triage`.
    type: object
    properties:
      severity: { type: string }
      owner: { type: string }
    optional: [owner]
    default: { severity: "unknown" }

provider.mock:
  kind: openai_compatible
  base_url: ${MOCK_BASE_URL}
  api_key: ${MOCK_API_KEY}

model.local:
  provider: provider.mock
  id: qwen3-coder-30b
  settings:
    temperature: 0.2
    max_tokens: 2000

# An `exec` binding over `printf` for the reason `agent-anthropic`'s twin gives:
# the tool loop has to be runnable in CI with no infrastructure, and a single
# string-typed output property takes raw stdout (grammar 6.1). `query` declares
# `min_length: 1`, which is what a model can answer with arguments this tool's
# own schema refuses — the refusal Decision D119 sends back to it.
tool.lookup:
  description: Look up one fact the answer depends on.
  input:
    query:
      description: What to look up.
      type: string
      min_length: 1
  output:
    snippet:
      description: The one fact found, as text.
      type: string
  exec:
    command: printf
    args: ["a looked-up snippet"]

# The other half of Decision D119's split, on the same surface: a tool whose
# **execution** fails. `false` exits 1 and prints nothing, so no rephrasing of
# the call could make it succeed — the failure leaves the tool and grammar 9's
# chain decides the run, exactly as it did before a refusal started bouncing.
tool.audit:
  description: Audit a looked-up fact. This one can never answer.
  input:
    claim:
      description: The claim to audit.
      type: string
      min_length: 1
  output:
    note:
      description: What the audit said.
      type: string
  exec:
    command: "false"

agent.reviewer:
  description: Reviews a draft against a goal and returns a routable verdict.
  model: model.local
  prompt: |
    You are a meticulous technical reviewer.

    Approve only when the draft fully satisfies the goal. Otherwise ask for a
    revision and list every required change.
  input:
    goal:
      type: string
    draft:
      type: string
  output:
    verdict:
      enum: [approve, revise]
    feedback:
      type: string

agent.triager:
  description: Classifies a report and attaches what metadata it has.
  model: model.local
  prompt: |
    You classify incoming reports.
  input:
    report:
      type: string
  output:
    verdict:
      enum: [approve, revise]
    # A nested object with an `optional:` property, which is the reachable entry
    # point into `strict: false` on this surface: a result schema refuses
    # `default:` (grammar 3.9), so `optional:` is the only way a property of an
    # agent's output lands outside `required`, and OpenAI's strict decoder
    # requires every property to be required. See the `strict-is-refused-…` row
    # in `codegen::runtime`'s ledger.
    meta:
      type: object
      properties:
        severity: { type: string }
        owner: { type: string }
      optional: [owner]

agent.researcher:
  description: Looks a fact up before answering, which is what opens the tool loop.
  model: model.local
  prompt: |
    You are a researcher.

    Look up whatever the goal depends on before you answer, then report what you
    found.
  tools: [tool.lookup, tool.audit]
  input:
    goal:
      description: What the answer must accomplish.
      type: string
  output:
    feedback:
      description: What was found, as text.
      type: string

flow.review:
  description: Review one draft and return the verdict.
  inputs:
    goal:
      type: string
      min_length: 1
    draft:
      type: string
      min_length: 1
  outputs:
    verdict:
      enum: [approve, revise]
    feedback:
      type: string
  nodes:
    review:
      agent: agent.reviewer
      input:
        goal: "input.goal"
        draft: "input.draft"
  edges:
    - { from: start, to: review }
    - { from: review, to: end }

flow.triage:
  description: An output schema OpenAI's strict decoder cannot be asked to close.
  inputs:
    report:
      type: string
      min_length: 1
  outputs:
    verdict:
      enum: [approve, revise]
    meta:
      type: object
      properties:
        severity: { type: string }
        owner: { type: string }
      optional: [owner]
  nodes:
    triage:
      agent: agent.triager
      input:
        report: "input.report"
  edges:
    - { from: start, to: triage }
    - { from: triage, to: end }

flow.research:
  description: Look one fact up and return what the researcher reported.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    feedback:
      type: string
  nodes:
    research:
      agent: agent.researcher
      input:
        goal: "input.goal"
  edges:
    - { from: start, to: research }
    - { from: research, to: end }
