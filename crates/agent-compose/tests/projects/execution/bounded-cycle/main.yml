# M1 acceptance fixture: a bounded cycle, guarded routing, and node policy.
#
# The write <-> review loop of PRD 5.4 and §6, reduced to what the runtime has to
# get right: an edge guard evaluated over the source node's output (PRD 5.3), a
# `max_iterations` budget on the back-edge, and an `else:` escape that fires both
# on `approve` and on the pass where the budget is spent (grammar 7.4). The
# iteration counter codegen emits per bounded cycle is the observable: a scripted
# run that answers `revise` forever must leave through `end` on the fourth pass,
# not loop.
#
# `retry:` and `timeout:` sit on the two nodes so the policy resolution chain
# (grammar 9.3) has something to resolve: project `defaults:` under a per-node
# override.
version: "0.1"

defaults:
  timeout: 30s
  on_error: fail

state:
  draft:
    description: The current draft, rewritten on every pass.
    type: string
    default: ""
  feedback:
    description: The reviewer's most recent feedback, fed back into the writer.
    type: string
    default: ""

provider.mock:
  kind: anthropic
  api_key: ${MOCK_API_KEY}
  base_url: ${MOCK_BASE_URL}

model.smart:
  provider: provider.mock
  id: claude-sonnet-4-6
  settings:
    max_tokens: 4096

agent.writer:
  description: Writes and revises a draft until it satisfies the goal.
  model: model.smart
  prompt: |
    You are a research writer. Produce one self-contained draft that satisfies
    the goal. When feedback is present, treat every point in it as required.
  input:
    goal:
      type: string
    feedback:
      type: string
      default: ""
  output:
    draft:
      type: string
      min_length: 1

agent.reviewer:
  description: Reviews a draft and returns a routable verdict.
  model: model.smart
  prompt: |
    You are a meticulous technical reviewer. Approve only when the draft fully
    satisfies the goal.
  input:
    goal:
      type: string
    draft:
      type: string
  output:
    verdict:
      enum: [approve, revise]
    feedback:
      type: string

flow.review_loop:
  description: Draft a document and revise it until the reviewer approves.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    draft:
      type: string
  nodes:
    write:
      agent: agent.writer
      input:
        goal: "input.goal"
        feedback: "state.feedback"
      retry: { max: 2, backoff: 1s }

    review:
      agent: agent.reviewer
      input:
        goal: "input.goal"
        draft: "state.draft"
      timeout: 10s

  edges:
    - { from: start, to: write }
    - { from: write, to: review }
    # The back-edge and its budget: three revisions, then the escape.
    - from: review
      to: write
      when: "review.output.verdict == 'revise'"
      max_iterations: 3
    # The escape the bounded cycle requires: an `else:` fires on `approve`, and
    # equally on the pass where `revise` comes back with the budget spent.
    - from: review
      to: end
      else: true
