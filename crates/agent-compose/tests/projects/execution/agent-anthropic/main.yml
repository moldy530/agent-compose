# M1 acceptance fixture: agent nodes on the Anthropic surface.
#
# Two flows, one manual invocation each, and the split between them is the point.
#
#   * `flow.review` runs `agent.reviewer`, which has **no tools**. Its model call
#     is therefore a single one — the one that asks for the output schema
#     (PRD 5.2), in whichever of the wire's two ways the endpoint leaves open
#     (PRD §9 resolved q53) — so a test that scripts one structured answer has
#     nothing else in the transcript to explain away. It is also the exact twin
#     of `agent-openai`'s reviewer, which is what makes "the provider kind is
#     the only difference" an assertion rather than a claim.
#   * `flow.research` runs `agent.researcher`, which carries `tools:` and the
#     `max_tool_iterations` bound on the loop they open (D51 — an open question,
#     see PRD §10 item 2). An agent with tools cannot have its answer pinned on
#     the *first* call, because a pinned tool choice is a promise that the pinned
#     tool is what gets called and the tool loop would be dead; so this is the
#     fixture whose transcript has more than one call in it, and the reviewer
#     above is kept free of tools so the rest of the suite does not.
#
# `tool.lookup` is an `exec` binding over `printf` for a reason: the tool loop
# has to be runnable in CI with no infrastructure, and its output is a single
# string property, so the raw stdout binds to it (grammar 6.1) and the result is
# the same on every machine.
#
# Every provider here declares a `base_url:` that is an env ref — `provider.mock`
# the shared `${MOCK_BASE_URL}`, `provider.twin` the second address one test
# points at a server of its own. That is what lets
# the acceptance harness point a compiled graph at the mock provider without the
# spec differing between a scripted run and a real one (PRD 5.9: env refs survive
# unresolved into the IR and resolve at process start), and it is why the fixtures
# are written rather than borrowed: `examples/review-loop`'s `provider.anthropic`
# names no base URL, so a graph built from it talks to Anthropic. That example is
# still run — `the_review_loop_example_runs_its_cycle_against_the_mock_provider`
# redirects its egress from the host module the driver imports before the graph —
# but the redirect is a harness affordance rather than something the spec offers,
# so everything decidable from a fixture is decided here instead.
version: "0.1"

# Four channels, and the two halves of "state channels carry their declared
# types, defaults, and reduce policies" are deliberately kept apart. `verdict`
# and `feedback` are *written* by the agent, and every value the acceptance suite
# scripts for them differs from the default declared here — so an assertion on
# them can only pass if the write happened. `round` and `notes` are written by
# nothing, so what a run returns for them is the declaration itself: an integer
# default, and an `append` channel's identity element (grammar 10.1). Without
# that split, a build that ignored `default:` entirely would be indistinguishable
# from one that honoured it.
state:
  verdict:
    description: The reviewer's verdict, written by name from its output.
    enum: [approve, revise]
    default: approve
  feedback:
    description: The reviewer's feedback, written by name from its output.
    type: string
    default: none yet
  round:
    description: Which review round this is. Nothing here writes it.
    type: integer
    default: 1
  notes:
    description: Side notes, appended. Nothing here writes it either.
    type: array
    max_items: 8
    items:
      type: string
    reduce: append

provider.mock:
  kind: anthropic
  api_key: ${MOCK_API_KEY}
  base_url: ${MOCK_BASE_URL}

model.smart:
  provider: provider.mock
  id: claude-sonnet-4-6
  settings:
    max_tokens: 4096

provider.twin:
  # A **second endpoint serving the same model name**, which is the one shape a
  # single-provider fixture cannot make: an Anthropic-compatible gateway in
  # front of `claude-sonnet-4-6` beside `api.anthropic.com` in front of
  # `claude-sonnet-4-6`. What a structured-output mechanism is accepted by is
  # the endpoint, not the name it serves (PRD §9 resolved q53), so the memo that
  # remembers a refusal is keyed by both — and only two endpoints under one
  # model id can tell a memo that holds the pair from one that holds the name.
  #
  # `${MOCK_TWIN_BASE_URL}` is its own variable for exactly that reason: every
  # other fixture provider resolves the single `${MOCK_BASE_URL}`, so a test
  # that wants two servers needs a second address to point at one.
  kind: anthropic
  api_key: ${MOCK_API_KEY}
  base_url: ${MOCK_TWIN_BASE_URL}

model.smart_twin:
  # The same `id:` as `model.smart` above, deliberately: two bindings, two
  # providers, one model name.
  provider: provider.twin
  id: claude-sonnet-4-6
  settings:
    max_tokens: 4096

tool.lookup:
  description: Look up one fact the draft depends on.
  input:
    query:
      description: What to look up.
      type: string
      min_length: 1
  output:
    snippet:
      description: The one fact found, as text.
      type: string
  exec:
    command: printf
    args: ["a looked-up snippet"]

agent.reviewer:
  description: Reviews a draft against a goal and returns a routable verdict.
  model: model.smart
  prompt: |
    You are a meticulous technical reviewer.

    Approve only when the draft fully satisfies the goal. Otherwise ask for a
    revision and list every required change.
  input:
    goal:
      description: What the draft must accomplish.
      type: string
    draft:
      description: The draft under review.
      type: string
  output:
    verdict:
      description: The routable decision.
      enum: [approve, revise]
    feedback:
      description: Required changes; empty when approving.
      type: string

agent.researcher:
  description: Looks a fact up before answering, which is what opens the tool loop.
  model: model.smart
  prompt: |
    You are a researcher.

    Look up whatever the goal depends on before you answer, then report what you
    found.
  tools: [tool.lookup]
  max_tool_iterations: 2
  input:
    goal:
      description: What the answer must accomplish.
      type: string
  output:
    feedback:
      description: What was found, as text.
      type: string

agent.loose_reviewer:
  description: A reviewer whose output nests an object no decoder can close.
  # The one agent here whose `output:` is **not** strictable (grammar 3.4's
  # `optional:` on a nested object), which is what makes it the fixture for the
  # rung a structured-output call starts on when the wire's native format could
  # not take the schema at all (PRD §9 resolved q53). Everything else about it
  # is `agent.reviewer`.
  model: model.smart
  prompt: |
    You are a meticulous technical reviewer.
  input:
    goal:
      description: What the draft must accomplish.
      type: string
  output:
    verdict:
      description: The routable decision.
      enum: [approve, revise]
    detail:
      description: The parts of the review, one of which may be omitted.
      type: object
      properties:
        headline:
          description: The one-line verdict.
          type: string
        aside:
          description: An optional remark — the property that opens the schema.
          type: string
      optional: [aside]

agent.twin_reviewer:
  description: The reviewer again, on the second endpoint serving the same model.
  # Identical to `agent.reviewer` in everything except `model:`, which is the
  # point: what differs between the two nodes of `flow.twin_endpoints` is the
  # endpoint their calls go to and nothing else.
  model: model.smart_twin
  prompt: |
    You are a meticulous technical reviewer.

    Approve only when the draft fully satisfies the goal. Otherwise ask for a
    revision and list every required change.
  input:
    goal:
      description: What the draft must accomplish.
      type: string
    draft:
      description: The draft under review.
      type: string
  output:
    verdict:
      description: The routable decision.
      enum: [approve, revise]
    feedback:
      description: Required changes; empty when approving.
      type: string

flow.review:
  description: Review one draft and return the verdict.
  inputs:
    goal:
      type: string
      min_length: 1
    draft:
      type: string
      min_length: 1
  outputs:
    verdict:
      enum: [approve, revise]
    feedback:
      type: string
    round:
      type: integer
    notes:
      type: array
      max_items: 8
      items:
        type: string
  nodes:
    review:
      agent: agent.reviewer
      input:
        goal: "input.goal"
        draft: "input.draft"
  edges:
    - { from: start, to: review }
    - { from: review, to: end }

flow.pair:
  description: Two agent nodes in a row, so the conversation crosses between them.
  # The implicit `messages` channel of grammar 10.4 (PRD 5.7 tier 3): each agent
  # node appends its rendered input and its structured answer, and the next one
  # is called with what is there. Two nodes is the smallest flow where that is
  # observable at all — one node's history is empty by construction — and the
  # second reads `state.feedback` so its own user turn carries what the first
  # answered, which is what tells a *shared* history from a repeated input.
  inputs:
    goal:
      type: string
      min_length: 1
    draft:
      type: string
      min_length: 1
  outputs:
    verdict:
      enum: [approve, revise]
    feedback:
      type: string
  nodes:
    first:
      agent: agent.reviewer
      input:
        goal: "input.goal"
        draft: "input.draft"

    second:
      agent: agent.reviewer
      input:
        goal: "input.goal"
        draft: "state.feedback"

  edges:
    - { from: start, to: first }
    - { from: first, to: second }
    - { from: second, to: end }

flow.research:
  description: Look one fact up and return what the researcher reported.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    feedback:
      type: string
  nodes:
    research:
      agent: agent.researcher
      input:
        goal: "input.goal"
  edges:
    - { from: start, to: research }
    - { from: research, to: end }

flow.research_pair:
  description: A tool loop, and then a second agent node reading what it left behind.
  # `flow.pair` above crosses the shared history channel between two agents that
  # have **no** tools, so what the second node is called with is the whole of the
  # first node's exchange. This is the same crossing with a tool loop on the
  # first node, which is what makes resolved q52's synthetic turn decidable: the
  # runtime closes the loop with a fixed user turn before it pins the output
  # tool, that turn belongs to one *request*, and the only way to see whether it
  # leaked into the conversation is to look at what the next node was called
  # with.
  inputs:
    goal:
      type: string
      min_length: 1
    draft:
      type: string
      min_length: 1
  outputs:
    verdict:
      enum: [approve, revise]
    feedback:
      type: string
  nodes:
    research:
      agent: agent.researcher
      input:
        goal: "input.goal"

    review:
      agent: agent.reviewer
      input:
        goal: "input.goal"
        draft: "state.feedback"

  edges:
    - { from: start, to: research }
    - { from: research, to: review }
    - { from: review, to: end }

flow.loose_review:
  description: Two calls whose output schema the native format could not close.
  # Two nodes over one model for `flow.pair`'s reason, pointed at the other
  # mechanism: the first node's pinned call is where a ladder is discovered and
  # the second is where the memo is observable (PRD §9 resolved q53). One node
  # would decide half the claim.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    verdict:
      enum: [approve, revise]
  nodes:
    review:
      agent: agent.loose_reviewer
      input:
        goal: "input.goal"

    review_again:
      agent: agent.loose_reviewer
      input:
        goal: "input.goal"
  edges:
    - { from: start, to: review }
    - { from: review, to: review_again }
    - { from: review_again, to: end }

flow.mixed_review:
  description: One flow whose two agents cannot ask for their output the same way.
  # `agent.reviewer`'s output is a closed shape and `agent.loose_reviewer`'s is
  # not, so the rung each one's pinned call starts on is a property of the agent
  # rather than of the model they share (PRD §9 resolved q53). Nothing about
  # this flow is about failure: it runs against an ordinary endpoint, and what
  # it makes visible is that one composition's agents are not all on one rung.
  inputs:
    goal:
      type: string
      min_length: 1
    draft:
      type: string
      min_length: 1
  outputs:
    verdict:
      enum: [approve, revise]
    feedback:
      type: string
  nodes:
    review:
      agent: agent.reviewer
      input:
        goal: "input.goal"
        draft: "input.draft"

    loose_review:
      agent: agent.loose_reviewer
      input:
        goal: "input.goal"
  edges:
    - { from: start, to: review }
    - { from: review, to: loose_review }
    - { from: loose_review, to: end }

flow.twin_endpoints:
  description: One model name on two endpoints, asked for its object in turn.
  # The fixture for the *other* half of the memo's key (PRD §9 resolved q53).
  # `flow.loose_review` runs two nodes over one endpoint, which is what makes a
  # remembered refusal observable at all; this runs two nodes over two endpoints
  # serving one model name, which is what makes a refusal that should **not**
  # travel observable. The refusing endpoint goes first, so a memo keyed by the
  # model name alone would already be in place when the second node's call is
  # composed — and that run still succeeds, on a rung nobody chose, which is why
  # it takes a fixture rather than an assertion on an existing one.
  inputs:
    goal:
      type: string
      min_length: 1
    draft:
      type: string
      min_length: 1
  outputs:
    verdict:
      enum: [approve, revise]
    feedback:
      type: string
  nodes:
    review:
      agent: agent.reviewer
      input:
        goal: "input.goal"
        draft: "input.draft"

    twin_review:
      agent: agent.twin_reviewer
      input:
        goal: "input.goal"
        draft: "input.draft"
  edges:
    - { from: start, to: review }
    - { from: review, to: twin_review }
    - { from: twin_review, to: end }

agent.tallier:
  # The shape grammar D10 makes unavoidable, and the one PRD §9 resolved q55 is
  # about: an array inside a result schema MUST carry `max_items`, §3.5 sends it
  # to the wire as `maxItems`, and no wire's native structured-output decoder
  # compiles it. Every family a lowering table strips is declared here — an
  # array bound, a pair of string lengths, numeric bounds two levels down inside
  # an array of objects — so what reaches the wire is decidable rather than
  # incidental, and so the *description* each stripped bound folds into is one
  # an author wrote rather than one this fixture happens to leave empty.
  #
  # The same agent is declared in `agent-openai` and `server-tools`, word for
  # word except its `model:`. Three wires, one schema: a projection that is
  # right on one of them and wrong on another is the failure the three fixtures
  # exist to separate.
  description: Lists what it found, under bounds a structured-output decoder cannot compile.
  model: model.smart
  prompt: |
    You are a tallier.

    List what the subject contains, one note per item.
  input:
    subject:
      description: What to tally.
      type: string
  output:
    headline:
      description: One line naming the subject.
      type: string
      min_length: 1
      max_length: 60
    tallies:
      description: What was found, one note per item.
      type: array
      max_items: 3
      items:
        type: object
        properties:
          label:
            description: What the note is about.
            type: string
          weight:
            description: How much it matters.
            type: number
            minimum: 0
            maximum: 1
    total:
      description: How many tallies there are.
      type: integer
      minimum: 0
      maximum: 3

flow.tally:
  description: One pass over the tallier — the array-bearing schema, on this wire.
  # `outputs: {}` deliberately. What this flow is for is the *request* and the
  # parse: an answer that overruns `max_items` has to fail the node, and a flow
  # that materialized the answer would need channels of its own in three
  # fixtures for nothing either assertion reads.
  inputs:
    subject:
      type: string
      min_length: 1
  outputs: {}
  nodes:
    tally:
      agent: agent.tallier
      input:
        subject: "input.subject"
  edges:
    - { from: start, to: tally }
    - { from: tally, to: end }
