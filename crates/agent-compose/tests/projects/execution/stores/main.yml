# M1 acceptance fixture: both store consumption surfaces (PRD 5.8).
#
# One definition, two usage surfaces:
#
#   * **store-op nodes** — `load`, `remember` and `reread` below: deterministic,
#     graph-invoked, schema-checked against `value_schema`, and under
#     `--target local` backed by SQLite/local disk with no infrastructure at all;
#   * **agent-attached** — `store.docs`, `store.prefs` and `store.artifacts` on
#     `agent.grounded`: codegen synthesizes LLM-facing tools from each store's
#     kind and schema (grammar 11.5), they appear in the model request the mock
#     records, and a model that calls one reaches the same backends the nodes do.
#     All three kinds are attached, so all three rows of 11.5's table are real.
#
# `agent_access:` is what makes the second surface worth a fixture of its own:
# `store.docs` is `read`, so the synthesized surface is `docs_search` and NOT
# `docs_upsert`, while `store.notes` — the same **kind** — takes the `read_write`
# default and gets both, and `store.prefs` gets `prefs_get` **and** `prefs_set`.
# The tool list of the recorded request is exactly that claim, checkable, and the
# two vector stores make it a comparison rather than an absence. The key itself
# is Decision D37 and still PRD §10's first open question — the grammar accepts
# it (M0), and if the PRD declines it this fixture drops the line and keeps
# everything else.
#
# `embed.provider` is an `openai_compatible` connection because embeddings are
# served by a provider that publishes the capability (grammar 11.2), and it is a
# different question from where the vectors live (`backend:`, omitted here — the
# `local` target substitutes local storage for every store unconditionally).
version: "0.1"

# The flow reads the store, writes it, and reads it **again**, and the second
# read is what makes the write observable: `store.prefs` is `scope: execution`,
# so a later run starts empty and nothing outside this execution can see what
# `remember` did. Both channels the re-read fills declare a default no write ever
# produces — `false`, and a `theme`/`verbosity` pair `remember` does not write —
# so an `op: set` that did nothing at all could not pass.
state:
  prefs_found:
    description: Whether the preferences store had anything for this key, before the write.
    type: boolean
    default: false
  prefs_found_after:
    description: Whether the second read found what `remember` wrote.
    type: boolean
    default: false
  recorded_prefs:
    description: What the second read got back, for comparison against what was written.
    type: object
    properties:
      theme:
        type: string
      verbosity:
        enum: [low, high]
    default: { theme: nothing was written, verbosity: high }
  answer:
    type: string
    default: ""

  # What `flow.ground` reads back out of the vector and blob backends. Every one
  # of these declares a default no op ever produces, so a stubbed backend that
  # answered nothing could not pass.
  stored_id:
    type: string
    default: nothing was indexed
  blob_found:
    type: boolean
    default: false
  blob_value:
    type: string
    default: nothing was stored
  blob_keys:
    description: The keys `listing` found, which is what a `list` answers.
    type: array
    max_items: 10
    items:
      type: string
    default: []

  # …and what `flow.remember` reads out of the session-scoped one, which is the
  # store whose whole point is surviving the execution that wrote it.
  seen_before:
    type: boolean
    default: false
  recalled:
    type: object
    properties:
      note:
        type: string
    default: { note: "" }

  # What `flow.ingest`'s model says it wrote down. The channel exists so the
  # subflow has an output to hand back; what it is asserted about is the trace,
  # not the string.
  ingested:
    type: string
    default: ""

  # What `flow.tally` reads back after a `map` of partial updates at one key —
  # with a default no run produces, so a read that found nothing cannot pass.
  tally:
    type: object
    properties:
      items:
        type: array
        max_items: 8
        items: { type: string }
      count: { type: integer }
      last: { type: string }
    default: { items: [], count: -1, last: nothing was read }

  # Whether `flow.claim`'s agent says it finished. What is asserted about is the
  # trace — the tool calls and the store records they left.
  claimed:
    type: boolean
    default: false

  # …and whether `flow.shelve`'s does. Its trace is what is asserted about too.
  shelved:
    type: boolean
    default: false

  # What `flow.catalogue` reads back a page at a time: one element per page,
  # the cursor each page hands the next, and what a `count` answered — each
  # with a default no read produces, so a page that answered nothing, a cursor
  # that never moved and a count that never ran all fail the assertions.
  pages:
    description: The keys of one page each, in the order the pages came back.
    type: array
    max_items: 8
    items:
      type: array
      max_items: 3
      items: { type: string }
    reduce: append
  cursor:
    description: The last key of the page read most recently — the next page's `after:`.
    type: string
    default: nothing was paged
  held:
    description: How many entries `flow.catalogue`'s `count` found.
    type: integer
    default: -1

  # …and the same three for `flow.long_walk`, whose pages are one key each and
  # whose walk is longer than the superstep ceiling allows a cycle bounded by
  # its guard alone.
  walked:
    description: The key of one page each, in the order the long walk read them.
    type: array
    max_items: 200
    items:
      type: array
      max_items: 1
      items: { type: string }
    reduce: append
  walk_cursor:
    description: The last `next` a page of the long walk answered.
    type: string
    default: nothing was paged
  walk_held:
    description: How many entries the long walk's `count` found.
    type: integer
    default: -1

  # PRD resolved q71: what `flow.move`'s two batches answered, and what a
  # page of the store held after them — each with a default no batch writes.
  moved:
    description: Whether the first move's batch answered `applied`.
    type: boolean
    default: false
  refused_at:
    description: The `failed` index the second, declined move answered.
    type: integer
    default: -1
  move_keys:
    description: The keys the moves left, in byte order.
    type: array
    max_items: 10
    items: { type: string }
    default: []
  # …and what a fan-out of batches left: how many keys under `item/`, and the
  # value at the one key every instance's batch shares.
  batched:
    description: How many `item/` keys the batches of `flow.batch_each` left.
    type: integer
    default: -1
  batched_last:
    description: The record at the key every batch of `flow.batch_each` writes.
    type: object
    properties:
      name: { type: string }
    default: { name: "nothing was batched" }
  # …and what `flow.typed`'s `set` and one-entry `batch` left of one value
  # its store's emitted Zod would refuse: the keys, and the batched record.
  typed_keys:
    description: The keys `flow.typed`'s `set` and `batch` left, in byte order.
    type: array
    max_items: 10
    items: { type: string }
    default: []
  typed_batched:
    description: The record `flow.typed`'s `batch` entry wrote.
    type: object
    properties:
      name: { type: string }
    default: { name: "nothing was batched" }

provider.mock:
  kind: anthropic
  api_key: ${MOCK_API_KEY}
  base_url: ${MOCK_BASE_URL}

provider.embeddings:
  kind: openai_compatible
  base_url: ${MOCK_BASE_URL}
  api_key: ${MOCK_API_KEY}

model.smart:
  provider: provider.mock
  id: claude-sonnet-4-6
  settings:
    max_tokens: 4096

store.prefs:
  kind: kv
  scope: execution
  description: What this run has been told about how to answer.
  value_schema:
    theme:
      type: string
    verbosity:
      enum: [low, high]

# `dimensions:` is asserted against what the provider answers (grammar 11.2), and
# `crates/mock-provider`'s embeddings surface answers an 8-wide vector — small on
# purpose, because nothing there is a language model. Declaring the width the
# harness really produces is what puts that assertion on the path a run takes;
# declaring 1536 here would only mean this fixture never reached a vector op.
store.docs:
  kind: vector
  scope: global
  description: Project documentation, chunked, for grounding answers.
  embed:
    model: text-embedding-3-small
    provider: provider.embeddings
    dimensions: 8
  metadata_schema:
    source: { type: string }
  agent_access: read

# The same kind as `store.docs` at the other `agent_access:`, which is what makes
# the narrowing a comparison rather than an absence: one attachment list offers
# `notes_upsert` and withholds `docs_upsert`. It is also the store a model can
# both write and read in one node, so the arguments a synthesized tool carries —
# including the `metadata:` an upsert supplies and the `filter:` a search matches
# it with — are observable from what a later tool call answers, with nothing
# staged behind it. `scope: execution` because it holds this run's own working
# notes and nothing after the run has any business reading them.
store.notes:
  kind: vector
  scope: execution
  description: What the model wrote down while answering.
  embed:
    model: text-embedding-3-small
    provider: provider.embeddings
    dimensions: 8
  metadata_schema:
    source: { type: string }

# The third kind (grammar 11.1): bulk content on local disk under
# `--target local`. It is reached both ways — store-op nodes in `flow.ground`,
# and the three tools grammar 11.5's third row synthesizes for an attached
# `blob` (`artifacts_get`, `artifacts_list`, `artifacts_put`), which is the row
# no other store here covers.
store.artifacts:
  kind: blob
  scope: global
  description: What a run wrote down, by name.

# `scope: session` is the one lifetime that outlives an execution, and this is
# the store that proves it: two runs sharing a `--session` see each other's
# writes, and a run with no session identity at all is refused at start naming
# this store (grammar 11.3, 13.2).
store.memory:
  kind: kv
  scope: session
  description: What this session has been told.
  value_schema:
    note:
      type: string

agent.grounded:
  description: Answers a question using the documentation it can search.
  model: model.smart
  prompt: |
    Answer the question. Search the documentation before answering, and record
    any preference the user states.
  stores: [store.docs, store.notes, store.prefs, store.artifacts]
  input:
    question: { type: string }
    known: { type: boolean }
  output:
    answer:
      type: string
      min_length: 1

flow.answer:
  description: Load preferences, answer a question, and record what was used.
  inputs:
    question:
      type: string
      min_length: 1
  outputs:
    answer:
      type: string
    prefs_found_after:
      type: boolean
    recorded_prefs:
      type: object
      properties:
        theme:
          type: string
        verbosity:
          enum: [low, high]
  nodes:
    load:
      store: store.prefs
      op: get
      key: "'preferences'"
      writes:
        found: prefs_found

    ask:
      agent: agent.grounded
      input:
        question: "input.question"
        known: "state.prefs_found"

    remember:
      store: store.prefs
      op: set
      key: "'preferences'"
      value:
        theme: "'default'"
        verbosity: "'low'"

    reread:
      store: store.prefs
      op: get
      key: "'preferences'"
      writes:
        found: prefs_found_after
        value: recorded_prefs

  edges:
    - { from: start, to: load }
    - { from: load, to: ask }
    - { from: ask, to: remember }
    - { from: remember, to: reread }
    - { from: reread, to: end }

# The other two kinds, end to end, with no model in the loop: a `vector` upsert
# and the search that finds it back, and a `blob` written, read and listed.
#
# `find` writes nothing. A node's result is readable only from an edge guard and
# a `map.over` (D42), so what a `search` answered is asserted from the **trace**
# instead — which is the record PRD 5.8 asks a read to leave behind, and the one
# place a `matches` row is observable at all.
flow.ground:
  description: Index one document, search for it, and round-trip a blob.
  inputs:
    text:
      type: string
      min_length: 1
  outputs:
    stored_id:
      type: string
    blob_found:
      type: boolean
    blob_value:
      type: string
    blob_keys:
      type: array
      max_items: 10
      items:
        type: string
  nodes:
    index:
      store: store.docs
      op: upsert
      key: "'doc-1'"
      value: "input.text"
      metadata:
        source: "'fixture'"
      writes:
        id: stored_id

    find:
      store: store.docs
      op: search
      query: "input.text"
      top_k: 3
      filter:
        source: "'fixture'"

    keep:
      store: store.artifacts
      op: put
      key: "'note.txt'"
      value: "input.text"
      content_type: text/plain

    reread:
      store: store.artifacts
      op: get
      key: "'note.txt'"
      writes:
        found: blob_found
        value: blob_value

    listing:
      store: store.artifacts
      op: list
      prefix: "'note'"
      limit: 10
      writes:
        keys: blob_keys

  edges:
    - { from: start, to: index }
    - { from: index, to: find }
    - { from: find, to: keep }
    - { from: keep, to: reread }
    - { from: reread, to: listing }
    - { from: listing, to: end }

# Cross-session memory, declaratively (PRD 5.8): the read happens before the
# write, so a second run under the same session key sees what the first left.
flow.remember:
  description: Recall what this session was told, then record what it says now.
  inputs:
    note:
      type: string
      min_length: 1
  outputs:
    seen_before:
      type: boolean
    recalled:
      type: object
      properties:
        note:
          type: string
  nodes:
    recall:
      store: store.memory
      op: get
      key: "execution.session_key"
      writes:
        found: seen_before
        value: recalled

    save:
      store: store.memory
      op: set
      key: "execution.session_key"
      value:
        note: "input.note"

  edges:
    - { from: start, to: recall }
    - { from: recall, to: save }
    - { from: save, to: end }

# The one key a declared `manual` trigger carries that changes what a CLI run
# **does** (grammar 13.2, §13's preamble: declaring the trigger "lets it carry a
# `description:` or a `session_key:` remap"). `flow.remember` above is reached
# through the *implicit* entry and keys off `--session` itself; this flow is
# reached through a declared one that remaps it, and it only reads — so which
# partition a run addressed is the whole of what it answers.
triggers:
  tenant_cli:
    type: manual
    flow: flow.tenant_recall
    session_key: '"tenant/" + payload.session'

flow.tenant_recall:
  description: Recall this session's note, under a trigger that remaps `--session`.
  outputs:
    seen_before:
      type: boolean
    recalled:
      type: object
      properties:
        note:
          type: string
  nodes:
    recall:
      store: store.memory
      op: get
      key: "execution.session_key"
      writes:
        found: seen_before
        value: recalled

  edges:
    - { from: start, to: recall }
    - { from: recall, to: end }

# A store write inside a **retried subflow**, which is where a trace can lose an
# effect that really happened (PRD 5.3, 5.8).
#
# A `flow:` node's attempt is a whole instance, and a retried one runs two: the
# first writes and fails somewhere after, the second re-derives the same
# idempotency key (grammar 9.4) and the backend dedupes it. Both instances have a
# trace, and only a report carrying both says what the execution did — the second
# alone reads as a run that wrote nothing and re-issued a duplicate with nothing
# to have duplicated.
#
# `agent.scribe` is what fails: the model answers with a status the route does
# not fail over on (there is no `route:` here at all), so the node fails after
# `save` has already had its effect. Which attempt fails is the script's to
# decide, so the same pair of flows decides both the retry that recovers and the
# retry that does not.
agent.scribe:
  description: Confirms in one line what was written down.
  model: model.smart
  prompt: Confirm the note in one line.
  input:
    note: { type: string }
  output:
    line:
      type: string
      min_length: 1

flow.ingest:
  description: Write a note to the session store, then have the model confirm it.
  inputs:
    note:
      type: string
      min_length: 1
  outputs:
    ingested:
      type: string
  nodes:
    save:
      store: store.memory
      op: set
      key: "execution.session_key"
      value:
        note: "input.note"

    confirm:
      agent: agent.scribe
      input:
        note: "input.note"
      writes:
        line: ingested

  edges:
    - { from: start, to: save }
    - { from: save, to: confirm }
    - { from: confirm, to: end }

flow.reingest:
  description: Instantiate `flow.ingest` under a `retry:`, so an attempt is an instance.
  inputs:
    note:
      type: string
      min_length: 1
  outputs:
    ingested:
      type: string
  nodes:
    sub:
      flow: flow.ingest
      input:
        note: "input.note"
      retry: { max: 1, backoff: 10ms }

  edges:
    - { from: start, to: sub }
    - { from: sub, to: end }

# PRD resolved q68 on the agent surface: `agent_access: full` adds a `kv`
# store's partial updates and `delete` beside `get` and `set`, and the default
# `read_write` keeps exactly the two tools it always had — `store.jobs` and
# `store.ledger` are the same kind on one attachment list, so the narrowing is a
# comparison rather than an absence. `jobs_set` carries the conditions at either
# level, because a condition narrows a write rather than widening it.
store.jobs:
  kind: kv
  scope: execution
  description: Who has claimed which job, and what they noted.
  agent_access: full
  value_schema:
    owner: { type: string }
    tags:
      type: array
      max_items: 20
      items: { type: string }
    count: { type: integer }

store.ledger:
  kind: kv
  scope: execution
  description: Notes about the run, one per key.
  value_schema:
    note: { type: string }

agent.claimer:
  description: Claims a job, then records what it did.
  model: model.smart
  prompt: Claim the job before working on it, and record what you did.
  stores: [store.jobs, store.ledger]
  input:
    job: { type: string }
  output:
    done: { type: boolean }

flow.claim:
  description: Let the agent claim a job, then read back what the store holds for it.
  inputs:
    job:
      type: string
      min_length: 1
  outputs:
    claimed:
      type: boolean
  nodes:
    work:
      agent: agent.claimer
      input:
        job: "input.job"
      writes:
        done: claimed
    reread:
      store: store.jobs
      op: get
      key: "input.job"
  edges:
    - { from: start, to: work }
    - { from: work, to: reread }
    - { from: reread, to: end }

# PRD resolved q68's `full` level read against Decision D119's split. `full`
# grants all six `kv` tools whatever the store's `value_schema` declares, and a
# call the store's contract refuses — a partial update whose result `V` does not
# admit, an `item` naming other than one field, an `incr` of a value with no
# numeric field, an `append` to one with no array field — goes back to the
# model rather than ending the agent node. `store.shelf` has two array fields
# and no numeric one, which is what makes an `item` naming two fields a call a
# model can make; `store.flat` has neither, so its `flat_append` and
# `flat_incr` are tools every call to which is refused.
store.shelf:
  kind: kv
  scope: execution
  description: Two short lists under a label.
  agent_access: full
  value_schema:
    label: { type: string }
    left:
      type: array
      max_items: 2
      items: { type: string }
    right:
      type: array
      max_items: 2
      items: { type: string }

store.flat:
  kind: kv
  scope: execution
  description: One title per key.
  agent_access: full
  value_schema:
    title: { type: string }

agent.shelver:
  description: Arranges the shelf.
  model: model.smart
  prompt: Arrange the shelf, and note any job you touch.
  stores: [store.shelf, store.flat, store.jobs]
  output:
    done: { type: boolean }

flow.shelve:
  description: Let the agent arrange the shelf, then read back what it holds.
  outputs:
    shelved:
      type: boolean
  nodes:
    work:
      agent: agent.shelver
      input: "'Arrange the shelf.'"
      writes:
        done: shelved
    reread:
      store: store.shelf
      op: get
      key: "'s'"
  edges:
    - { from: start, to: work }
    - { from: work, to: reread }
    - { from: reread, to: end }

# D67, read where it finally means what authors reach for: a `map` whose every
# instance writes **one** constant `kv` key. A `set` there would be a declared
# overwrite; an `append`, an `incr` and a `merge` are each serialized against
# every other write to the key, so every instance's change lands. The value is
# seeded whole first, because a partial update has to leave a value the schema
# admits and `V` here has three required fields.
store.tally:
  kind: kv
  scope: execution
  description: One record every instance of a fan-out adds to.
  value_schema:
    items:
      type: array
      max_items: 8
      items: { type: string }
    count: { type: integer }
    last: { type: string }

flow.tally_one:
  description: Add one item to the shared record.
  inputs:
    item:
      type: string
  outputs: {}
  nodes:
    add:
      store: store.tally
      op: append
      key: "'all'"
      field: items
      value: "input.item"
    bump:
      store: store.tally
      op: incr
      key: "'all'"
      field: count
    touch:
      store: store.tally
      op: merge
      key: "'all'"
      fields:
        last: "input.item"
  edges:
    - { from: start, to: add }
    - { from: add, to: bump }
    - { from: bump, to: touch }
    - { from: touch, to: end }

flow.tally:
  description: Fan out over the items, every instance adding to one key, and read it back.
  inputs:
    items:
      type: array
      max_items: 8
      items: { type: string }
  outputs:
    tally:
      type: object
      properties:
        items:
          type: array
          max_items: 8
          items: { type: string }
        count: { type: integer }
        last: { type: string }
  nodes:
    seed:
      store: store.tally
      op: set
      key: "'all'"
      value:
        items: "[]"
        count: "0"
        last: "''"
    each:
      map:
        over: input.items
        as: one
        node: flow.tally_one
        max_concurrency: 4
        input:
          item: "one"
    read:
      store: store.tally
      op: get
      key: "'all'"
      writes:
        value: tally
  edges:
    - { from: start, to: seed }
    - { from: seed, to: each }
    - { from: each, to: read }
    - { from: read, to: end }

# PRD resolved q71, end to end: a `batch` moves a record from one key to
# another — set the new one if it is absent, delete the old — in one
# transaction, and the flow routes on what it answered. The first move applies;
# the second asks the same of a store where the new key is no longer absent, so
# it declines at its first entry and applies nothing, its delete included, and
# answers `failed: 0`. The page read last is the store as the moves left it.
store.moves:
  kind: kv
  scope: execution
  description: Records under `open/` and `closed/`.
  value_schema:
    name: { type: string }

flow.move:
  description: Seed two open records, move one to `closed/` twice, and read the keys back.
  inputs:
    name:
      type: string
      min_length: 1
  outputs:
    moved: { type: boolean }
    refused_at: { type: integer }
    move_keys:
      type: array
      max_items: 10
      items: { type: string }
  nodes:
    seed:
      store: store.moves
      op: batch
      ops:
        - { op: set, key: "'open/' + input.name", value: { name: "input.name" } }
        - { op: set, key: "'open/other'", value: { name: "'other'" } }
    move:
      store: store.moves
      op: batch
      ops:
        - { op: set, key: "'closed/' + input.name", if: absent, value: { name: "input.name" } }
        - { op: delete, key: "'open/' + input.name" }
      writes:
        applied: moved
    again:
      store: store.moves
      op: batch
      ops:
        - { op: set, key: "'closed/' + input.name", if: absent, value: { name: "input.name" } }
        - { op: delete, key: "'open/other'" }
      writes:
        failed: refused_at
    look:
      store: store.moves
      op: list
      limit: 10
      writes:
        keys: move_keys
  edges:
    - { from: start, to: seed }
    - { from: seed, to: move }
    - { from: move, to: again, when: "move.output.applied" }
    - { from: move, to: end, else: true }
    - { from: again, to: look, when: "!again.output.applied" }
    - { from: again, to: end, else: true }
    - { from: look, to: end }

# D67, read for a `batch`: every instance of a `map` writes one batch of two
# keys — its own under `item/`, and the one key every instance shares. Each
# batch is a keyed `kv` write, so the constant key is admitted (form 2), and
# each is one transaction serialized on the partition: every instance's two
# keys land together, and the shared key holds one instance's record whole.
store.batches:
  kind: kv
  scope: execution
  description: One record per item, and the last one written.
  value_schema:
    name: { type: string }

flow.batch_one:
  description: Write one item's record and the shared last record, in one batch.
  inputs:
    item:
      type: string
  outputs: {}
  nodes:
    both:
      store: store.batches
      op: batch
      ops:
        - { op: set, key: "'item/' + input.item", value: { name: "input.item" } }
        - { op: set, key: "'last'", value: { name: "input.item" } }
  edges:
    - { from: start, to: both }
    - { from: both, to: end }

flow.batch_each:
  description: Fan out one batch per item, then count what landed and read the shared key.
  inputs:
    items:
      type: array
      max_items: 8
      items: { type: string }
  outputs:
    batched: { type: integer }
    batched_last:
      type: object
      properties:
        name: { type: string }
  nodes:
    each:
      map:
        over: input.items
        as: one
        node: flow.batch_one
        max_concurrency: 4
        input:
          item: "one"
    counted:
      store: store.batches
      op: count
      prefix: "'item/'"
      writes:
        count: batched
    last:
      store: store.batches
      op: get
      key: "'last'"
      writes:
        value: batched_last
  edges:
    - { from: start, to: each }
    - { from: each, to: counted }
    - { from: counted, to: last }
    - { from: last, to: end }

# PRD resolved q71's "every entry's schema check is q68's", end to end: a `set`
# node and a `batch` whose one entry is that same `set` write one value — an
# empty `name` under a `min_length: 1` that CEL typing does not decide — and
# both land. A store-op node's value is typed against `value_schema` at
# `validate` and not parsed against the emitted Zod at run time (q68's schema
# evolution), and a `batch` entry is held to exactly what its single op is.
store.typed:
  kind: kv
  scope: execution
  description: One record a `set` wrote and one a `batch` entry wrote.
  value_schema:
    name: { type: string, min_length: 1 }

flow.typed:
  description: Write one value with a `set` and again with a `batch` entry, and read both back.
  inputs:
    name:
      type: string
  outputs:
    typed_keys:
      type: array
      max_items: 10
      items: { type: string }
    typed_batched:
      type: object
      properties:
        name: { type: string }
  nodes:
    one_set:
      store: store.typed
      op: set
      key: "'single'"
      value: { name: "input.name" }
    one_batch:
      store: store.typed
      op: batch
      ops:
        - { op: set, key: "'batched'", value: { name: "input.name" } }
    typed_page:
      store: store.typed
      op: list
      limit: 10
      writes:
        keys: typed_keys
    typed_read:
      store: store.typed
      op: get
      key: "'batched'"
      writes:
        value: typed_batched
  edges:
    - { from: start, to: one_set }
    - { from: one_set, to: one_batch }
    - { from: one_batch, to: typed_page }
    - { from: typed_page, to: typed_read }
    - { from: typed_read, to: end }

# PRD resolved q70, end to end: a `kv` store written by a fan-out and then read
# back the way a flow reads one too large for one answer — a page at a time,
# each `list` taking the `next` the page before it answered as its `after:`,
# until a page answers none. A cycle bounded by its exit condition (grammar
# 7.4 clause 2): `has(more.output.next)` is the cursor's own presence, and the
# last page has none. Then a `count` of what the walk saw, and a `get_many` of
# one key the store holds and one it does not. `pages` is an `append` channel,
# so every page's `keys` is one element of it (Decision D58), and `cursor`
# keeps the last `next` a page answered, since the page that answers none
# writes nothing (Decision D110).
store.catalogue:
  kind: kv
  scope: execution
  description: One entry per name, keyed under `item/`.
  value_schema:
    name: { type: string }

flow.catalogue_one:
  description: Write one name's entry.
  inputs:
    name:
      type: string
  outputs: {}
  nodes:
    put:
      store: store.catalogue
      op: set
      key: "'item/' + input.name"
      value:
        name: "input.name"
  edges:
    - { from: start, to: put }
    - { from: put, to: end }

flow.catalogue:
  description: Write an entry per name, then page through them, count them, and read two back by key.
  inputs:
    names:
      type: array
      max_items: 8
      items: { type: string }
  outputs:
    pages:
      type: array
      max_items: 8
      items:
        type: array
        max_items: 3
        items: { type: string }
    cursor:
      type: string
    held:
      type: integer
  nodes:
    stock:
      map:
        over: input.names
        as: name
        node: flow.catalogue_one
        max_concurrency: 4
        input:
          name: "name"
    first:
      store: store.catalogue
      op: list
      prefix: "'item/'"
      limit: 3
      writes:
        keys: pages
        next: cursor
    more:
      store: store.catalogue
      op: list
      prefix: "'item/'"
      after: "state.cursor"
      limit: 3
      include_values: true
      writes:
        keys: pages
        next: cursor
    census:
      store: store.catalogue
      op: count
      prefix: "'item/'"
      writes:
        count: held
    fetch:
      store: store.catalogue
      op: get_many
      keys: "['item/' + input.names[0], 'item/nobody']"
  edges:
    - { from: start, to: stock }
    - { from: stock, to: first }
    - { from: first, to: more, when: "has(first.output.next)" }
    - { from: first, to: census, else: true }
    - { from: more, to: more, when: "has(more.output.next)" }
    - { from: more, to: census, else: true }
    - { from: census, to: fetch }
    - { from: fetch, to: end }

# …and the bound on a walk, which is the cycle's and nothing else's (grammar
# 7.4, 11.4). A page is at most 1000 keys and a walk is as many pages as its
# cycle runs, so what bounds a walk is what bounds any cycle. `flow.long_walk`
# declares it — `max_iterations: 148` on the back-edge, so the walk reads at
# most 150 pages: `first`'s, the one `more` reads on entering the cycle, and
# one per traversal — and the compiler's superstep ceiling is sized from that
# budget. `flow.long_walk_unbudgeted` is the same walk with the guard alone
# (clause 2), which declares no number of passes, so the ceiling allows the
# cycle its fixed allowance and no more: a walk of more pages than that fails
# the run, however near it was to the end. One key a page, so a walk past the
# allowance needs a hundred and fifty keys rather than a hundred and fifty
# thousand. The channels the walk fills mean what `flow.catalogue`'s do: one
# element per page, the cursor the last `next` a page answered, and the count
# the partition's.
store.stockroom:
  kind: kv
  scope: execution
  description: One entry per name, keyed under `item/`, for the long walks.
  value_schema:
    name: { type: string }

flow.stockroom_one:
  description: Write one name's entry.
  inputs:
    name:
      type: string
  outputs: {}
  nodes:
    put:
      store: store.stockroom
      op: set
      key: "'item/' + input.name"
      value:
        name: "input.name"
  edges:
    - { from: start, to: put }
    - { from: put, to: end }

flow.long_walk:
  description: Write an entry per name, then walk them a key a page under a declared budget of pages, and count them.
  inputs:
    names:
      type: array
      max_items: 200
      items: { type: string }
  outputs:
    walked:
      type: array
      max_items: 200
      items:
        type: array
        max_items: 1
        items: { type: string }
    walk_cursor:
      type: string
    walk_held:
      type: integer
  nodes:
    stock:
      map:
        over: input.names
        as: name
        node: flow.stockroom_one
        max_concurrency: 8
        input:
          name: "name"
    first:
      store: store.stockroom
      op: list
      prefix: "'item/'"
      limit: 1
      writes:
        keys: walked
        next: walk_cursor
    more:
      store: store.stockroom
      op: list
      prefix: "'item/'"
      after: "state.walk_cursor"
      limit: 1
      writes:
        keys: walked
        next: walk_cursor
    census:
      store: store.stockroom
      op: count
      prefix: "'item/'"
      writes:
        count: walk_held
  edges:
    - { from: start, to: stock }
    - { from: stock, to: first }
    - { from: first, to: more, when: "has(first.output.next)" }
    - { from: first, to: census, else: true }
    - { from: more, to: more, when: "has(more.output.next)", max_iterations: 148 }
    - { from: more, to: census, else: true }
    - { from: census, to: end }

flow.long_walk_unbudgeted:
  description: The same walk with its back-edge bounded by the guard alone.
  inputs:
    names:
      type: array
      max_items: 200
      items: { type: string }
  outputs:
    walked:
      type: array
      max_items: 200
      items:
        type: array
        max_items: 1
        items: { type: string }
    walk_held:
      type: integer
  nodes:
    stock:
      map:
        over: input.names
        as: name
        node: flow.stockroom_one
        max_concurrency: 8
        input:
          name: "name"
    first:
      store: store.stockroom
      op: list
      prefix: "'item/'"
      limit: 1
      writes:
        keys: walked
        next: walk_cursor
    more:
      store: store.stockroom
      op: list
      prefix: "'item/'"
      after: "state.walk_cursor"
      limit: 1
      writes:
        keys: walked
        next: walk_cursor
    census:
      store: store.stockroom
      op: count
      prefix: "'item/'"
      writes:
        count: walk_held
  edges:
    - { from: start, to: stock }
    - { from: stock, to: first }
    - { from: first, to: more, when: "has(first.output.next)" }
    - { from: first, to: census, else: true }
    - { from: more, to: more, when: "has(more.output.next)" }
    - { from: more, to: census, else: true }
    - { from: census, to: end }
