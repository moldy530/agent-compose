# Acceptance fixture: a flow's `finally:` node — the node an instance runs once
# when it ends, whatever its outcome (grammar §7.9, Decision D159, PRD resolved
# q76, `docs/trace.md` §3.5, `docs/durability.md` §3.5).
#
# Each flow is one claim the construct makes, and every finally node here
# leaves a mark a test can count: a line `${TALLY_BIN}/ended` appends to
# `$TALLY_LOG` — what the node read as `execution.outcome` and
# `execution.error` — or an item appended to `store.ended`, whose array is the
# order the finally nodes of nested instances ran in.
#
#   * `flow.ended` — a subprocess that exits with the code it is given, so one
#     flow ends `completed` or `failed` on its input alone, and its finally node
#     records which.
#   * `flow.skipped` and `flow.retired` — a body node that fails under
#     `on_error: skip` and under `on_error: { fallback: end }`. Both absorb the
#     failure, so both instances completed (D97), and the finally node says so
#     with no `execution.error` to read.
#   * `flow.nested` — a `flow:` node whose subflow has a finally node of its
#     own: the inner instance ends first, so its finally node runs first, and
#     the store's array is `["inner", "outer"]`.
#   * `flow.each` — a joined `map` into `flow.item`: every dispatched instance
#     runs its own finally node, and the map's flow runs its own after all of
#     them.
#   * `flow.released` — the same `map`, **detached**: each dispatch starts a
#     child execution (Decision D150), which runs its own finally node under its
#     own id when it ends.
#   * `flow.closed` — a finally node that is a `flow:` node, whose subflow makes
#     a model call, a counted subprocess run and another model call. A held
#     model call on either side of the subprocess is where a test kills the
#     process: before the finally node's effect landed, and after it landed but
#     before the execution's row closed.
#   * `flow.untidy` — a finally node that fails on every attempt of its
#     `retry:`: the execution's outcome, outputs and exit code are its body's,
#     and the failure is `finally_error` on the row and the envelope.
#   * `flow.paused` — a subflow that parks at a `human` node, under a flow with
#     a finally node of its own. A pause is not an end, so neither finally node
#     runs until the resumed run answers it — and then each runs once, inner
#     first.
#   * `flow.nested_failing` and `flow.each_failing` — `flow.nested` and
#     `flow.each` with a body that **fails**: a failure propagating out of a
#     subflow still runs the subflow's finally node first, and every item of a
#     failed fan-out runs its own before the map's flow runs its own.
#   * `flow.tooled` — a model calls `flow.toolish` as a tool: a flow-as-tool
#     instance runs its own finally node, before the agent node that called it
#     settles and the calling flow's finally node runs.
#   * `flow.timed` and `flow.fan_timed` — a `flow:` node and a joined `map` whose
#     own `timeout:` runs out while their instances sleep. The deadline stops
#     each instance, and the node fails only once that instance's finally node
#     has run — so the calling flow's finally node still runs last. An item the
#     map had not begun when the deadline ran out is never begun.
#   * `flow.policed` and `flow.hurried` — a `flow:` node's `policy:` (grammar
#     §9.3 level 1) reaching the finally node of the instance it starts: its
#     `retry:` re-runs a failing finally node, and its `timeout:` bounds one
#     that sleeps.
version: "0.1"

defaults:
  timeout: 60s

state:
  note:
    description: What the agent node of the body answered.
    type: string
    default: nothing yet
  worked:
    description: What the body's subprocess printed.
    type: string
    default: nothing yet

provider.mock:
  kind: anthropic
  api_key: ${MOCK_API_KEY}
  base_url: ${MOCK_BASE_URL}

model.smart:
  provider: provider.mock
  id: claude-sonnet-4-6
  settings:
    max_tokens: 4096

# `scope: global`, so the array outlives the run and a test reads it out of the
# store's own file once the run has ended.
store.ended:
  kind: kv
  scope: global
  description: Which instances ended, in the order their finally nodes ran.
  value_schema:
    order:
      type: array
      max_items: 16
      items: { type: string }

# The agent `flow.tooled` runs: its one tool is a flow with a finally node.
agent.closer:
  description: Calls its one tool, then writes a short note.
  model: model.smart
  prompt: |
    Call your tool once, then write one short note about the topic you are given.
  tools: [flow.toolish]
  input:
    topic:
      description: What to write a note about.
      type: string
  output:
    note:
      description: The note.
      type: string

agent.noter:
  description: Writes one short note about a topic.
  model: model.smart
  prompt: |
    Write one short note about the topic you are given.
  input:
    topic:
      description: What to write a note about.
      type: string
  output:
    note:
      description: The note.
      type: string

flow.ended:
  description: A subprocess that exits with the code it is given, and a record of how the run ended.
  inputs:
    code:
      type: integer
  outputs:
    worked:
      type: string
  nodes:
    work:
      exec:
        command: "${OPS_BIN}/sh"
        args: ["-c", "printf done; exit $CODE"]
        output:
          stdout: { type: string }
      input:
        code: "input.code"
      writes:
        stdout: worked
    record:
      exec:
        command: "${TALLY_BIN}/ended"
      input:
        outcome: "execution.outcome"
        error: "has(execution.error) ? execution.error : 'none'"
  edges:
    - { from: start, to: work }
    - { from: work, to: end }
  finally: record

flow.skipped:
  description: A body node whose failure `skip` absorbs.
  outputs: {}
  nodes:
    work:
      exec:
        command: "${OPS_BIN}/false"
      on_error: skip
    record:
      exec:
        command: "${TALLY_BIN}/ended"
      input:
        outcome: "execution.outcome"
        error: "has(execution.error) ? execution.error : 'none'"
  edges:
    - { from: start, to: work }
    - { from: work, to: end }
  finally: record

flow.retired:
  description: A body node whose failure retires its branch through a fallback to `end`.
  outputs: {}
  nodes:
    work:
      exec:
        command: "${OPS_BIN}/false"
      on_error: { fallback: end }
    record:
      exec:
        command: "${TALLY_BIN}/ended"
      input:
        outcome: "execution.outcome"
        error: "has(execution.error) ? execution.error : 'none'"
  edges:
    - { from: start, to: work }
    - { from: work, to: end }
  finally: record

flow.nested:
  description: A subflow with a finally node of its own, under a flow with one.
  outputs: {}
  nodes:
    step:
      flow: flow.inner
    outer_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'outer'"
  edges:
    - { from: start, to: step }
    - { from: step, to: end }
  finally: outer_end

flow.inner:
  description: The nested instance, which ends before the one that instantiated it.
  outputs: {}
  nodes:
    inner_work:
      exec:
        command: "${OPS_BIN}/true"
    inner_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'inner'"
  edges:
    - { from: start, to: inner_work }
    - { from: inner_work, to: end }
  finally: inner_end

flow.each:
  description: A joined fan-out whose every instance has a finally node.
  inputs:
    names:
      type: array
      max_items: 4
      items: { type: string }
  outputs: {}
  nodes:
    fan:
      map:
        over: input.names
        as: name
        node: flow.item
        max_concurrency: 1
        input:
          name: "name"
    all_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'all'"
  edges:
    - { from: start, to: fan }
    - { from: fan, to: end }
  finally: all_end

flow.released:
  description: The same fan-out, detached, so every instance is a child execution.
  inputs:
    names:
      type: array
      max_items: 4
      items: { type: string }
  outputs: {}
  nodes:
    fan:
      map:
        over: input.names
        as: name
        node: flow.item
        max_concurrency: 1
        detach: true
        input:
          name: "name"
    all_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'all'"
  edges:
    - { from: start, to: fan }
    - { from: fan, to: end }
  finally: all_end

flow.item:
  description: One dispatched instance, which records its own end.
  inputs:
    name:
      type: string
      min_length: 1
  outputs: {}
  nodes:
    item_work:
      exec:
        command: "${OPS_BIN}/true"
    item_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "input.name"
  edges:
    - { from: start, to: item_work }
    - { from: item_work, to: end }
  finally: item_end

flow.closed:
  description: A body that ends on its input, and a finally node with a model call either side of a counted subprocess.
  inputs:
    code:
      type: integer
  outputs: {}
  nodes:
    work:
      exec:
        command: "${OPS_BIN}/sh"
        args: ["-c", "exit $CODE"]
      input:
        code: "input.code"
    close:
      flow: flow.closing
      input:
        outcome: "execution.outcome"
  edges:
    - { from: start, to: work }
    - { from: work, to: end }
  finally: close

flow.closing:
  description: What `flow.closed` does once it has ended.
  inputs:
    outcome:
      type: string
  outputs: {}
  nodes:
    ask:
      agent: agent.noter
      input:
        topic: "input.outcome"
    mark:
      exec:
        command: "${TALLY_BIN}/ended"
      input:
        outcome: "input.outcome"
    settle:
      agent: agent.noter
      input:
        topic: "input.outcome"
  edges:
    - { from: start, to: ask }
    - { from: ask, to: mark }
    - { from: mark, to: settle }
    - { from: settle, to: end }

flow.untidy:
  description: A body that answers, and a finally node that fails on every attempt.
  inputs:
    topic:
      type: string
      min_length: 1
  outputs:
    note:
      type: string
  nodes:
    work:
      agent: agent.noter
      input:
        topic: "input.topic"
      writes:
        note: note
    record:
      exec:
        command: "${TALLY_BIN}/ended"
        args: ["--fail"]
      input:
        outcome: "execution.outcome"
      retry: { max: 2, backoff: 10ms }
  edges:
    - { from: start, to: work }
    - { from: work, to: end }
  finally: record

flow.paused:
  description: A subflow that parks at a person's question, under a flow with a finally node of its own.
  outputs: {}
  nodes:
    step:
      flow: flow.asking
    paused_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'outer'"
  edges:
    - { from: start, to: step }
    - { from: step, to: end }
  finally: paused_end

flow.asking:
  description: The nested instance, which parks before it ends.
  outputs: {}
  nodes:
    ask:
      human:
        input:
          question: { type: string }
        output:
          decision: { enum: [go, stop] }
      input:
        question: "'may the run go on?'"
      writes:
        decision: note
    asking_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'inner'"
  edges:
    - { from: start, to: ask }
    - { from: ask, to: end }
  finally: asking_end

flow.nested_failing:
  description: A subflow whose body fails, under a flow with a finally node of its own.
  outputs: {}
  nodes:
    step:
      flow: flow.inner_failing
    outer_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'outer'"
  edges:
    - { from: start, to: step }
    - { from: step, to: end }
  finally: outer_end

flow.inner_failing:
  description: The nested instance, which fails and still ends first.
  outputs: {}
  nodes:
    inner_work:
      exec:
        command: "${OPS_BIN}/false"
    inner_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'inner'"
  edges:
    - { from: start, to: inner_work }
    - { from: inner_work, to: end }
  finally: inner_end

flow.each_failing:
  description: A joined fan-out one of whose items fails, every item with a finally node.
  inputs:
    names:
      type: array
      max_items: 4
      items: { type: string }
  outputs: {}
  nodes:
    fan:
      map:
        over: input.names
        as: name
        node: flow.item_failing
        max_concurrency: 1
        input:
          name: "name"
    all_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'all'"
  edges:
    - { from: start, to: fan }
    - { from: fan, to: end }
  finally: all_end

flow.item_failing:
  description: One dispatched instance, which fails on the name `bad` and records its own end either way.
  inputs:
    name:
      type: string
      min_length: 1
  outputs: {}
  nodes:
    item_work:
      exec:
        command: "${OPS_BIN}/sh"
        args: ["-c", "test \"$NAME\" != bad"]
      input:
        name: "input.name"
    item_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "input.name"
  edges:
    - { from: start, to: item_work }
    - { from: item_work, to: end }
  finally: item_end

flow.tooled:
  description: An agent that calls a flow as a tool, under a flow with a finally node of its own.
  outputs:
    note:
      type: string
  nodes:
    ask:
      agent: agent.closer
      input:
        topic: "'the tool'"
      writes:
        note: note
    tooled_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'outer'"
  edges:
    - { from: start, to: ask }
    - { from: ask, to: end }
  finally: tooled_end

flow.toolish:
  description: The flow a model calls as a tool, which records its own end.
  outputs: {}
  nodes:
    tool_work:
      exec:
        command: "${OPS_BIN}/true"
    tool_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'tool'"
  edges:
    - { from: start, to: tool_work }
    - { from: tool_work, to: end }
  finally: tool_end

flow.timed:
  description: A flow node whose own timeout runs out while its instance sleeps.
  outputs: {}
  nodes:
    step:
      flow: flow.slow
      timeout: 1s
    timed_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'outer'"
  edges:
    - { from: start, to: step }
    - { from: step, to: end }
  finally: timed_end

flow.slow:
  description: An instance that sleeps past its caller's budget, and records its own end — slowly.
  outputs: {}
  nodes:
    slow_work:
      exec:
        command: "${OPS_BIN}/sleep"
        args: ["3"]
    # A `flow:` node, so the end takes long enough to lose a race: a finally node
    # that ran beside its caller's failure, rather than before it, would append
    # after the caller's own finally node did.
    slow_end:
      flow: flow.slow_closing
  edges:
    - { from: start, to: slow_work }
    - { from: slow_work, to: end }
  finally: slow_end

flow.slow_closing:
  description: What `flow.slow` does once it has ended — a pause, then its mark in the store.
  outputs: {}
  nodes:
    linger:
      exec:
        command: "${OPS_BIN}/sleep"
        args: ["1"]
    mark:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'slow'"
  edges:
    - { from: start, to: linger }
    - { from: linger, to: mark }
    - { from: mark, to: end }

flow.fan_timed:
  description: A joined fan-out whose own timeout runs out while its first item sleeps.
  inputs:
    names:
      type: array
      max_items: 4
      items: { type: string }
  outputs: {}
  nodes:
    fan:
      map:
        over: input.names
        as: name
        node: flow.slow_item
        max_concurrency: 1
        input:
          name: "name"
      timeout: 1s
    fan_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "'all'"
  edges:
    - { from: start, to: fan }
    - { from: fan, to: end }
  finally: fan_end

flow.slow_item:
  description: One dispatched instance, which sleeps past the map's budget and records its own end.
  inputs:
    name:
      type: string
      min_length: 1
  outputs: {}
  nodes:
    slow_work:
      exec:
        command: "${OPS_BIN}/sleep"
        args: ["3"]
    slow_end:
      store: store.ended
      op: append
      key: "'order'"
      field: order
      value: "input.name"
  edges:
    - { from: start, to: slow_work }
    - { from: slow_work, to: end }
  finally: slow_end

flow.policed:
  description: A flow node whose policy retries the finally node of the instance it starts.
  outputs: {}
  nodes:
    step:
      flow: flow.cleaning
      policy:
        retry: { max: 1, backoff: 10ms }
  edges:
    - { from: start, to: step }
    - { from: step, to: end }

flow.cleaning:
  description: A body that completes, and a finally node that fails on every attempt it is given.
  outputs: {}
  nodes:
    work:
      exec:
        command: "${OPS_BIN}/true"
    record:
      exec:
        command: "${TALLY_BIN}/ended"
        args: ["--fail"]
      input:
        outcome: "execution.outcome"
  edges:
    - { from: start, to: work }
    - { from: work, to: end }
  finally: record

flow.hurried:
  description: A flow node whose policy bounds the finally node of the instance it starts.
  outputs: {}
  nodes:
    step:
      flow: flow.napping
      policy:
        timeout: 1s
  edges:
    - { from: start, to: step }
    - { from: step, to: end }

flow.napping:
  description: A body that completes, and a finally node that sleeps past its budget.
  outputs: {}
  nodes:
    work:
      exec:
        command: "${OPS_BIN}/true"
    nap:
      exec:
        command: "${OPS_BIN}/sleep"
        args: ["3"]
  edges:
    - { from: start, to: work }
    - { from: work, to: end }
  finally: nap

triggers:
  cli: { type: manual, flow: flow.ended }
  # The status route's half of `flow.untidy`: an execution `serve` started, whose
  # report carries the `finally_error` beside the outcome it did not change.
  on_untidy:
    type: http
    flow: flow.untidy
    path: /untidy
    method: POST
    input:
      topic: "payload.body.topic"
    respond: async
