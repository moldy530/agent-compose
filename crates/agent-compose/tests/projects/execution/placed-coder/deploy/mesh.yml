# The deploy layer this fixture is served under: one hub, and one placement
# holding the agent that attaches the coder node's flow and that flow itself
# (grammar §14.1, `docs/distributed.md` §1.1).
version: "0.1"

hub:
  join_token: ${MESH_JOIN_TOKEN}

placements:
  mac:
    members:
      - agent.builder
      # The build step as a flow of its own (Decision D171): every instance of
      # it runs on a worker claiming `mac`.
      - flow.building
    description: The machine holding the checkout the build step runs in.
