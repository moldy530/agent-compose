# Acceptance fixture: the http-native events surface — who may call a trigger,
# who a delivery says it is, and where it may go (grammar 13.3, PRD resolved
# q32–q35).
#
# Every other fixture is about what a graph computes. This one is about the
# *edges* of a served app: the request that starts an execution, the two routes
# that reach one afterwards, and the webhooks that report its lifecycle. Each
# trigger below is one claim that surface has to be able to make.
#
#   * `guarded` — a `bearer:` scheme over the header and prefix grammar 13.3
#     defaults to. It is the shape a wrong, missing or truncated token is
#     refused in, and its flow finishes on its own so the refusal is observable
#     as "no execution started" rather than as a run that failed.
#   * `signed` — an `hmac:` scheme over the **raw request body bytes**, which is
#     the half a bearer token cannot stand in for: a body tampered with after
#     signing verifies differently, and a check that hashed a re-serialized
#     payload would accept it.
#   * `sealed` — the same `hmac:` scheme on the flow that **parks**, which is
#     what `signed` cannot be: a signature covers three routes and not one, and
#     what that costs a client differs per route because the credential is a
#     digest of the request's own body. Only an execution that stays open long
#     enough to be polled and answered can say what the status and resume routes
#     ask for, and `signed`'s flow finishes before either is reachable.
#   * `open` — no `auth:` at all, on the flow that parks. An execution a no-auth
#     trigger began keeps open routes, and that half of resolved q32 needs a
#     trigger of its own: a test that only watched a guarded execution refuse
#     could not tell enforcement from a route that refuses everybody.
#   * `watched` — the whole thing at once: an authenticated start, a flow that
#     parks, and callbacks that carry both outbound schemes to an allowlisted
#     receiver. It is the trigger the lifecycle assertions are about — a parking
#     webhook, a resume, a settle webhook, ordinals ascending — and the one a
#     crash lands in the middle of.
#   * `posted` — a `callback:` with no outbound auth and no allowlist, which is
#     the documented test posture (resolved q33) and the shape a retry is
#     cheapest to observe in: the flow does not park, so the only delivery is
#     the settle.
#   * `escorted` — a parking with a **detached** delivery still running under it.
#     Grammar 8.6 rule 7 says nothing a detached dispatch does may delay the
#     enclosing instance, and a quiescence is one of the things that can be
#     delayed: its sink is a `flow.*` whose node blocks until this test releases
#     it, so an execution that owes a parking webhook owes it while work of that
#     kind is in flight.
#   * `fanned` — one execution that parks **several times at once**: a `map`
#     over a flow whose items linger for different lengths of time before they
#     reach their `human` node. A quiescence is the moment the last of them
#     parks, and resolved q34 owes it one webhook listing every pause — which
#     is a claim no single-pause flow above can make, and the one a coalescing
#     rule written as a debounce fails.
#
# The allowlist is written with a wildcard where the **port** goes, because a
# loopback receiver binds a port the operating system chose. That is the entry
# an author writes for a receiver whose address is not fixed, and `/allowed*`
# beside it is what makes a second path on the same host refusable — which is
# how a test can point one delivery inside the list and one outside it without
# needing two receivers.
version: "0.1"

state:
  noted:
    description: What the flow that does not pause answered.
    type: string
    default: nothing yet
  decision:
    description: What the person answered.
    enum: [approve, reject]
    default: reject
  verdicts:
    description: One element per dispatched instance, in source-item order.
    type: array
    max_items: 8
    items: { enum: [approve, reject] }
    reduce: append

flow.note:
  description: One deterministic step — an execution that starts, finishes, and settles.
  inputs:
    topic:
      type: string
      min_length: 1
  outputs:
    noted:
      type: string
  nodes:
    # A subprocess that counts its own executions rather than a bare `printf`,
    # because "the refused request started **no** execution" is otherwise not an
    # assertion a test can make: a `401` says what the route answered and says
    # nothing about what ran behind it. The shim appends one line per run, so a
    # log of admitted calls and no refusals is what a test counts.
    note:
      exec:
        command: "${TALLY_BIN}/tally"
        output:
          stdout: { type: string }
      writes:
        stdout: noted
  edges:
    - { from: start, to: note }
    - { from: note, to: end }

flow.review:
  description: Park at a pause — the execution a lifecycle subscriber hears about twice.
  inputs:
    topic:
      type: string
      min_length: 1
  outputs:
    decision:
      enum: [approve, reject]
  nodes:
    # No `timeout:`, so the wait is open until somebody answers it: a budget
    # would make "the process was restarted" a race against the clock rather
    # than the thing under test.
    sign_off:
      human:
        input:
          note: { type: string }
        output:
          decision: { enum: [approve, reject] }
      input:
        note: "input.topic"
  edges:
    - { from: start, to: sign_off }
    - { from: sign_off, to: end }

flow.escort:
  description: The sink of a detached dispatch — work that runs until it is released.
  inputs:
    topic:
      type: string
      min_length: 1
  # Nothing comes back out: a detached dispatch is resolved the moment it is
  # issued, so a sink that wrote state would be writing it after everything that
  # reads it (grammar 8.6 rule 7, Decisions D31, D94).
  outputs: {}
  nodes:
    # A subprocess that blocks until this test releases it, which is what makes
    # "the delivery was still running when the webhook arrived" a fact rather
    # than a race: the shim writes its line before it starts waiting, and it
    # cannot exit until a file the test creates exists.
    hold:
      exec:
        command: "${TALLY_BIN}/hold"
        output:
          stdout: { type: string }
  edges:
    - { from: start, to: hold }
    - { from: hold, to: end }

flow.escorted:
  description: Detach a long sink, then park — a parking the sink may not hold back.
  inputs:
    topic:
      type: string
      min_length: 1
    topics:
      description: One detached delivery per element.
      type: array
      max_items: 4
      items: { type: string }
  outputs:
    decision:
      enum: [approve, reject]
  nodes:
    # The sink is a `flow.*` rather than a `tool.*` because that is the shape
    # the reading is about: a dispatched subflow runs *nodes*, under this
    # execution's id, and a quiescence that counted them would wait for work
    # grammar 8.6 rule 7 says nothing waits for. A detached `tool.*` runs no
    # node and could not tell the two readings apart.
    escort:
      map:
        over: input.topics
        as: one
        node: flow.escort
        max_concurrency: 2
        detach: true
        input:
          topic: "one"
    # What makes the pause below open **with the delivery in flight** rather
    # than racing it: this shim waits for the line the sink writes before it
    # blocks. Without it a test would be asserting about which of the two
    # reached its first `await` first, and a build that held the parking back
    # would pass whenever the pause won.
    escorting:
      exec:
        command: "${TALLY_BIN}/escorting"
        output:
          stdout: { type: string }
      writes:
        stdout: noted
    sign_off:
      human:
        input:
          note: { type: string }
        output:
          decision: { enum: [approve, reject] }
      input:
        note: "input.topic"
  edges:
    - { from: start, to: escort }
    - { from: escort, to: escorting }
    - { from: escorting, to: sign_off }
    - { from: sign_off, to: end }

flow.consider:
  description: Linger, then park — one item of a fan-out that parks several times over.
  inputs:
    topic:
      type: string
      min_length: 1
    linger:
      type: string
      min_length: 1
  outputs:
    decision:
      enum: [approve, reject]
  nodes:
    # The awaited work that makes the parkings **stagger**. Every item of the
    # fan-out below opens its pause at a different moment, which is the shape a
    # coalescing rule written as a debounce gets wrong: one webhook goes out per
    # item, each listing a growing prefix of one quiescence's pauses.
    linger:
      exec:
        command: "${TALLY_BIN}/linger"
        output:
          stdout: { type: string }
      input:
        pause_for: "input.linger"
      writes:
        stdout: noted
    sign_off:
      human:
        input:
          note: { type: string }
        output:
          decision: { enum: [approve, reject] }
      input:
        note: "input.topic"
  edges:
    - { from: start, to: linger }
    - { from: linger, to: sign_off }
    - { from: sign_off, to: end }

flow.stagger:
  description: One quiescence holding several pauses — the `map` over a flow that parks.
  inputs:
    items:
      type: array
      max_items: 8
      items:
        type: object
        properties:
          topic: { type: string }
          linger: { type: string }
  outputs:
    verdicts:
      type: array
      max_items: 8
      items: { enum: [approve, reject] }
  nodes:
    review:
      map:
        over: input.items
        as: one
        node: flow.consider
        max_concurrency: 4
        input:
          topic: "one.topic"
          linger: "one.linger"
        writes:
          decision: verdicts
  edges:
    - { from: start, to: review }
    - { from: review, to: end }

triggers:
  guarded:
    type: http
    flow: flow.note
    method: POST
    path: /guarded
    respond: async
    input:
      topic: "payload.body.topic"
    auth:
      bearer:
        token: ${EVENTS_TOKEN}

  signed:
    type: http
    flow: flow.note
    method: POST
    path: /signed
    respond: async
    input:
      topic: "payload.body.topic"
    auth:
      hmac:
        secret: ${EVENTS_SECRET}
        header: X-Hub-Signature-256
        algorithm: sha256
        encoding: hex
        prefix: "sha256="

  # `signed`'s scheme on a flow that stays open, so the status and resume routes
  # of one of its executions can be asked what an `hmac:` credential is on a
  # route that carries no body and on one that carries a different body than the
  # start did.
  sealed:
    type: http
    flow: flow.review
    method: POST
    path: /sealed
    respond: async
    input:
      topic: "payload.body.topic"
    auth:
      hmac:
        secret: ${EVENTS_SECRET}
        header: X-Hub-Signature-256
        algorithm: sha256
        encoding: hex
        prefix: "sha256="

  open:
    type: http
    flow: flow.review
    method: POST
    path: /open
    respond: async
    input:
      topic: "payload.body.topic"

  watched:
    type: http
    flow: flow.review
    method: POST
    path: /watched
    respond: async
    input:
      topic: "payload.body.topic"
    callback: "payload.body.callback_url"
    auth:
      bearer:
        token: ${EVENTS_TOKEN}
    callback_auth:
      # Both schemes together, which grammar 13.3 makes legal outbound and not
      # inbound: a receiver that checks a token and a receiver that verifies a
      # signature are two receivers, and one trigger may deliver to one that
      # does both. The header and prefix are declared away from their defaults
      # so an assertion can say which layer of the request a value came from.
      bearer:
        token: ${DELIVERY_TOKEN}
        header: X-Delivery-Token
        prefix: "Token "
      hmac:
        secret: ${DELIVERY_SECRET}
    callback_allow:
      - "http://127.0.0.1:*/allowed*"

  posted:
    type: http
    flow: flow.note
    method: POST
    path: /posted
    respond: async
    input:
      topic: "payload.body.topic"
    callback: "payload.body.callback_url"

  # The execution whose parking a **detached** delivery must not hold back
  # (grammar 8.6 rule 7, resolved q34): the sink is still running when the pause
  # opens, and the webhook the subscriber is owed is owed then rather than when
  # the delivery finally releases.
  escorted:
    type: http
    flow: flow.escorted
    method: POST
    path: /escorted
    respond: async
    input:
      topic: "payload.body.topic"
      topics: "payload.body.topics"
    callback: "payload.body.callback_url"
    auth:
      bearer:
        token: ${EVENTS_TOKEN}

  # The fan-out that parks: one execution holding several pauses opened at
  # different moments, subscribed to by a receiver. Its `callback:` carries no
  # outbound auth — the documented test posture (resolved q33) — because what
  # it is here to say is *how many* deliveries a quiescence makes, and the
  # signing half is `watched`'s to say.
  fanned:
    type: http
    flow: flow.stagger
    method: POST
    path: /fanned
    respond: async
    input:
      items: "payload.body.items"
    callback: "payload.body.callback_url"
    auth:
      bearer:
        token: ${EVENTS_TOKEN}
