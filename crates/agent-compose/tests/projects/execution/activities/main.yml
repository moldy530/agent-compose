# M1 acceptance fixture: the deterministic node kinds, multicast, and the two
# error strategies that are routing outcomes.
#
# Every other fixture is about the model. This one is about everything a compiled
# graph does *around* it, and each flow is one claim:
#
#   * `flow.pipeline` — a fork whose two guards are not provably exclusive, so
#     both edges fire and the node they meet at runs **once** (grammar 7.3 rule 6,
#     7.6 P2). On the way it runs the three deterministic kinds: an inline `http:`
#     node whose envelope `status` and decoded body field come back together
#     (grammar 8.3), an inline `exec:` node whose result is the process envelope
#     (grammar 8.2), and a `function:` node over a `tool.*` whose single
#     string-typed property takes raw stdout (grammar 6.1). It ends on a node
#     declaring `on_error: skip`, whose guard-over-its-own-output goes false while
#     its `else:` sibling fires — Decision D97, which is the one thing a skip
#     changes about routing.
#   * `flow.deadline` — a node whose `timeout:` runs out while a child process
#     sleeps, and whose `on_error: { fallback: … }` schedules another node instead
#     of evaluating its own edges (grammar 9.2, Decision D21).
#   * `flow.plumbing` — how an inline node's parameters reach the process and the
#     wire: `input:` bindings arriving as upper-snake-cased environment variables
#     beside the block's own `env:`, a scalar `input:` arriving on stdin, and the
#     two widened accepted-outcome lists that turn a failure into routable data
#     (grammar 8.2, 8.3, Decisions D84, D88).
#   * `flow.visibility` — what a guard sees when a fork's two branches run in one
#     step: its own node's writes, and **not** a concurrent sibling's
#     (grammar 7.6 P1, read per node).
#   * `flow.ordering` — two concurrent writers of one `append` channel whose node
#     ids run opposite to both their completion order and their declaration
#     order, so only grammar 7.6.4 clause 1 explains the result.
#   * `flow.unset` and `flow.unset_expression` — reading a channel nothing has
#     written fails the **execution**, naming the channel and the reader, and
#     neither `on_error: skip` nor a `fallback:` absorbs it: those are strategies
#     over a node's own error (grammar 10.1, 9.2, Decisions D78, D97, D110).
#   * `flow.dead_end` — a completed node whose every outgoing edge is untaken,
#     which is grammar 7.3 rule 7's failure. It is also the flow that fails
#     *after* a step has landed, which is what makes the trace of a failed run
#     assertable: what the first node wrote and routed is recorded, and so is the
#     guard that answered `false` at the node the run stopped at (PRD 5.3).
#
# The environment is the harness's: `${OPS_URL}` is an HTTP server the test
# controls and `${OPS_BIN}` a directory of ordinary commands, so nothing here
# needs infrastructure to run in CI.
version: "0.1"

defaults:
  timeout: 30s
  on_error: fail

state:
  note:
    description: The planner's note, written by name from its output.
    type: string
    default: ""
  report:
    description: What the run produced; written by whichever branch got there.
    type: string
    default: ""
  status:
    description: The status the probe saw.
    type: integer
    default: 0
  checks:
    description: One element per completed check (grammar 10.2's `append`).
    type: array
    max_items: 8
    items: { type: string }
    reduce: append
  beacon:
    description: Written by one branch of a fork; read by the other branch's guard.
    type: string
    default: ""
  witness:
    description: Written by the node whose own guard then reads it.
    type: string
    default: ""
  pending:
    description: >-
      No `default:`, and nothing writes it — so it is **unset**, and reading it
      fails the execution naming the channel and the reader (grammar 10.1,
      Decision D78). The one channel here that exists to be unreadable.
    type: string

provider.mock:
  kind: anthropic
  api_key: ${MOCK_API_KEY}
  base_url: ${MOCK_BASE_URL}

model.smart:
  provider: provider.mock
  id: claude-sonnet-4-6
  settings:
    max_tokens: 4096

agent.planner:
  description: Decides how much work the goal needs.
  model: model.smart
  prompt: |
    Plan the work. Answer `fast` when a probe is enough and `thorough` when it
    is not, and write one note either way.
  input:
    goal:
      type: string
  output:
    verdict:
      enum: [fast, thorough]
    note:
      type: string

tool.echo:
  description: Echo one line of text back.
  input:
    text:
      type: string
      min_length: 1
  output:
    snippet:
      description: The echoed text; one string property, so raw stdout binds to it.
      type: string
  exec:
    command: printf
    args: ["%s", "echoed"]

tool.rank:
  description: Rank the candidates by the host's own rule.
  input:
    text:
      type: string
      min_length: 1
  output:
    ranked:
      type: string
  # Grammar 6.1's escape hatch: the implementation lives outside the spec, and a
  # project using one does not run until the host registers it. That is the whole
  # of what "breaks spec portability" costs, made observable.
  function:
    name: rank_candidates

tool.pending_reader:
  description: Takes one argument, whose name is the unset channel's.
  input:
    # No binding names this at the node, so grammar 8.0 step 2 resolves it from
    # the state channel of the same name — which is unset.
    pending:
      type: string
  output:
    seen:
      description: One string property, so raw stdout binds to it.
      type: string
  exec:
    command: printf
    args: ["%s", "seen"]

flow.pipeline:
  description: Fan out over two checks, join them, and finish.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    report:
      type: string
    status:
      type: integer
    checks:
      type: array
      max_items: 8
      items: { type: string }
  nodes:
    plan:
      agent: agent.planner
      input:
        goal: "input.goal"

    # An inline `http:` node: `status` is the response envelope and `requests` is
    # decoded out of the JSON body (grammar 8.3, Decision D56).
    probe:
      http:
        method: GET
        url: "${OPS_URL}/_mock/state"
        output:
          status: { type: integer }
          requests: { type: integer }
      writes:
        status: status

    # A `function:` node: the arguments are checked field-by-field against the
    # tool's declared `input` (grammar 8.4), and the tool's own result schema is
    # what decodes stdout.
    check:
      function: tool.echo
      input:
        text: "state.note"
      writes:
        snippet: report

    # The convergence: reached by both branches of the fork, and run once
    # (grammar 7.6 P2).
    merge:
      exec:
        command: printf
        args: ["%s", "merged"]
        output:
          stdout: { type: string }
      writes:
        stdout: checks

    # `on_error: skip` — the command exits 1, which is outside the default
    # `expect_exit: [0]`, so the node produces no output and writes nothing.
    tally:
      exec:
        command: "${OPS_BIN}/false"
        output:
          exit_code: { type: integer }
      on_error: skip

    publish:
      exec:
        command: printf
        args: ["%s", "published"]
        output:
          stdout: { type: string }
      writes:
        stdout: report

    # The branch a skip does **not** take. It appends rather than setting
    # `report`, because the conservative concurrency analysis (grammar 7.6.1)
    # reads it and `publish` as concurrent — they are reached through the two
    # edges of the fork's co-takeable pair and neither reaches the other — and an
    # unreduced channel with two such writers is a compile error (grammar 10.2).
    rework:
      exec:
        command: printf
        args: ["%s", "reworked"]
        output:
          stdout: { type: string }
      writes:
        stdout: checks

  edges:
    - { from: start, to: plan }
    # Two guards the validator cannot prove exclusive — the first reads an enum
    # field, the second a string one — so `plan` is a fork and both fire when
    # both are true (grammar 7.6.1 rule 2).
    - { from: plan, to: probe, when: "plan.output.verdict == 'fast'" }
    - { from: plan, to: check, when: "plan.output.note != ''" }
    # The `else:` escape: exhaustiveness clause 1, and what fires when neither
    # guard does.
    - { from: plan, to: merge, else: true }
    - { from: probe, to: merge }
    - { from: check, to: merge }
    - { from: merge, to: tally }
    # A skipped node's guard over its own output is `false` (Decision D97), and
    # the `else:` edge §7.6.3 rule 3 requires is what fires instead.
    - { from: tally, to: rework, when: "tally.output.exit_code == 1" }
    - { from: tally, to: publish, else: true }
    - { from: publish, to: end }
    - { from: rework, to: end }

flow.entry:
  description: Guarded `start` edges, which have no node to be evaluated at.
  inputs:
    pick:
      type: boolean
  outputs:
    report:
      type: string
  nodes:
    left:
      exec:
        command: printf
        args: ["%s", "left"]
        output:
          stdout: { type: string }
      writes:
        stdout: report
    right:
      exec:
        command: printf
        args: ["%s", "right"]
        output:
          stdout: { type: string }
      writes:
        stdout: report
  edges:
    # Grammar 7.2 admits a guard on an edge leaving `start`, where the roots are
    # `input`/`state`/`execution` — `start` has no output. Grammar 7.6.3 rule 2
    # then requires one of them to be guaranteed, which the `else:` is.
    - { from: start, to: left, when: "input.pick" }
    - { from: start, to: right, else: true }
    - { from: left, to: end }
    - { from: right, to: end }

flow.hosted:
  description: The escape hatch, on its own, so what it costs is visible.
  outputs:
    report:
      type: string
  nodes:
    rank:
      function: tool.rank
      input:
        text: "'candidates'"
      writes:
        ranked: report
  edges:
    - { from: start, to: rank }
    - { from: rank, to: end }

flow.deadline:
  description: A node that runs out of time, and the fallback that takes over.
  outputs:
    report:
      type: string
  nodes:
    slow:
      exec:
        command: "${OPS_BIN}/sleep"
        args: ["30"]
        output:
          exit_code: { type: integer }
      # The budget bounds **one node execution, all retry attempts included**
      # (grammar 9.1: "retry attempts consume the node's `timeout` budget"), so
      # these three retries never happen — the first attempt spends the whole
      # 300ms on its own. The trace has to say so: what the node *did*, not what
      # its policy allowed.
      retry: { max: 3, backoff: 50ms }
      timeout: 300ms
      on_error: { fallback: rescue }

    rescue:
      exec:
        command: printf
        args: ["%s", "rescued"]
        output:
          stdout: { type: string }
      writes:
        stdout: report

  edges:
    - { from: start, to: slow }
    - { from: slow, to: end }
    - { from: rescue, to: end }

flow.plumbing:
  description: How an inline node's parameters reach the process and the wire.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    report:
      type: string
    status:
      type: integer
    checks:
      type: array
      max_items: 8
      items: { type: string }
  nodes:
    # Grammar 8.2: the node-level `input:` bindings are the object passed to the
    # child **as environment variables**, upper-snake-cased on the way in — so
    # `goal:` arrives as `$GOAL`. The block's own `env:` writes into that same
    # environment, and a key equal to a binding's upper-snake-cased name would be
    # the collision Decision D66 refuses; `SUFFIX` is not one.
    environ:
      exec:
        command: "${OPS_BIN}/sh"
        args: ["-c", 'printf "%s/%s" "$GOAL" "$SUFFIX"']
        env:
          SUFFIX: "from-env"
        output:
          stdout: { type: string }
      input:
        goal: "input.goal"
      writes:
        stdout: report

    # The other `input:` form on the one node kind that has a destination for an
    # unnamed value: a scalar binding goes on the child's **stdin** (grammar 8.0's
    # table, Decision D88). `cat` is how a test reads what was written there.
    piped:
      exec:
        command: "${OPS_BIN}/cat"
        output:
          stdout: { type: string }
      input: "input.goal + '/from-stdin'"
      writes:
        stdout: checks

    # Widened `expect_exit`: `false` exits 1, which the default `[0]` makes a node
    # error and this makes an accepted outcome. Declaring `exit_code:` is the
    # *decoding* choice and never turns a failure into data on its own — widening
    # is what does (grammar 8.2, Decision D84) — so the guard below routes on a
    # status a run under the default would never reach.
    tolerated:
      exec:
        command: "${OPS_BIN}/false"
        expect_exit: [0, 1]
        output:
          exit_code: { type: integer }
          stdout: { type: string }

    # The same widening on the response side: this route does not exist, the mock
    # answers 404, and the default (any 2xx) would make it a node error
    # (grammar 8.3, Decision D84).
    absent:
      http:
        method: GET
        url: "${OPS_URL}/_mock/no-such-route"
        expect_status: [200, 404]
        output:
          status: { type: integer }
      writes:
        status: status

  edges:
    - { from: start, to: environ }
    - { from: environ, to: piped }
    - { from: piped, to: tolerated }
    # Routable data, not a node error: under the default `expect_exit` the run
    # would have aborted at `tolerated` instead of arriving here.
    - { from: tolerated, to: absent, when: "tolerated.output.exit_code == 1" }
    - { from: tolerated, to: end, else: true }
    - { from: absent, to: end }

flow.visibility:
  description: What a guard sees of the step it was evaluated in.
  outputs:
    report:
      type: string
    checks:
      type: array
      max_items: 8
      items: { type: string }
  nodes:
    # Two unconditional edges leave `fork`, so both branches run in one step
    # (grammar 7.3 rule 6) and `alpha` and `bravo` are concurrent (7.6.1).
    fork:
      exec:
        command: printf
        args: ["%s", "forked"]
        output:
          stdout: { type: string }
      writes:
        stdout: report

    alpha:
      exec:
        command: printf
        args: ["%s", "lit"]
        output:
          stdout: { type: string }
      writes:
        stdout: beacon

    bravo:
      exec:
        command: printf
        args: ["%s", "bravo"]
        output:
          stdout: { type: string }
      writes:
        stdout: witness

    # Both are reached from `bravo`'s own fork, so the conservative analysis
    # calls them concurrent (grammar 7.6.1) — hence the reduced channel, even
    # though only one of the two guards can be true.
    sibling:
      exec:
        command: printf
        args: ["%s", "sibling"]
        output:
          stdout: { type: string }
      writes:
        stdout: checks

    mine:
      exec:
        command: printf
        args: ["%s", "mine"]
        output:
          stdout: { type: string }
      writes:
        stdout: checks

  edges:
    - { from: start, to: fork }
    - { from: fork, to: alpha }
    - { from: fork, to: bravo }
    - { from: alpha, to: end }
    # `alpha` writes `beacon` in this same step, and this guard does not see it:
    # grammar 7.6's P1 is per node, and routing is part of `bravo`'s own task.
    - { from: bravo, to: sibling, when: "state.beacon == 'lit'" }
    # `bravo`'s own write **is** visible, through its channel's reduce policy —
    # the half of the same rule that has to keep working.
    - { from: bravo, to: mine, when: "state.witness == 'bravo'" }
    - { from: bravo, to: end, else: true }
    - { from: sibling, to: end }
    - { from: mine, to: end }

flow.ordering:
  description: One `append` channel, two concurrent writers, one canonical order.
  outputs:
    checks:
      type: array
      max_items: 8
      items: { type: string }
  nodes:
    # `alpha` sorts first by node id and finishes last; `zulu` sorts last and
    # finishes first, and its edge is declared first. Only grammar 7.6.4 clause 1
    # — writers ordered by ascending node id — puts `alpha` first in the result.
    split:
      exec:
        command: printf
        args: ["%s", "split"]
        output:
          stdout: { type: string }

    alpha:
      exec:
        command: "${OPS_BIN}/sh"
        args: ["-c", 'sleep 0.3; printf "%s" alpha']
        output:
          stdout: { type: string }
      writes:
        stdout: checks

    zulu:
      exec:
        command: printf
        args: ["%s", "zulu"]
        output:
          stdout: { type: string }
      writes:
        stdout: checks

  edges:
    - { from: start, to: split }
    - { from: split, to: zulu }
    - { from: split, to: alpha }
    - { from: alpha, to: end }
    - { from: zulu, to: end }

flow.unset:
  description: A name-based read of a channel nothing has written.
  outputs:
    report:
      type: string
  nodes:
    # No `input:` here: grammar 8.0 step 2 resolves the tool's `pending` argument
    # from the state channel of the same name, and that channel is unset. The
    # `on_error: skip` is the point — a strategy over the node's *own* error does
    # not absorb an execution failure (grammar 10.1, Decision D78).
    named:
      function: tool.pending_reader
      writes:
        seen: report
      on_error: skip

    after:
      exec:
        command: printf
        args: ["%s", "after"]
        output:
          stdout: { type: string }
      writes:
        stdout: report

  edges:
    - { from: start, to: named }
    - { from: named, to: after }
    - { from: after, to: end }

flow.dead_end:
  description: A node whose only outgoing edge is a guard that answers false.
  outputs:
    checks:
      type: array
      max_items: 8
      items: { type: string }
  nodes:
    # Runs, writes, routes on — the step whose record a failed run must keep.
    pre:
      exec:
        command: printf
        args: ["%s", "pre"]
        output:
          stdout: { type: string }
      writes:
        stdout: checks

    # Completes too, and then has nowhere to go: its one edge reads its own
    # output and the value is never `never` (grammar 7.3 rule 7).
    head:
      exec:
        command: printf
        args: ["%s", "head"]
        output:
          stdout: { type: string }
      writes:
        stdout: checks

  edges:
    - { from: start, to: pre }
    - { from: pre, to: head }
    - { from: head, to: end, when: "head.output.stdout == 'never'" }

flow.unset_expression:
  description: The same read written as an expression, under a fallback.
  outputs:
    report:
      type: string
  nodes:
    bound:
      exec:
        command: printf
        args: ["%s", "bound"]
        output:
          stdout: { type: string }
      input:
        pending: "state.pending"
      writes:
        stdout: report
      on_error: { fallback: rescue }

    rescue:
      exec:
        command: printf
        args: ["%s", "rescued"]
        output:
          stdout: { type: string }
      writes:
        stdout: report

  edges:
    - { from: start, to: bound }
    - { from: bound, to: end }
    - { from: rescue, to: end }
