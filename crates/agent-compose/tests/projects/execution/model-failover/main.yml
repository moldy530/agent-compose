# M1 acceptance fixture: an ordered failover route (PRD 5.9).
#
# `model.default` is a route, not a binding: on a `rate_limit`, an `overloaded`,
# or a `timeout` from `model.smart`, the compiled graph must try `model.fast` and
# record that it did ("served by model.fast, fallback #1"). The two members sit
# on the same provider, so the only thing that changes between attempts is the
# model id — which is what the mock's per-model queues key on, and therefore what
# a transcript assertion can see.
#
# A `server_error` is deliberately NOT in `model.default`'s `route_on:`: a
# condition outside the declared list must fail the node rather than fail over,
# and a route that listed everything could not tell the two apart. So the fourth
# condition gets a route of its own — `model.resilient` below — and the two
# together decide `route_on:` in both directions: every condition a route
# declares fails over, and every condition it does not declare does not.
version: "0.1"

state:
  answer:
    type: string
    default: ""

provider.mock:
  kind: anthropic
  api_key: ${MOCK_API_KEY}
  base_url: ${MOCK_BASE_URL}

model.smart:
  provider: provider.mock
  id: claude-sonnet-4-6
  settings:
    max_tokens: 4096

model.fast:
  provider: provider.mock
  id: claude-haiku-4-5
  settings:
    max_tokens: 2000

model.default:
  description: Ordered fallback; the fixture's model calls all go through here.
  route: [model.smart, model.fast]
  route_on: [rate_limit, overloaded, timeout]

agent.answerer:
  description: Answers one question.
  model: model.default
  prompt: |
    Answer the question in one sentence. Do not ask for clarification.
  input:
    question:
      type: string
  output:
    answer:
      type: string
      min_length: 1

# The same two members in the same order, declared on the one condition
# `model.default` withholds. A 5xx is what `model.default` fails the node on and
# what this one fails **over** on, from one scripted outcome — which is what
# makes the two routes a decision about `route_on:` rather than about the shape
# a 500 arrives in.
model.resilient:
  description: The same ladder, declared on `server_error` alone.
  route: [model.smart, model.fast]
  route_on: [server_error]

agent.persistent:
  description: Answers one question through a route that survives a 5xx.
  model: model.resilient
  prompt: |
    Answer the question in one sentence. Do not ask for clarification.
  input:
    question:
      type: string
  output:
    answer:
      type: string
      min_length: 1

# The same route under a **budget**. `route_on:` names `timeout`, and a timeout
# is the one condition a provider does not announce: a member that accepted the
# request and answers nothing has to be given up on for the ladder to reach
# `model.fast` at all. What the runtime gives up on it against is this node's own
# `timeout:` — grammar 9.2's budget, divided between the members that still have
# a successor — so the node here declares one and the fixture can spend it.
flow.ask_promptly:
  description: Ask one question through a failover route, under a deadline.
  inputs:
    question:
      type: string
      min_length: 1
  outputs:
    answer:
      type: string
  nodes:
    ask:
      agent: agent.answerer
      input:
        question: "input.question"
      timeout: 4s
  edges:
    - { from: start, to: ask }
    - { from: ask, to: end }

flow.ask:
  description: Ask one question through a failover route.
  inputs:
    question:
      type: string
      min_length: 1
  outputs:
    answer:
      type: string
  nodes:
    ask:
      agent: agent.answerer
      input:
        question: "input.question"
  edges:
    - { from: start, to: ask }
    - { from: ask, to: end }

# The same route under a node `retry:`, which is the one place a trace can lose a
# model call: an attempt that spends the whole ladder and fails has calls no
# answer can carry out, and the attempt that succeeds carries only its own. Two
# attempts over two members is four provider outcomes and one trace entry, which
# is what makes "every call this node made" checkable.
flow.ask_again:
  description: Ask one question through a failover route, retrying the node.
  inputs:
    question:
      type: string
      min_length: 1
  outputs:
    answer:
      type: string
  nodes:
    ask:
      agent: agent.answerer
      input:
        question: "input.question"
      retry: { max: 1, backoff: 10ms }
  edges:
    - { from: start, to: ask }
    - { from: ask, to: end }

# The same question through `model.resilient`, which is the only way a
# `server_error` reaches a route that declares it. The node is named `ask` like
# the others, so one trace assertion reads every flow of this fixture.
flow.ask_resiliently:
  description: Ask one question through a route declared on `server_error`.
  inputs:
    question:
      type: string
      min_length: 1
  outputs:
    answer:
      type: string
  nodes:
    ask:
      agent: agent.persistent
      input:
        question: "input.question"
  edges:
    - { from: start, to: ask }
    - { from: ask, to: end }
