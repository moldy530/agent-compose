# Acceptance fixture: the two built-in tools (grammar 5.5, 6.1, Decision D135,
# PRD resolved q54).
#
# A **built-in** is a tool this runtime implements and an agent opts into by
# name, bounded by a workspace it may not leave, a per-command deadline, and a
# child environment the binding declares. It is the one binding whose program the
# *model* writes, so what this fixture makes assertable is what a transcript, a
# file system and a trace can see:
#
#   * the shell really runs, and it is a **session** — a `cd` in one call is
#     still in effect in the next, which is the difference between a tool a model
#     can drive and one it has to re-explain itself to every time;
#   * a command that exits nonzero and one that outruns its `timeout:` come back
#     as **tool results**, so the loop goes on and the model decides;
#   * the file tool round-trips — create, edit, view — and a path that leaves the
#     workspace bounces back to the model, which corrects itself (D119);
#   * the child environment is **scrubbed**: a variable this harness holds is
#     invisible unless the binding declared it or opted into inheriting;
#   * the trace carries the model's **program** — the command and its exit
#     status, the file operation and its path (`docs/trace.md` §7.4);
#   * a killed run resumes without re-running the recorded command, which is the
#     property the journal buys.
#
# `${BUILTIN_ROOT}` is a scratch directory each test points at itself: a
# workspace is a property of the machine running the graph (grammar 4.3 class 2),
# and a fixture that hard-coded one could not be run twice in parallel. The
# agents that take the **default** workspace write no `workspace:` at all, which
# is the other half of the surface.
version: "0.1"

state:
  summary:
    description: What the agent answered, written by name from its output.
    type: string
    default: nothing yet
  relayed:
    description: What the first node of `flow.relay` answered.
    type: string
    default: nothing yet
  final:
    description: What its second node answered.
    type: string
    default: nothing yet

provider.mock:
  kind: anthropic
  api_key: ${MOCK_API_KEY}
  base_url: ${MOCK_BASE_URL}

# The other wire the built-ins go out on: an OpenAI provider speaks Chat
# Completions, where the same two tools are declared as function tools with this
# compiler's own schemas rather than as the provider-defined types (PRD resolved
# q54 ruling d).
provider.other:
  kind: openai
  api_key: ${MOCK_API_KEY}
  base_url: ${MOCK_BASE_URL}

model.claude:
  provider: provider.mock
  id: claude-sonnet-4-6
  settings:
    max_tokens: 4096

model.gpt:
  provider: provider.other
  id: gpt-4.1

# The configured form: a built-in with its bounds written on a `tool.*`, which is
# what makes one configuration attachable from more than one agent. The 30s here
# is long enough that no test reaches it by accident — `tool.impatient` below is
# the one written to reach its own. `env:` is the whole of what the shell's
# children see: `PATH` because a scrubbed child has none to look a program up on,
# and `DECLARED` because a test asks the shell to print it.
tool.shell:
  builtin: bash
  workspace: "${BUILTIN_ROOT}"
  timeout: 30s
  env:
    PATH: "${PATH}"
    DECLARED: the value the binding wrote

# The same built-in under a deadline a test can reach. The bound is the
# *binding's*, so two tools in one composition holding one built-in under
# different bounds is the shape that proves it (grammar 6.1).
tool.impatient:
  builtin: bash
  workspace: "${BUILTIN_ROOT}"
  timeout: 1s
  env:
    PATH: "${PATH}"

# The opt-in that widens the scrubbed child: `inherit_env: true` is for the
# machines where inheriting is the point (PRD resolved q54 ruling b).
tool.inheriting:
  builtin: bash
  workspace: "${BUILTIN_ROOT}"
  timeout: 30s
  inherit_env: true

# The file tool, bounded to the same workspace: the two tools of one execution
# working in one directory is the shape they are for.
tool.editor:
  builtin: files
  workspace: "${BUILTIN_ROOT}"
  description: View and edit the files of the scratch checkout.

agent.worker:
  description: Runs commands inside one workspace.
  model: model.claude
  prompt: |
    You work inside one directory and may not leave it.

    Use your tools to do what the goal asks, then say what you did.
  tools:
    - tool.shell
  max_tool_iterations: 6
  input:
    goal:
      description: What to do inside the workspace.
      type: string
  output:
    summary:
      description: What was done, as text.
      type: string

agent.impatient:
  description: Runs one command under a deadline short enough to hit.
  model: model.claude
  prompt: |
    Run the command you are asked for and report what it printed.
  tools:
    - tool.impatient
  max_tool_iterations: 4
  input:
    goal:
      description: What to run.
      type: string
  output:
    summary:
      description: What was done, as text.
      type: string

agent.inheritor:
  description: Runs commands with this process's environment behind them.
  model: model.claude
  prompt: |
    Run the command you are asked for and report what it printed.
  tools:
    - tool.inheriting
  max_tool_iterations: 4
  input:
    goal:
      description: What to run.
      type: string
  output:
    summary:
      description: What was done, as text.
      type: string

agent.editor:
  description: Edits files inside one workspace.
  model: model.claude
  prompt: |
    You edit files inside one directory and may not leave it.

    Use your tools to do what the goal asks, then say what you did.
  tools:
    - tool.editor
  max_tool_iterations: 8
  input:
    goal:
      description: What to do to the files.
      type: string
  output:
    summary:
      description: What was done, as text.
      type: string

# The shorthand, on the other wire: no `tool.*` anywhere, so every bound is the
# default — including the workspace, which is one fresh directory per execution.
agent.elsewhere:
  description: Holds both built-ins under every default, on an OpenAI provider.
  model: model.gpt
  prompt: |
    Work in your workspace. Use your tools, then say what you did.
  tools:
    - builtin.bash
    - builtin.files
  max_tool_iterations: 6
  input:
    goal:
      description: What to do inside the workspace.
      type: string
  output:
    summary:
      description: What was done, as text.
      type: string

# One agent holding **both** built-ins under one workspace, which is the shape
# `tests/trace_format_stability.rs` pins the trace of: the two programs a
# `BuiltinProgram` record can carry — a command with an exit status, and a file
# operation with a path — reached from one run.
agent.both:
  description: Runs commands and edits files in one workspace.
  model: model.claude
  prompt: |
    You work inside one directory and may not leave it.

    Use your tools to do what the goal asks, then say what you did.
  tools:
    - tool.shell
    - tool.editor
  max_tool_iterations: 6
  input:
    goal:
      description: What to do inside the workspace.
      type: string
  output:
    summary:
      description: What was done, as text.
      type: string

flow.both:
  description: One agent holding the shell and the file tool at once.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    summary:
      type: string
  nodes:
    do:
      agent: agent.both
      input:
        goal: "input.goal"
  edges:
    - { from: start, to: do }
    - { from: do, to: end }

flow.work:
  description: One agent with the built-in shell on it.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    summary:
      type: string
  nodes:
    do:
      agent: agent.worker
      input:
        goal: "input.goal"
  edges:
    - { from: start, to: do }
    - { from: do, to: end }

flow.deadline:
  description: One agent whose `bash` is bounded at a second.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    summary:
      type: string
  nodes:
    do:
      agent: agent.impatient
      input:
        goal: "input.goal"
  edges:
    - { from: start, to: do }
    - { from: do, to: end }

flow.inherited:
  description: One agent whose shell inherits this process's environment.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    summary:
      type: string
  nodes:
    do:
      agent: agent.inheritor
      input:
        goal: "input.goal"
  edges:
    - { from: start, to: do }
    - { from: do, to: end }

flow.edit:
  description: One agent with the built-in file tool on it.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    summary:
      type: string
  nodes:
    do:
      agent: agent.editor
      input:
        goal: "input.goal"
  edges:
    - { from: start, to: do }
    - { from: do, to: end }

flow.elsewhere:
  description: One agent holding both built-ins under every default, on the OpenAI wire.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    summary:
      type: string
  nodes:
    do:
      agent: agent.elsewhere
      input:
        goal: "input.goal"
  edges:
    - { from: start, to: do }
    - { from: do, to: end }

flow.tolerant:
  # The node-level half of the failure split: a built-in whose *execution* failed
  # fails the agent node, and the node's own `on_error:` decides the run
  # (grammar 9.2, Decision D119). What reaches it is the tool being unusable —
  # a workspace that is not there, a host with no `bash` — never what a command
  # said, which comes back to the model instead. `skip` retires this node's own
  # write, so the channel keeps the value `after` puts in it and the run
  # completes, which is only observable because the node failed.
  description: An agent whose built-in fails, absorbed by the node's `on_error:`.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    summary:
      type: string
  nodes:
    attempt:
      agent: agent.worker
      input:
        goal: "input.goal"
      on_error: skip

    after:
      exec:
        command: printf
        args: ["%s", "the node was skipped"]
        output:
          stdout: { type: string }
      writes:
        stdout: summary

  edges:
    - { from: start, to: attempt }
    - { from: attempt, to: after }
    - { from: after, to: end }

flow.relay:
  # Two agent nodes in a row — the smallest shape a *frontier* is observable in.
  # The first one's loop runs a `bash` with a side effect a test can count; kill
  # the run while the second node's call is in flight and the journal holds that
  # answer, so a resumed generation is handed it back rather than running the
  # command again (`docs/durability.md` §3.2).
  description: Two agent nodes in a row, the first of which runs a command.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    relayed:
      type: string
    final:
      type: string
  nodes:
    first:
      agent: agent.worker
      input:
        goal: "input.goal"
      writes:
        summary: relayed

    second:
      agent: agent.worker
      input:
        goal: "state.relayed"
      writes:
        summary: final

  edges:
    - { from: start, to: first }
    - { from: first, to: second }
    - { from: second, to: end }
