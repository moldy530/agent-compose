# M3 acceptance fixture: the four runtime built-ins (grammar 5.5, Decision D123,
# PRD resolved q31).
#
# A **built-in** is a tool this runtime implements and an agent opts into one
# name at a time, bounded by a `root:` it may not leave and — for the shell — a
# `timeout:` it may not outrun. So what this fixture is written to make
# assertable is what a transcript and a file system can *see*:
#
#   * each of the four really runs — a file read back, a file written, a
#     directory listed, a command's stdout returned;
#   * a path that resolves outside the root is refused, by `..` and by a
#     symlink alike, and refusing it **fails the node** rather than going back
#     to the model;
#   * a command that outruns its `timeout:` is killed, and one that exits
#     nonzero fails the node under the node's own `on_error:`;
#   * arguments the built-in's own schema refuses **bounce back to the model**
#     (Decision D119), which is the other side of the same split;
#   * a killed run resumes without re-running the recorded `bash`, which is the
#     property the journal buys and the reason a built-in beats a hand-rolled
#     `exec:` tool.
#
# Every `root:` is `${BUILTIN_ROOT}`, which each test points at a scratch
# directory of its own: the bound is a property of the machine running the graph
# (grammar 4.3 class 2), and a fixture that hard-coded one could not be run twice
# in parallel.
version: "0.1"

state:
  summary:
    description: What the agent answered, written by name from its output.
    type: string
    default: nothing yet
  relayed:
    description: What the first node of `flow.relay` answered.
    type: string
    default: nothing yet
  final:
    description: What its second node answered.
    type: string
    default: nothing yet

provider.mock:
  kind: anthropic
  api_key: ${MOCK_API_KEY}
  base_url: ${MOCK_BASE_URL}

model.claude:
  provider: provider.mock
  id: claude-sonnet-4-6
  settings:
    max_tokens: 4096

agent.worker:
  description: Reads, writes, lists and runs commands inside one root.
  model: model.claude
  prompt: |
    You work inside one directory and may not leave it.

    Use your tools to do what the goal asks, then say what you did.
  # All four, one name per entry, each carrying its own bounds. The 30s here is
  # long enough that no test reaches it by accident — `agent.impatient` below is
  # the one written to reach its own.
  tools:
    - builtin.read_file: { root: "${BUILTIN_ROOT}" }
    - builtin.write_file: { root: "${BUILTIN_ROOT}" }
    - builtin.list: { root: "${BUILTIN_ROOT}" }
    - builtin.bash: { root: "${BUILTIN_ROOT}", timeout: 30s }
  max_tool_iterations: 6
  input:
    goal:
      description: What to do inside the root.
      type: string
  output:
    summary:
      description: What was done, as text.
      type: string

agent.impatient:
  # One built-in and a deadline a test can reach: the same `bash`, bounded at a
  # second instead of thirty. The bound is the *attachment's*, so two agents in
  # one composition holding the same built-in under different bounds is the
  # shape that proves it (grammar 5.5).
  description: Runs one command under a deadline short enough to hit.
  model: model.claude
  prompt: |
    Run the command you are asked for and report what it printed.
  tools:
    - builtin.bash: { root: "${BUILTIN_ROOT}", timeout: 1s }
  max_tool_iterations: 4
  input:
    goal:
      description: What to run.
      type: string
  output:
    summary:
      description: What was done, as text.
      type: string

flow.work:
  description: One agent with every built-in on it.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    summary:
      type: string
  nodes:
    do:
      agent: agent.worker
      input:
        goal: "input.goal"
  edges:
    - { from: start, to: do }
    - { from: do, to: end }

flow.deadline:
  description: One agent whose `bash` is bounded at a second.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    summary:
      type: string
  nodes:
    do:
      agent: agent.impatient
      input:
        goal: "input.goal"
  edges:
    - { from: start, to: do }
    - { from: do, to: end }

flow.tolerant:
  # The node-level half of the failure split: a built-in whose *execution* failed
  # fails the agent node, and the node's own `on_error:` decides the run
  # (grammar 9.2, Decision D119). `skip` retires this node's own write, so the
  # channel keeps the value `after` puts in it and the run completes — which is
  # only observable because the node failed rather than answering.
  description: An agent whose built-in fails, absorbed by the node's `on_error:`.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    summary:
      type: string
  nodes:
    attempt:
      agent: agent.worker
      input:
        goal: "input.goal"
      on_error: skip

    after:
      exec:
        command: printf
        args: ["%s", "the node was skipped"]
        output:
          stdout: { type: string }
      writes:
        stdout: summary

  edges:
    - { from: start, to: attempt }
    - { from: attempt, to: after }
    - { from: after, to: end }

flow.outlived:
  # The deadline again, absorbed rather than raised — the only shape in which a
  # run that **completed** can be asked what the runtime is still holding on to.
  #
  # A killed shell can leave a grandchild holding the output pipes this runtime
  # reads (`sleep 60 & wait` is the shape). Those pipes and their `data` handlers
  # are the call's, and a call that has already failed must not keep them: a
  # handler still appending to a buffer nobody will read is unbounded memory in a
  # long-lived host, and an open pipe is an event-loop handle that keeps the
  # process alive for as long as the grandchild does. A run that *ended* at the
  # failure would hide both behind its own exit, which is why this flow absorbs
  # the failure and lets the process decide when it is done.
  description: An agent whose command outruns its deadline, absorbed by the node's `on_error:`.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    summary:
      type: string
  nodes:
    attempt:
      agent: agent.impatient
      input:
        goal: "input.goal"
      on_error: skip

    after:
      exec:
        command: printf
        args: ["%s", "the node was skipped"]
        output:
          stdout: { type: string }
      writes:
        stdout: summary

  edges:
    - { from: start, to: attempt }
    - { from: attempt, to: after }
    - { from: after, to: end }

flow.relay:
  # Two agent nodes in a row — the smallest shape a *frontier* is observable in.
  # The first one's loop runs a `bash` with a side effect a test can count; kill
  # the run while the second node's call is in flight and the journal holds that
  # answer, so a resumed generation is handed it back rather than running the
  # command again (`docs/durability.md` §3.2).
  description: Two agent nodes in a row, the first of which runs a command.
  inputs:
    goal:
      type: string
      min_length: 1
  outputs:
    relayed:
      type: string
    final:
      type: string
  nodes:
    first:
      agent: agent.worker
      input:
        goal: "input.goal"
      writes:
        summary: relayed

    second:
      agent: agent.worker
      input:
        goal: "state.relayed"
      writes:
        summary: final

  edges:
    - { from: start, to: first }
    - { from: first, to: second }
    - { from: second, to: end }
