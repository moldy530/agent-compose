# M1 acceptance fixture: the generated app's three verbs.
#
# `agent-compose serve` emits a Fastify app for the `http` triggers of a project,
# exposing **start**, **resume**, and **status** (PRD 5.11, grammar 13.3). This
# project has all three surfaces to exercise: `http` triggers whose `input:`
# bindings are CEL over the request payload, an interrupting `human` node whose
# output schema is what a resume payload is validated against, and `async`
# responses, so a start returns an execution id and the status route is how a
# caller learns the rest.
#
# Five flows, because the verbs and the ways a pause can end do not all become
# testable at once:
#
#   * `flow.direct` has no `human` node in it, so start and status are decidable
#     without one ever pausing;
#   * `flow.assisted` interrupts and is what `resume` is for — an unbounded-ish
#     wait (24h) that a test answers;
#   * `flow.expiring` is the other way a wait ends: a budget short enough to
#     spend, whose `on_timeout:` route is taken **instead of** the node's own
#     edges (grammar 8.7, 9.2), and which then keeps the execution alive long
#     enough for a late resume to be refused as the expiry it is;
#   * `flow.batch` is the case that makes a pause need an address: a `map`
#     dispatching a flow that contains a `human` node, so one execution holds
#     several pauses at once and each resume has to name which it answers
#     (grammar 9.4's instance path);
#   * `flow.patient` is the case Decision D102 is about one construct further
#     out: a `flow:` node with a short `timeout:` of its own wrapping a subflow
#     that pauses. The enclosing budget must not cut the wait short (§9.2's
#     budget bounds the work the node does, and waiting on a human is not work
#     it is doing), and the test outlives it by seconds before answering.
#
# They share the agent, the model and the state channels.
#
# The `escalate` node is reached only through the `human` node's `on_timeout:`
# control transfer — one of the two positions node reachability counts besides
# edges (grammar 7.8) — and still carries an outgoing edge of its own, because
# reaching `end` is how a branch retires.
version: "0.1"

defaults:
  timeout: 60s
  on_error: fail

state:
  answer:
    type: string
    default: ""
  decision:
    enum: [approve, reject]
    default: approve
  # Written only by the node `flow.expiring`'s `on_timeout:` transfers to, so a
  # value here is proof the expiry route ran rather than the node's own edges.
  escalated:
    type: string
    default: ""
  # One entry per dispatched instance that a human signed off, in source-item
  # order (grammar 8.6 rule 5).
  decisions:
    type: array
    max_items: 8
    items:
      enum: [approve, reject]
    reduce: append

triggers:
  # `respond: async` returns an execution id immediately; the optional callback
  # fires on completion. A `sync` response would be a compile error here, because
  # this flow reaches a `human` node and sync triggers must be interrupt-free.
  on_request:
    type: http
    flow: flow.assisted
    path: /answers
    method: POST
    input:
      question: "payload.body.question"
    respond: async
    callback: "payload.body.callback_url"

  # Start and status over a flow with no interrupt in it: this trigger's
  # execution runs to completion on its own, so the execution id it answers with
  # and the terminal report the status route gives are observable with `serve`
  # alone. `on_request`'s execution stops at the human and needs a resume, which
  # is why the two are exercised apart.
  on_direct_request:
    type: http
    flow: flow.direct
    path: /direct-answers
    method: POST
    input:
      question: "payload.body.question"
    respond: async

  # A body-bearing method whose bindings read the **query string**, so nothing
  # about this route needs a body at all. That is what makes it the trigger
  # Decision D117's other half is observable on: a `POST` sent with an empty body
  # presents `payload.body` as `{}` and must start an execution, and a request
  # that carries a body which is not a decodable JSON object must start none.
  on_query_request:
    type: http
    flow: flow.direct
    path: /query-answers
    method: POST
    input:
      question: "payload.query['q']"
    respond: async

  # The completion webhook (grammar 13.3, PRD 5.11). It sits on a flow with no
  # interrupt in it, so the run really finishes and the delivery carries a
  # terminal report; and `callback:` is read from the body, which is the natural
  # spelling and the one that makes "a request that named no URL gets no
  # webhook" a case rather than a hypothetical.
  on_callback_request:
    type: http
    flow: flow.direct
    path: /callback-answers
    method: POST
    input:
      question: "payload.body.question"
    respond: async
    callback: "payload.body.callback_url"

  # A wait with a budget short enough to spend. `respond: async` again, because
  # `flow.expiring` reaches a `human` node like `flow.assisted` does.
  on_expiring_request:
    type: http
    flow: flow.expiring
    path: /expiring-answers
    method: POST
    input:
      question: "payload.body.question"
    respond: async

  # Several pauses in one execution: the payload is a list, the flow fans out
  # over it, and each dispatched instance holds a pause of its own.
  on_batch_request:
    type: http
    flow: flow.batch
    path: /batch-answers
    method: POST
    input:
      questions: "payload.body.questions"
    respond: async

  # A pause under a node that has a budget of its own, which the test outlives
  # before answering.
  on_patient_request:
    type: http
    flow: flow.patient
    path: /patient-answers
    method: POST
    input:
      question: "payload.body.question"
    respond: async

  # The third response shape (grammar 13.3, PRD §9.8): `sync` blocks for the
  # flow's outputs, and on `timeout:` expiry the response **upgrades** to the
  # async one — 202 with the execution id and a status URL — while the execution
  # carries on. `flow.direct` is interrupt-free, which is what a sync trigger
  # requires; the budget is short so a test can spend it deliberately.
  on_sync_request:
    type: http
    flow: flow.direct
    path: /sync-answers
    method: POST
    input:
      question: "payload.body.question"
    respond: sync
    timeout: 2s

provider.mock:
  kind: anthropic
  api_key: ${MOCK_API_KEY}
  base_url: ${MOCK_BASE_URL}

model.smart:
  provider: provider.mock
  id: claude-sonnet-4-6
  settings:
    max_tokens: 4096

agent.answerer:
  description: Answers one question.
  model: model.smart
  prompt: |
    Answer the question in one paragraph.
  input:
    question:
      type: string
  output:
    answer:
      type: string
      min_length: 1

# No `human` node anywhere in it, so an execution started through
# `on_direct_request` reaches `end` by itself: the start route's execution id and
# the status route's terminal report are observable with `agent-compose serve`
# alone.
flow.direct:
  description: Answer a question with nobody to sign it off.
  inputs:
    question:
      type: string
      min_length: 1
  outputs:
    answer:
      type: string
  nodes:
    ask:
      agent: agent.answerer
      input:
        question: "input.question"
  edges:
    - { from: start, to: ask }
    - { from: ask, to: end }

flow.assisted:
  description: Answer a question and have a human sign the answer off.
  inputs:
    question:
      type: string
      min_length: 1
  outputs:
    answer:
      type: string
    decision:
      enum: [approve, reject]
  nodes:
    ask:
      agent: agent.answerer
      input:
        question: "input.question"

    # The interrupt. Its `output:` is the schema a resume payload is validated
    # against, and it is routable structured output like any other.
    approve:
      human:
        input:
          answer: { type: string }
        output:
          decision: { enum: [approve, reject] }
          note: { type: string }
        timeout: 24h
        on_timeout: escalate
      input:
        answer: "state.answer"

    # No edge targets this node: it is reached through `on_timeout:` alone.
    escalate:
      exec:
        command: "${OPS_BIN}/escalate"
        args: ["--reason=human-timeout"]
      on_error: skip

  edges:
    - { from: start, to: ask }
    - { from: ask, to: approve }
    - { from: approve, to: end }
    - { from: escalate, to: end }

# The other way a wait ends (grammar 8.7): the budget runs out and `on_timeout:`
# takes control **instead of** the node's own edges, which is §9.2's fallback
# shape reached from a different key. The route is two nodes rather than one so
# that the execution is demonstrably still running after the expiry — which is
# the window a resume arriving late has to be refused *as an expiry* in, rather
# than as an execution that has already finished.
flow.expiring:
  description: Answer a question and give the reviewer a budget they will not meet.
  inputs:
    question:
      type: string
      min_length: 1
  outputs:
    answer:
      type: string
    escalated:
      type: string
  nodes:
    ask:
      agent: agent.answerer
      input:
        question: "input.question"

    # `defaults: { timeout: 60s }` above reaches every other node in this project
    # and not this one: a `human` node resolves no `timeout` at any level
    # (Decision D102), so the only budget on this wait is the one written here.
    sign_off:
      human:
        input:
          answer: { type: string }
        output:
          decision: { enum: [approve, reject] }
        timeout: 3s
        on_timeout: give_up
      input:
        answer: "state.answer"

    # Long enough that the execution is observably still going after the wait
    # expired, so the late resume the test sends is refused by the *wait's* state
    # rather than by the execution's. Five seconds rather than the two the test
    # needs, because the window is what a poll has to catch: a loaded machine
    # that stalls between the expiry and the first poll would otherwise see a run
    # that had already finished and read the wrong refusal.
    give_up:
      exec:
        command: "${OPS_BIN}/sleep"
        args: ["5"]

    note:
      exec:
        command: "${OPS_BIN}/echo"
        args: ['{"escalated":"the wait ran out"}']
        output:
          escalated: { type: string }
  edges:
    - { from: start, to: ask }
    - { from: ask, to: sign_off }
    - { from: sign_off, to: end }
    - { from: give_up, to: note }
    - { from: note, to: end }

# One item's sign-off, as a module. Dispatched by `flow.batch` below, which is
# what puts several pauses in one execution at once.
flow.sign_off:
  description: Have a human sign one item off.
  inputs:
    question:
      type: string
      min_length: 1
  outputs:
    decision:
      enum: [approve, reject]
  nodes:
    sign:
      human:
        input:
          question: { type: string }
        output:
          decision: { enum: [approve, reject] }
      input:
        question: "input.question"
  edges:
    - { from: start, to: sign }
    - { from: sign, to: end }

# A `map` over a flow that pauses: every dispatched instance parks, so the
# execution holds one pause per item and the resume route has to address them.
# Their ids are grammar 9.4's instance paths — `fan/0/<index>/sign/0` — which is
# what makes them derivable rather than handed out by a counter.
flow.batch:
  description: Fan out over a list of questions, each signed off by a human.
  inputs:
    questions:
      type: array
      max_items: 4
      items: { type: string }
  outputs:
    decisions:
      type: array
      max_items: 8
      items:
        enum: [approve, reject]
  nodes:
    fan:
      map:
        over: input.questions
        as: question
        node: flow.sign_off
        max_concurrency: 4
        input:
          question: "question"
        writes:
          decision: decisions
  edges:
    - { from: start, to: fan }
    - { from: fan, to: end }

# A pause under a node that has a budget of its own. `wrap` declares
# `timeout: 2s` — and would resolve `defaults: { timeout: 60s }` even if it did
# not — while the wait below it has none at all. Decision D102 withholds
# `timeout` from a `human` node at every level so that a composition-wide budget
# can never cut a wait short, and the node that *dispatches* a pause is where
# that promise is easiest to break: grammar 9.2's budget bounds the work a node
# execution does, and waiting on a human is not work it is doing, so the deadline
# does not run while a wait below it is open.
flow.patient:
  description: Wrap a sign-off in a node whose own budget must not end the wait.
  inputs:
    question:
      type: string
      min_length: 1
  outputs:
    decision:
      enum: [approve, reject]
  nodes:
    wrap:
      flow: flow.sign_off
      timeout: 2s
      input:
        question: "input.question"
      writes:
        decision: decision
  edges:
    - { from: start, to: wrap }
    - { from: wrap, to: end }
