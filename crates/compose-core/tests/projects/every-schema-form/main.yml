# A codegen shape fixture: every form of grammar 3, every reduce policy of
# grammar 10.2, and every `format:` of grammar 3.3, in one composition.
#
# `examples/` is the worked reference and is written to be *read*; this file is
# written to be *emitted*. Between them the two examples reach maybe half of the
# schema language, so a golden built only from them would leave `z.hostname()`,
# `z.iso.duration()`, a `merge` channel's `Partial<…>`, a `unique_items` refine
# and an empty field map unchecked against the real Zod — every one of which is a
# spelling this compiler could get wrong in a way only a type-checker or a parse
# would notice.
#
# It is deliberately the smallest graph that carries all of it: one flow, one
# store, and the one-node subflow `flow.condense` that exists only to be
# *attached* to an agent. What is being covered here is the schema language, not
# the topology — plus the handful of *binding* shapes no example reaches, which
# are marked where they are declared and are here for the same reason: a
# spelling only `tsc` or a real request would notice. The second agent is one of
# those: it exists so a `map` can dispatch to an agent that carries an attached
# flow, which is the one node shape whose entry holds both dispatch carriers.
# The `triggers:` block at the foot is another: the authenticated `http` surface
# of grammar 13.3, whose emitted table is a type declaration in every other
# golden and a populated value here.
version: "0.1"

state:
  # Unreduced, no default: LangGraph's `LastValue`, unset until written (D78).
  draft: { type: string }
  # Unreduced with a default, which needs an initial value and so a reducer.
  round: { type: integer, default: 1, minimum: 0, multiple_of: 1 }
  # The three declared policies.
  notes:
    description: One element per write, in canonical write order.
    type: array
    max_items: 32
    items: { type: string }
    reduce: append
  totals:
    description: Partial until every property has been supplied (D101).
    type: object
    properties:
      fixed: { type: integer }
      skipped: { type: integer }
    reduce: merge
  latest: { type: string, reduce: last_wins, default: "" }
  # A merge channel with a default is total from step 0.
  seen:
    type: object
    properties:
      count: { type: integer, minimum: 0 }
    reduce: merge
    default: { count: 0 }

  # Every `format:` of grammar 3.3, on an input surface so a `default:` is legal
  # beside one where it is interesting.
  at:        { type: string, format: date-time }
  on_day:    { type: string, format: date }
  at_time:   { type: string, format: time }
  lasting:   { type: string, format: duration }
  who:       { type: string, format: email }
  where:     { type: string, format: uri }
  which:     { type: string, format: uuid }
  host:      { type: string, format: hostname }
  v4:        { type: string, format: ipv4 }
  v6:        { type: string, format: ipv6 }

  # The rest of the constraint vocabulary.
  slug:      { type: string, pattern: "^[a-z][a-z0-9-]*$", min_length: 1, max_length: 64 }
  # RE2 is not a subset of ECMAScript, so `pattern:` is a lowering rather than a
  # copy: these two are the corners of it. `\d` and a counted repetition are the
  # vocabulary that transfers, and `\d` means the ASCII digits in *both* columns
  # — a JSON Schema `pattern` is ECMAScript by definition. The empty pattern is
  # the degenerate one: `//` is a line comment, so it emits `/(?:)/`.
  digits:    { type: string, pattern: "^\\d{3}-\\d{4}$" }
  anything:  { type: string, pattern: "" }
  # A `.` is where the two columns cannot agree, in two independent ways. The
  # emitted literal carries no `u` flag, so `.` is one UTF-16 code unit there and
  # one code point in the validator's engine (`dot-matches-a-code-unit`); and
  # ECMAScript's `.` excludes every line terminator where RE2's and the
  # validator's exclude `\n` alone (`dot-excludes-a-line-terminator`), which no
  # flag would fix.
  glyph:     { type: string, pattern: "^.$" }
  # `\b` is the other one. Both engines have a word boundary and they disagree
  # about what a word character is at it: ECMAScript's is ASCII, the validating
  # engine keeps Rust's Unicode one — which is exactly what `\w`, `\d` and `\s`
  # do *not* do, because the translation that makes those agree rewrites the
  # classes and leaves the boundary alone. Declared as
  # `word-boundary-is-unicode-aware`.
  word:      { type: string, pattern: "\\bcat\\b" }
  # The length bounds, on a channel with no `pattern:` to hide them behind:
  # `minLength`/`maxLength` count code points, which is neither what `.min()`
  # nor what `.max()` counts, so one astral character tells the two spellings
  # apart in both directions.
  mark:      { type: string, min_length: 2, max_length: 4 }
  ratio:     { type: number, exclusive_minimum: 0, exclusive_maximum: 1 }
  step:      { type: number, minimum: -1.5, maximum: 1.5, multiple_of: 0.5 }
  # `multiple_of` on a step binary floating point cannot hold, with no bound to
  # keep the quotient small. `step` above is exact in both columns twice over —
  # 0.5 is a power of two and `maximum: 1.5` caps the quotient at 3 — so it
  # cannot reach the place the two columns divide: the JSON column divides
  # exactly (`0.3` is 3/10) and `.multipleOf(0.3)` divides in doubles and admits
  # a tolerance that scales with the quotient. Declared as
  # `multiple-of-under-a-scaled-tolerance`.
  cadence:   { type: number, multiple_of: 0.3 }
  urgent:    { type: boolean, default: false }
  mood:      { enum: [calm, brisk], default: calm }
  tags:
    type: array
    min_items: 1
    max_items: 8
    unique_items: true
    items: { type: string }
  # `unique_items` over something other than a scalar. JSON Schema's
  # `uniqueItems` compares *instances*, so two objects carrying the same
  # properties are one item however their keys were ordered — which is a
  # different rule from "different JSON text" and the one the emitted helper
  # has to implement.
  authors:
    type: array
    max_items: 4
    unique_items: true
    items:
      type: object
      properties:
        name: { type: string }
        rank: { type: integer }
  # `unique_items` over items one of whose properties carries a `default:`. Two
  # items that differ only in omitting it are two instances to JSON Schema and
  # one value after the parse fills it in, which is the one shape where the two
  # columns cannot agree — declared as `omitted-default-is-the-same-item`.
  visits:
    type: array
    max_items: 4
    unique_items: true
    items:
      type: object
      properties:
        page: { type: string }
        via:  { type: string, default: direct }
  author:
    type: object
    properties:
      name:  { type: string }
      email: { type: string, format: email }
      home:  { type: string, format: uri }
    optional: [email, home]
  # A union as a property type rather than as an array's `items:`, which is the
  # other legal position (grammar 3.7).
  origin:
    type: object
    properties:
      source:
        discriminator: kind
        variants:
          upload: { filename: { type: string } }
          crawl:  { url: { type: string, format: uri }, depth: { type: integer, minimum: 0 } }

provider.p:
  kind: openai_compatible
  api_key: ${SHAPES_KEY}
  base_url: ${SHAPES_URL}

# Grammar 12.1's two SDK-reached kinds. Nothing in `examples/` declares one, so
# without these no golden ever carries the `kind:` literals `bedrock` and
# `vertex` — and a `ProviderKind` that had never heard of them would type-check
# every golden in the corpus and fail on the first composition that used one.
provider.aws:
  kind: bedrock
  region: us-east-1

provider.gcp:
  kind: vertex
  project: shapes
  location: us-central1

model.m:
  provider: provider.p
  id: a-model

# An empty input and an empty output: both legal on a tool, and both a closed
# object with no properties (grammar 3.1, 3.9).
tool.ping:
  description: Has an effect and no arguments.
  input: {}
  output: {}
  exec:
    command: "true"

# An `http:` binding that writes neither `query:` nor `body:`, on each of the two
# methods that read the omission differently: grammar 6.1 sends the bound input
# object as the JSON body on a body-bearing method and as query parameters on
# `GET`/`HEAD`. Every `http:` binding in `examples/` states its own `body:`, so
# this is the only place the convention itself is emitted.
tool.file_ticket:
  description: Files a ticket from the whole input object.
  input:
    title:   { type: string }
    summary: { type: string }
  output:
    id: { type: string }
  http:
    method: POST
    url: "https://example.test/tickets"

tool.lookup:
  description: Looks a term up, with the input object as the query string.
  input:
    term:  { type: string }
    limit: { type: integer, minimum: 1 }
  output:
    hits: { type: array, max_items: 8, items: { type: string } }
  http:
    method: GET
    url: "https://example.test/search"

# The half-and-half case, which is legal because the two keys claim different
# slots (grammar 6.1, Decision D66): `query:` is written out and evaluated over
# the tool's own `input`, and the body is the input object the block did not
# claim. This is the only tool here that emits the CEL roots a `query:`/`body:`
# expression is evaluated against.
tool.dispatch:
  description: Posts the input object, with one parameter written out.
  input:
    trace:   { type: string }
    payload: { type: object, properties: { kind: { type: string } } }
  output:
    accepted: { type: boolean }
  http:
    method: POST
    url: "https://example.test/dispatch"
    query:
      trace: "input.trace"

store.notes:
  kind: kv
  scope: execution
  description: What has been noted.
  value_schema:
    body:   { type: string }
    weight: { type: number, minimum: 0 }

store.docs:
  kind: vector
  scope: global
  description: Documents to ground against.
  embed:
    model: text-embedding-3-small
    provider: provider.p
    dimensions: 8
  metadata_schema:
    source:     { type: string }
    updated_at: { type: string, format: date-time }

# The one-node subflow that exists to be attached, not to be run: a `flow.*` in
# an agent's `tools:` is flow-as-tool (grammar 5.4, PRD 5.1), whose `inputs:`
# becomes the tool's **parameter schema**. That is a lowering site no other
# surface reaches — every other tool schema comes from a `tool.*`'s own `input:`
# — and the constraints on the field below are what make the two distinguishable
# in the emitted JSON.
flow.condense:
  description: Condense a passage into the one line worth keeping.
  inputs:
    passage:
      type: string
      min_length: 1
      max_length: 4096
  outputs:
    latest: { type: string }
  nodes:
    reduce:
      exec:
        command: "true"
        output:
          latest: { type: string }
  edges:
    - { from: start, to: reduce }
    - { from: reduce, to: end }

# The configured built-in: a shell bounded by a workspace, a per-command
# deadline, and the environment its children may read — the only binding whose
# program the **model** writes (grammar 6.1, PRD resolved q54). It declares no
# `input:`/`output:`, because a built-in's contract is the compiler's.
tool.sandbox:
  builtin: bash
  workspace: "${WORKSPACE}/build"
  timeout: 30s
  env:
    PATH: "/usr/bin:/bin"
    HOME: "${WORKSPACE}"
  inherit_env: false

agent.shaper:
  description: Produces one of everything.
  model: model.m
  prompt: Produce a shape.
  # A flow attached as a tool, which is the other half of the shape above, and
  # both built-ins beside it, one in each spelling (grammar 5.5, 6.1, D135):
  # `builtin.files` as the shorthand, under every default, and the shell as a
  # `tool.*` carrying a `builtin:` binding with every bound written out. Each
  # emitted binding carries a schema and a bound this composition is the only
  # golden to spell, so `tsc` and the pinned parse see every one of them.
  tools:
    - flow.condense
    - builtin.files
    - tool.sandbox
  input:
    goal: { type: string, description: What to shape. }
  output:
    draft: { type: string, min_length: 1 }
    findings:
      description: A union inside a bounded array, the fan-out shape.
      type: array
      max_items: 16
      items:
        discriminator: kind
        variants:
          auto_fixable:
            file:       { type: string }
            confidence: { type: number, minimum: 0, maximum: 1 }
          needs_human:
            summary:  { type: string }
            severity: { enum: [low, high, critical] }
    author:
      type: object
      properties:
        name:  { type: string }
        email: { type: string, format: email }
      optional: [email]

# The `map` in `flow.shape` below needs a target of its own rather than
# `agent.shaper`: a dispatched instance's outputs land by name as well as through
# `writes:`, and `agent.shaper`'s `author` would be concurrent writers on an
# unreduced channel (grammar 8.6 rule 5). What is being covered is the
# *attachment* under a fan-out, so this agent carries the same `flow.condense`
# and answers with one field that lands in a reduced channel.
agent.spreader:
  description: Shapes one goal of a batch.
  model: model.m
  prompt: Shape one goal.
  tools: [flow.condense]
  input:
    goal: { type: string }
  output:
    note: { type: string, min_length: 1 }

flow.shape:
  description: One pass over the shaper.
  inputs:
    goal: { type: string, min_length: 1 }
    # The source array of the `map` below, bounded on its own axis (PRD 5.6).
    goals:
      type: array
      max_items: 8
      items:
        type: object
        properties:
          goal: { type: string }
  outputs:
    draft: { type: string }
    notes:
      type: array
      max_items: 32
      items: { type: string }
  nodes:
    shape:
      agent: agent.shaper
      input:
        goal: "input.goal"
    ask:
      human:
        input:
          draft: { type: string }
        output:
          decision: { enum: [approve, reject] }
    # Two inline nodes that declare no `output:`. That is not "no result
    # schema": it is the kind default — `{exit_code, stdout}` for `exec:`
    # (grammar 8.2) and `{status, body}` for `http:` (grammar 8.3) — which the
    # validator resolves and the emitter therefore has to emit. Nothing in
    # `examples/` reaches this shape: every inline node there writes `output:`
    # out.
    probe:
      exec:
        command: "true"
    notify:
      http:
        method: POST
        url: "https://example.test/notify"
        body:
          latest: "state.latest"
    # A store op's result is derived from the op and the store rather than
    # written anywhere (grammar 11.4, Decision D34), and `search` is the richest
    # row: an array of matches bounded by this node's own `top_k`, each carrying
    # the store's `metadata_schema` inline.
    recall:
      store: store.docs
      op: search
      query: "state.latest"
      top_k: 3
    # A `map` whose target is the agent carrying `flow.condense` in its `tools:`
    # — the one node shape whose trace entry can hold both dispatch carriers at
    # once (`docs/trace.md` §5): the fan-out's own `dispatches` and the tool
    # loop's `toolDispatches`, whose instance paths nest the item frame inside
    # the map node's (grammar 9.4). Nothing else in the corpus combines the two
    # constructs, so without this node the emitted call site that threads the
    # *item's* site — rather than the map node's — into the loop is written but
    # never type-checked or constructed.
    spread:
      map:
        over: input.goals
        as: one
        node: agent.spreader
        max_concurrency: 2
        input:
          goal: "one.goal"
        writes:
          note: notes
  edges:
    - { from: start, to: shape }
    - { from: shape, to: ask }
    - { from: ask, to: probe }
    - { from: probe, to: notify }
    - { from: notify, to: recall }
    - { from: recall, to: spread }
    - { from: spread, to: end }

# The trigger surface of grammar 13.3, in the two spellings that make its
# emitted table more than a type declaration.
#
# Every other project in the golden corpus declares an `http` trigger with no
# `auth:`, `callback_auth:` or `callback_allow:`, so `src/triggers.ts` carries
# the `InboundAuth` and `CallbackAuth` **types** and nothing that populates
# them — and `tsc` type-checks a declaration nobody wrote a value for. The two
# below are the values: an inbound `bearer` and an inbound `hmac` (the union's
# two arms, which the emitter spells with different keys), an outbound block
# carrying *both* schemes at once, and the allowlist that block makes mandatory.
triggers:
  signed_in:
    type: http
    flow: flow.shape
    method: POST
    path: /shape
    respond: async
    input:
      goal: "payload.body.goal"
      goals: "payload.body.goals"
    callback: "payload.body.callback_url"
    auth:
      bearer:
        token: ${SHAPE_TOKEN}
    callback_auth:
      bearer:
        token: ${SHAPE_CALLBACK_TOKEN}
        header: X-Delivery-Token
        prefix: "Token "
      hmac:
        secret: ${SHAPE_CALLBACK_SECRET}
    callback_allow:
      - "https://hooks.example.com/*"

  vendor_signed:
    type: http
    flow: flow.shape
    method: POST
    path: /shape/hook
    respond: async
    input:
      goal: "payload.body.goal"
      goals: "payload.body.goals"
    auth:
      hmac:
        secret: ${SHAPE_SECRET}
        header: X-Hub-Signature-256
        algorithm: sha256
        encoding: hex
        prefix: "sha256="
