# rule: a `callback_auth:` signing secret takes the env-ref value form, like every other secret (grammar 4.3, 13.3, D41 / PRD resolved q33)
# code: invalid-env-ref
# message: `secret` takes an environment reference, found the literal `s3cr3t`
# at: 13:17
# help: the spec never contains credentials or connection strings: write `${NAME}`
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_auth:
      hmac:
        secret: s3cr3t
    callback_allow:
      - "https://hooks.example.com/*"
