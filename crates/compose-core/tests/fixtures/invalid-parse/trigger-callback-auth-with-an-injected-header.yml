# rule: a `header:` names one HTTP header, and a name carrying a colon would forge a second on every delivery (grammar 13.3, 12.1)
# code: invalid-value
# message: `header` must be an HTTP header name, found "X-Token: forged"
# at: 14:17
# help: a header name is letters, digits, `_`, and `-` — the form a provider's `headers:` keys take: the resolved name is written onto a request as it stands, so a space, a colon or a newline in it would forge a second header rather than name this one
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_auth:
      bearer:
        token: ${CALLBACK_TOKEN}
        header: "X-Token: forged"
    callback_allow:
      - "https://hooks.example.com/*"
