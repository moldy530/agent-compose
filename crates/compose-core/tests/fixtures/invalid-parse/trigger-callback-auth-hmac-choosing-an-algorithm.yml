# rule: an outbound `hmac:` carries `secret:` and nothing else — signing a delivery is HMAC-SHA256 in hex, so one recipe verifies every deployment (grammar 13.3, Decision D127)
# code: unknown-key
# message: unknown key `algorithm` in the `hmac` of the `callback_auth` of trigger `intake`
# at: 13:9
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_auth:
      hmac:
        secret: ${CALLBACK_SECRET}
        algorithm: sha512
    callback_allow:
      - "https://hooks.example.com/*"
