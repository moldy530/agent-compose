# rule: an inbound `auth:` block declares one scheme, not two (grammar 13.3, PRD resolved q32)
# code: conflicting-keys
# message: the `auth` of trigger `intake` declares both `bearer` and `hmac`; an inbound `auth` carries exactly one scheme
# at: 13:7
# help: one request carries one credential, so a route verifying either would be exactly as open as its weaker half: keep the scheme the caller actually sends (grammar 13.3, PRD resolved q32)
triggers:
  intake:
    type: http
    flow: flow.support
    auth:
      bearer:
        token: ${WEBHOOK_TOKEN}
      hmac:
        secret: ${WEBHOOK_SECRET}
