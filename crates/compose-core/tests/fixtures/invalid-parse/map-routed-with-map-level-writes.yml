# rule: a discriminator-routed map declares `writes:` per route (grammar 8.6 rule 7, Decision D85)
# code: conflicting-keys
# message: `writes` is not legal on a discriminator-routed map
# at: 17:9
# help: the routes of a heterogeneous map are independently typed targets with their own output schemas, so a map-level `writes` would name fields only some of them declare: declare it on the routes (grammar 8.6 rule 7)
flow.demo:
  outputs:
    done: { type: boolean }
  nodes:
    plan:
      agent: agent.planner
    fan:
      map:
        over: plan.output.findings
        route_by: kind
        max_concurrency: 4
        writes:
          patch: patches
        routes:
          auto_fixable: { node: agent.fixer }
          needs_human: { node: tool.review_queue }
  edges:
    - { from: start, to: plan }
    - { from: plan, to: fan }
    - { from: fan, to: end }
