# rule: a store-op parameter outside the op's row is refused once, not parsed again for its type (grammar 11.4, Decision D34)
# code: invalid-value
# message: `top_k` is not a parameter of the `get` op
# at: 16:7
# help: `get` takes `key`
flow.demo:
  outputs:
    draft: { type: string }
  nodes:
    load:
      store: store.memory
      op: get
      key: "execution.session_key"
      # `top_k` is an integer where the row admits it; reading it here as well
      # would add "expected an integer for `top_k`" to the one mistake.
      top_k: "state.k"
  edges:
    - { from: start, to: load }
    - { from: load, to: end }
