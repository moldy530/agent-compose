# rule: an `if` beside `if_version` on a `delete` entry of a `batch` is refused as a key the entry does not take, not also as a second condition (grammar 11.4, PRD resolved q71, q68)
# code: invalid-value
# message: `if` is not a parameter of a `delete` entry: `ops[0]` of node `move` removes its key
# at: 16:11
# help: an absent key has nothing to delete, so `if: absent` would never apply and `if: present` is the unconditional delete; condition the entry on the version it must hold with `if_version:` (grammar 11.4, PRD resolved q68)
flow.demo:
  outputs:
    draft: { type: string }
  nodes:
    move:
      store: store.memory
      op: batch
      ops:
        - op: delete
          key: "'old'"
          if: absent
          # The `if` is the mistake, so the pair draws no `conflicting-keys`
          # on top of it: a `delete` entry takes `if_version` alone.
          if_version: "3"
  edges:
    - { from: start, to: move }
    - { from: move, to: end }
