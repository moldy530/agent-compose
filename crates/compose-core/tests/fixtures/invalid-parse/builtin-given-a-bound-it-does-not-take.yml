# rule: a built-in's bounds are a closed row; an unknown key is an error rather
# rule: than a knob that does nothing (grammar 6.1, D50, D135)
# code: unknown-key
# message: unknown key `root` in tool definition `tool.sandbox`
# at: 8:3
tool.sandbox:
  builtin: bash
  root: "./work"
agent.reviewer:
  model: model.smart
  prompt: Review the draft.
  tools:
    - tool.sandbox
  output:
    verdict: { enum: [approve, revise] }
