# rule: a `callback_auth:` token takes the env-ref value form; a secret never lives in the spec text (grammar 4.3, 13.3, D41 / PRD resolved q33)
# code: invalid-env-ref
# message: `token` takes an environment reference, found the literal `sk-live-abc`
# at: 13:16
# help: the spec never contains credentials or connection strings: write `${NAME}`
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_auth:
      bearer:
        token: sk-live-abc
    callback_allow:
      - "https://hooks.example.com/*"
