# rule: two `package_registry` entries may not authenticate to one address with two variables (grammar 14.6)
# code: invalid-value
# message: `@corp` and `package_registry` authenticate to `//npm.internal.example/repository/` with two different variables
# at: 17:14
# help: an `.npmrc` credential is keyed by address rather than by scope — the registry's own directory, so a `url:` written without a trailing `/` keys at the host root — and two entries sharing one key write one `_authToken` line that an installer resolves last-one-wins: give each its own path on the mirror (trailing `/` included), or give both the same variable (grammar 14.6, PRD resolved q59)
version: "0.1"

# Both URLs sit in one directory of the mirror, so npm — which keys a credential
# by address rather than by scope — would write one `_authToken` line twice and
# keep whichever came last, while Bun's per-scope table would keep both.
package_registry:
  url: "https://npm.internal.example/repository/"
  token: ${NPM_MIRROR_TOKEN}
  scopes:
    "@corp":
      url: "https://npm.internal.example/repository/"
      token: ${NPM_CORP_TOKEN}
