# rule: one `tools:` entry attaches one tool — the opt-in is one name at a
# rule: time, never a switch that grants several (grammar 5.5, D123)
# code: invalid-value
# message: each entry of `tools` attaches one tool, and this one declares 2
# at: 10:7
agent.reviewer:
  model: model.smart
  prompt: Review the draft.
  tools:
    - { builtin.read_file: { root: "./work" }, builtin.write_file: { root: "./work" } }
  output:
    verdict: { enum: [approve, revise] }
