# rule: a `ttl` on a `delete` entry of a `batch` is refused once, not parsed again as a duration (grammar 11.4, PRD resolved q71, q69)
# code: invalid-value
# message: `ttl` is not a parameter of a `delete` entry: `ops[0]` of node `move` removes its key
# at: 18:11
# help: a `ttl:` is how long the key a write leaves lives, and a `delete` leaves none; give the `ttl:` to a `set` entry (grammar 11.4, PRD resolved q69)
flow.demo:
  outputs:
    draft: { type: string }
  nodes:
    move:
      store: store.memory
      op: batch
      ops:
        - op: delete
          key: "'old'"
          # Reading this one as a duration as well would add a refusal of
          # `soon` to the one mistake.
          ttl: soon
  edges:
    - { from: start, to: move }
    - { from: move, to: end }
