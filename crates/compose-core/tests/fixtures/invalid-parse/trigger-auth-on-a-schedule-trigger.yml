# rule: `auth:` is a key of `http` triggers alone (grammar 13.3, PRD resolved q32)
# code: unknown-key
# message: unknown key `auth` in trigger `nightly`
# at: 10:5
triggers:
  nightly:
    type: schedule
    flow: flow.support
    cron: "0 3 * * *"
    auth:
      bearer:
        token: ${WEBHOOK_TOKEN}
