# rule: a `package_registry` address keeps its last path segment, so a trailing `/` does not make a second address (grammar 14.6)
# code: invalid-value
# message: `@corp` and `package_registry` authenticate to `//npm.internal.example/repo/` with two different variables
# at: 17:14
# help: an `.npmrc` credential is keyed by address rather than by scope — the registry's authority and its whole path, so one written with a trailing `/` and one written without it are the same address — and two entries sharing one key write one `_authToken` line that an installer resolves last-one-wins: give each its own path on the mirror, or give both the same variable (grammar 14.6, PRD resolved q59)
version: "0.1"

# npm appends `/<package>` to the registry after stripping one trailing `/`, and
# walks up the address of *that* request — so `…/repo` and `…/repo/` are one
# registry at one address, and this would spend two variables there.
package_registry:
  url: "https://npm.internal.example/repo"
  token: ${NPM_MIRROR_TOKEN}
  scopes:
    "@corp":
      url: "https://npm.internal.example/repo/"
      token: ${NPM_CORP_TOKEN}
