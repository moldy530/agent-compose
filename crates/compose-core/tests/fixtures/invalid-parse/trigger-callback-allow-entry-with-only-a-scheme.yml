# rule: a `callback_allow:` entry names a receiver, and a bare scheme names none (grammar 13.3, PRD resolved q33)
# code: invalid-value
# message: "https://" is not a `callback_allow` pattern of trigger `intake`: it names a scheme and nothing else
# at: 12:9
# help: an entry is an absolute URL naming a host, with `*` standing for any run of characters, matched against the whole callback URL — `https://hooks.example.com/*`; `http` stays legal, which is what makes localhost development work (grammar 13.3, PRD resolved q33)
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_allow:
      - "https://"
