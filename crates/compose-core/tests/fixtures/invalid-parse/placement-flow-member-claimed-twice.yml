# rule: placements are disjoint across kinds — a `flow.*` member is held to rule 3 as an `agent.*` or `tool.*` one is (grammar 14.1, Decisions D129, D171)
# code: conflicting-placement
# message: `flow.build` is a member of both `mac` and `gpu`
# at: 15:15
# help: placements are disjoint: a component runs on the workers claiming one placement, and two claims would leave the hub to choose — name it in one of the two (grammar 14.1, PRD resolved q38)
version: "0.1"

hub:
  join_token: ${MESH_JOIN_TOKEN}

placements:
  mac:
    members: [agent.signer, flow.build]
  gpu:
    members: [flow.build]
