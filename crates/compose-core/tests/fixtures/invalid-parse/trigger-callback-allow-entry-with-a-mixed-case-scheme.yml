# rule: a `callback_allow:` entry spells its scheme the way the match will read it (grammar 13.3, Decision D127)
# code: invalid-value
# message: "HTTPS://hooks.example.com/*" is not a `callback_allow` pattern of trigger `intake`: it names the scheme `HTTPS`, and an entry is matched against the callback URL as written — write `https://`
# at: 12:9
# help: an entry is an absolute URL naming a host, its scheme written lowercase, with `*` standing for any run of characters, matched against the whole callback URL — `https://hooks.example.com/*`; `http` stays legal, which is what makes localhost development work (grammar 13.3, PRD resolved q33)
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_allow:
      - "HTTPS://hooks.example.com/*"
