# rule: a control-transfer target names a node id, so it may not be a reserved root name (grammar 2.5, 9.2, Decision D74)
# code: reserved-name
# message: `output` is a reserved name and may not be used as a node id
# at: 12:29
# help: a node id is the root of `<node>.output` in an edge guard and in `map.over`, so a node named `input` would make `input.output.x` ambiguous with the flow input object; the reserved names are `input`, `state`, `execution`, `item`, `messages`, `output`, `payload`
flow.demo:
  outputs:
    draft: { type: string }
  nodes:
    write:
      agent: agent.researcher
      on_error: { fallback: output }
  edges:
    - { from: start, to: write }
    - { from: write, to: end }
