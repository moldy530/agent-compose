# rule: an outbound `bearer:` scheme declares the token every delivery carries (grammar 13.3, PRD resolved q33)
# code: missing-key
# message: missing required key `token` in the `bearer` of the `callback_auth` of trigger `intake`
# at: 11:15
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_auth:
      bearer: {}
    callback_allow:
      - "https://hooks.example.com/*"
