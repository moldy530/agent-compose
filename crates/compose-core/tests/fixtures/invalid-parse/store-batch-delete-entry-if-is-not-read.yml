# rule: an `if` on a `delete` entry of a `batch` is refused once, not parsed again as a condition (grammar 11.4, PRD resolved q71)
# code: invalid-value
# message: `if` is not a parameter of a `delete` entry: `ops[0]` of node `move` removes its key
# at: 18:11
# help: an absent key has nothing to delete, so `if: absent` would never apply and `if: present` is the unconditional delete; condition the entry on the version it must hold with `if_version:` (grammar 11.4, PRD resolved q68)
flow.demo:
  outputs:
    draft: { type: string }
  nodes:
    move:
      store: store.memory
      op: batch
      ops:
        - op: delete
          key: "'old'"
          # Reading this one as a condition as well would add "`banana` is
          # not a valid `if`" to the one mistake.
          if: banana
  edges:
    - { from: start, to: move }
    - { from: move, to: end }
