# rule: the built-in set is closed and grows by resolution rather than by drift
# rule: (grammar 5.5, D123, PRD resolved q31)
# code: unknown-variant
# message: `builtin.grep` is not a built-in tool
# at: 11:7
# help: the built-ins are `builtin.bash`, `builtin.read_file`, `builtin.write_file`, `builtin.list`; a `tool.*` or `flow.*` is attached as a bare address instead (grammar 5.4, 5.5)
agent.reviewer:
  model: model.smart
  prompt: Review the draft.
  tools:
    - builtin.grep: { root: "./work" }
  output:
    verdict: { enum: [approve, revise] }
