# rule: a `callback_allow:` entry ends its host with a `/` rather than with a `*` (grammar 13.3, Decision D127)
# code: invalid-value
# message: "https://hooks.example.com*" is not a `callback_allow` pattern of trigger `intake`: it ends its host "hooks.example.com" with a `*` rather than with a `/`, so every host that one begins is admitted
# at: 12:9
# help: one entry names one host, written out from the scheme to the first `/` — `https://hooks.example.com/*`, with a second entry for a second subdomain; a wildcard that stopped at a `.` would let one entry stand for a whole subdomain tree, and admitting one is an open language question rather than something this release chose against. Enumerate the receivers rather than dropping `callback_auth:`, which is the same trigger with no allowlist and no signature (grammar 13.3, PRD resolved q33)
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_allow:
      - "https://hooks.example.com*"
