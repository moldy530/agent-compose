# rule: each `cron:` field names values inside its range (grammar 13.4, Decision D162)
# code: invalid-cron
# message: `cron` "0 24 * * *" cannot be evaluated: the hour field `24` names 24, outside 0-23
# at: 10:11
# help: a field is `*`, a number, a range `a-b`, a list `a,b`, or a step `*/n` or `a-b/n`; minutes run 0-59, hours 0-23, days of the month 1-31, months 1-12 or JAN-DEC, days of the week 0-7 or SUN-SAT with 0 and 7 both Sunday (grammar 13.4)
triggers:
  nightly:
    type: schedule
    flow: flow.triage
    cron: "0 24 * * *"
