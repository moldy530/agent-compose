# rule: a `value` on a `delete` entry of a `batch` is refused once, not parsed again for its shape (grammar 11.4, PRD resolved q71)
# code: invalid-value
# message: `value` is not a parameter of a `delete` entry: `ops[0]` of node `move` removes its key
# at: 18:11
# help: a `delete` entry takes `key` and `if_version`; to write a value at the key, make the entry `op: set` (grammar 11.4, PRD resolved q71)
flow.demo:
  outputs:
    draft: { type: string }
  nodes:
    move:
      store: store.memory
      op: batch
      ops:
        - op: delete
          key: "'old'"
          # A `set` entry's `value` is a field map; reading this one as well
          # would add "expected a mapping for `value`" to the one mistake.
          value: 5
  edges:
    - { from: start, to: move }
    - { from: move, to: end }
