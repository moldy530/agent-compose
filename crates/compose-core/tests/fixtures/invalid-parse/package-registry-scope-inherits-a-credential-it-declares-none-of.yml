# rule: a `package_registry` entry under a tokened address declares its own `token:` (grammar 14.6)
# code: missing-registry-token
# message: `@corp` declares no `token:`, and npm would spend `package_registry`'s at `//npm.internal.example/repository/corp/` anyway
# at: 17:12
# help: npm finds a credential by walking **up** the address of the request — `//host/repo/corp/` falls back to `//host/repo/` — while Bun's registry object carries its own `token =` or none, so an entry under a tokened address that declares none authenticates under one installer and not the other: give this entry the `token:` it should spend, or move it to an address that is not under the other's (grammar 14.6, PRD resolved q59)
version: "0.1"

# The scope sits under the mirror's own directory, so npm — which finds a
# credential by walking up the address of its request — sends the default
# registry's token to a registry this file scoped it away from, while Bun's
# `[install.scopes]` entry carries none and sends nothing.
package_registry:
  url: "https://npm.internal.example/repository/"
  token: ${NPM_MIRROR_TOKEN}
  scopes:
    "@corp":
      url: "https://npm.internal.example/repository/corp/"
