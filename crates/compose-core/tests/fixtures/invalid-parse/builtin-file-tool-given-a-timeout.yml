# rule: `timeout:` bounds a command, so it is not a key a file built-in takes
# rule: (grammar 5.5, D50, D123)
# code: unknown-key
# message: unknown key `timeout` in `builtin.list` in agent definition `agent.reviewer`
# at: 11:48
# help: `timeout:` bounds the command `builtin.bash` runs; a file tool has no command to bound, and a node-level `timeout:` bounds the whole agent node (grammar 5.5, 9.2)
agent.reviewer:
  model: model.smart
  prompt: Review the draft.
  tools:
    - builtin.list: { root: "./work", timeout: 30s }
  output:
    verdict: { enum: [approve, revise] }
