# rule: a delivery's bearer `header:` may not be one the request itself writes (grammar 13.3, Decision D127)
# code: invalid-value
# message: `header` must not name `Content-Type`, which every delivery writes itself, found "Content-Type"
# at: 14:17
# help: a delivery POSTs its report as JSON to the host the allowlist admitted, so it writes headers of its own — `Content-Type`, `Content-Length`, `Host` — and a token carried under one of them replaces the value the delivery wrote or arrives joined to it: the receiver refuses the content type, mis-frames the body, or is never reached at all; name the header the receiver expects the token on, `Authorization` by default (grammar 13.3, Decision D127)
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_auth:
      bearer:
        token: ${CALLBACK_TOKEN}
        header: Content-Type
    callback_allow:
      - "https://hooks.example.com/*"
