# rule: a `callback_allow:` entry names `http` or `https` (grammar 13.3, PRD resolved q33)
# code: invalid-value
# message: "ftp://hooks.example.com/*" is not a `callback_allow` pattern of trigger `intake`: it names the scheme `ftp`, and a callback is delivered over `http` or `https`
# at: 12:9
# help: an entry is an absolute URL with `*` standing for any run of characters, matched against the whole callback URL, and its host is written out literally from the scheme to the first `/` — `https://hooks.example.com/*`; `http` stays legal, which is what makes localhost development work (grammar 13.3, PRD resolved q33)
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_allow:
      - "ftp://hooks.example.com/*"
