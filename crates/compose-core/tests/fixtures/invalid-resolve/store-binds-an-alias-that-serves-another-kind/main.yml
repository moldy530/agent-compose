# rule: a store's `backend:` alias serves the store's own kind (grammar 14.2)
# code: invalid-value
# message: the `staging` target binds `docs_db` to `redis`, which is not a `vector` storage provider
# at: main.yml:19:12
# label: deploy/staging.yml:5:5 `docs_db` is defined here, in `deploy/staging.yml`
# help: `store.docs` declares `kind: vector`, and a backend serves exactly one kind: the `vector` providers are `sqlite_vec`, `chroma`, `pgvector`, `qdrant` (grammar 14.2)
# target: staging
# ---
# The parser owns the other half of this rule, where a per-kind `defaults:`
# entry sits under the kind it serves and one file decides it. An alias
# declares no kind at all — it is an abstract slot — so which kind it has to
# serve is only knowable once the stores that name it and the active target are
# both in hand, which is this pass.
version: "0.1"

store.docs:
  kind: vector
  scope: global
  backend: docs_db
  embed:
    model: text-embedding-3-small
    provider: provider.embeddings

provider.embeddings:
  kind: openai
  api_key: ${OPENAI_API_KEY}
