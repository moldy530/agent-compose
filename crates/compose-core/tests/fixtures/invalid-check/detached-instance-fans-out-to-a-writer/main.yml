# rule: a `map` inside a detached instance dispatches instances that are detached too (grammar 8.6 rule 7, Decision D94)
# code: detached-write
# message: the map `fan` of `flow.f` detaches `flow.leaf`, whose node `n` writes the channel `note`
# at: main.yml:42:7
# label: main.yml:68:17 the dispatch is detached here
# help: a detached dispatch is resolved at dispatch: the join is over the moment it is issued and its outcome is never observed, so what it wrote would land — or not — after everything that reads it (grammar 8.6 rule 7, Decisions D31, D94); drop `detach: true`, or send the result out through the target itself
#
# Detachment is not re-rooted by a nested fan-out the way item derivation is
# (Decision D83): `flow.sink` is resolved at dispatch, so the instances of
# `flow.leaf` its own `map` dispatches are as far past the join as its own
# nodes are, and the write one of them makes is the write rule 7 refuses.
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
state:
  tasks:
    type: array
    max_items: 9
    items: { type: string }
  note:
    type: array
    max_items: 9
    items: { type: string }
    reduce: append
agent.worker:
  model: model.m
  prompt: Work.
  input:
    text: { type: string }
  output:
    note: { type: string }
flow.leaf:
  inputs:
    text: { type: string }
  outputs: {}
  nodes:
    n:
      agent: agent.worker
      input: { text: "input.text" }
  edges:
    - { from: start, to: n }
    - { from: n, to: end }
flow.sink:
  inputs:
    text: { type: string }
  outputs: {}
  nodes:
    inner:
      map:
        over: "state.tasks"
        node: flow.leaf
        max_concurrency: 2
        input: { text: "item" }
  edges:
    - { from: start, to: inner }
    - { from: inner, to: end }
flow.f:
  outputs: {}
  nodes:
    fan:
      map:
        over: "state.tasks"
        node: flow.sink
        detach: true
        max_concurrency: 2
        input: { text: "item" }
  edges:
    - { from: start, to: fan }
    - { from: fan, to: end }
