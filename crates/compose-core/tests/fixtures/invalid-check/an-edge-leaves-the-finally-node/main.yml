# rule: no edge leaves a flow's `finally:` node (grammar 7.9, Decision D159)
# code: routed-finally
# message: the edge `cleanup` → `end` of `flow.f` leaves `cleanup`, which is the flow's `finally:` node
# at: main.yml:21:7
# label: main.yml:22:12 `finally:` names it here
# help: a finally node is outside routing: the instance ending is what runs it, once, whatever the outcome — so nothing routes to it, it routes to nothing, and it needs no edge to be reachable (grammar 7.8 clause 4). Delete this, and route the branch to `end` where it is done (grammar 7.9, Decision D159)
#
# The usual line every other node needs - `{ from: <node>, to: end }` - is the
# one this node may not have: there is no branch for it to retire.
version: "0.1"
flow.f:
  outputs: {}
  nodes:
    work:
      exec: { command: "true" }
    cleanup:
      exec: { command: "true" }
  edges:
    - { from: start, to: work }
    - { from: work, to: end }
    - { from: cleanup, to: end }
  finally: cleanup
