# rule: a node inside a detached instance writes no state either (grammar 8.6 rule 7, Decision D94)
# code: detached-write
# message: the map `fan` of `flow.f` detaches `flow.sink`, whose node `n` writes the channel `note`
# at: main.yml:41:7
# label: main.yml:53:17 the dispatch is detached here
# help: a detached dispatch is resolved at dispatch: the join is over the moment it is issued and its outcome is never observed, so what it wrote would land — or not — after everything that reads it (grammar 8.6 rule 7, Decisions D31, D94); drop `detach: true`, or send the result out through the target itself
#
# The dispatched flow returns nothing — `outputs: {}` — so the dispatch site
# itself writes nothing; the write is a node *inside* the instance, which is as
# far from the join as rule 7 reaches.
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
state:
  tasks:
    type: array
    max_items: 9
    items: { type: string }
  note:
    type: array
    max_items: 9
    items: { type: string }
    reduce: append
agent.worker:
  model: model.m
  prompt: Work.
  input:
    text: { type: string }
  output:
    note: { type: string }
flow.sink:
  inputs:
    text: { type: string }
  outputs: {}
  nodes:
    n:
      agent: agent.worker
      input: { text: "input.text" }
  edges:
    - { from: start, to: n }
    - { from: n, to: end }
flow.f:
  outputs: {}
  nodes:
    fan:
      map:
        over: "state.tasks"
        node: flow.sink
        detach: true
        max_concurrency: 2
        input: { text: "item" }
  edges:
    - { from: start, to: fan }
    - { from: fan, to: end }
