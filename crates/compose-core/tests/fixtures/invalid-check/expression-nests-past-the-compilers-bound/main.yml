# rule: an expression nested past the compiler's bound is a diagnostic (grammar 4.1)
# code: invalid-expression
# message: `(((((((((size(state.tasks)))))))))) > 0` nests brackets 10 deep, and this compiler reads at most 8
# at: main.yml:37:33
# help: the bound is the compiler's, not the grammar's: parsing is recursive, so a deeply nested expression is refused with a message rather than exhausting the stack — split an edge guard into shallower parts
#
# The bound is in front of the parser rather than behind it: the pinned CEL
# crate parses by recursive descent and overflows the stack on an expression
# nested this far, which aborts the process with no diagnostic at all. This
# fixture is the evidence that the guard runs first — without it the harness
# does not fail, it dies.
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
state:
  tasks:
    type: array
    max_items: 9
    items: { type: string }
agent.a:
  model: model.m
  prompt: Do it.
  output:
    verdict: { type: string }
flow.f:
  outputs: {}
  nodes:
    n:
      agent: agent.a
      input: "'x'"
  edges:
    - { from: start, to: n }
    - { from: n, to: end, when: "(((((((((size(state.tasks)))))))))) > 0" }
    - { from: n, to: end, else: true }
