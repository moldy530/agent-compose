# rule: a string-in agent is bound with the scalar form (grammar 5.3, Decision D14)
# code: type-mismatch
# message: node `n` binds input fields by name, but its agent is string-in
# at: main.yml:23:14
# help: an agent that declares no `input:` takes a single unnamed string: bind it with the scalar form, `input: "<CEL>"` (grammar 5.3, Decision D14)
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
agent.a:
  model: model.m
  prompt: Do the thing.
  output:
    result: { type: string }
flow.f:
  outputs: {}
  nodes:
    n:
      agent: agent.a
      input: { text: "'x'" }
  edges:
    - { from: start, to: n }
    - { from: n, to: end }
