# rule: a store on a process-local backend is refused where a placement's own member binds it (grammar 14.1 rule 5, Decision D131)
# code: process-local-store
# message: `store.notes` is on the process-local `sqlite` backend (the `kv` default of the `mesh` target), and `agent.archivist` that binds it executes in placement `vault`
# at: main.yml:24:12
# label: deploy/mesh.yml:8:15 `agent.archivist` is a member of placement `vault`
# help: a mesh runs this store's component in more than one process — several workers may claim one placement, and the hub dispatches whatever else reaches the store — and each one opens its own copy, so a write on one side is never a read on another: bind `redis`, `postgres` or `mysql` instead, whose variables the environment partition already carries to every placement that reaches the store, or take the component that binds it out of `placements:` so only the hub ever opens it. Of those, this release opens `postgres` and `mysql`; the others compile and then refuse at the first store op, since they land behind the store plugin interface in M3 (PRD §7) (grammar 14.1 rule 5, PRD resolved q45)
# target: mesh
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
store.notes:
  kind: kv
  scope: global
  description: What has been filed.
  value_schema:
    last: { type: string }
agent.archivist:
  model: model.m
  prompt: File what you are given.
  stores: [store.notes]
  input:
    text: { type: string }
  output:
    filed: { type: string }
flow.archive:
  inputs:
    text: { type: string }
  outputs: {}
  nodes:
    file:
      agent: agent.archivist
      input:
        text: "input.text"
  edges:
    - { from: start, to: file }
    - { from: file, to: end }
