# rule: a detached dispatch reaches no `human` node (grammar 8.6 rule 7, 8.7, Decision D118)
# code: detached-interrupt
# message: the `map` of node `fan` in `flow.f` dispatches `flow.sign_off` with `detach: true`, and `flow.sign_off` reaches the `human` node `sign` of `flow.sign_off`
# at: main.yml:44:17
# label: main.yml:27:5 the `human` node is declared here
# label: main.yml:43:15 the detached dispatch targets it here
# help: a detached dispatch is resolved the moment it is issued: the join never observes its instance, and the execution that issued it can finish while the instance is still in flight — so a pause inside one is a question nothing is left to answer, and the wait is dropped when that execution ends. Drop `detach:` so the dispatch is joined, or take the `human` node out of what it dispatches — its own nodes, the flows it instantiates, and the `flow.*` tools of any agent it reaches (grammar 8.6 rule 7, 8.7, 7.7, Decisions D94, D118)
#
# The pause and the dispatch are in different definitions on purpose: the rule is
# stated over grammar 7.7's reachability rather than over what the target's own
# file says, so the `human` node a reader has to remove may be nowhere near the
# `detach:` key that makes it unanswerable. The other target-independent half of
# rule 7 — that a detached dispatch writes no channel — is
# `detached-flow-dispatch-writes-a-channel`; `flow.sign_off` returns nothing, so
# that rule has nothing to say here and this fixture fails exactly one check.
version: "0.1"
state:
  requests:
    type: array
    max_items: 9
    items: { type: string }
flow.sign_off:
  inputs:
    text: { type: string }
  outputs: {}
  nodes:
    sign:
      human:
        input:
          text: { type: string }
        output:
          decision: { enum: [approve, reject] }
      input: { text: "input.text" }
  edges:
    - { from: start, to: sign }
    - { from: sign, to: end }
flow.f:
  outputs: {}
  nodes:
    fan:
      map:
        over: "state.requests"
        node: flow.sign_off
        detach: true
        max_concurrency: 2
        input: { text: "item" }
  edges:
    - { from: start, to: fan }
    - { from: fan, to: end }
