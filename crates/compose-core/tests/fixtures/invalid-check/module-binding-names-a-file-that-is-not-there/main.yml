# message: `tool.sign` is implemented by `src/tools/sign.ts`, which does not exist
# at: main.yml:18:11
# help: run `agent-compose build`: it scaffolds a referenced module it cannot find — the typed signature, the contract as a doc comment, and a body that throws — once, and never writes that file again (grammar 6.1, PRD resolved q48)
