# rule: a placed component may not reach a store on a process-local backend (grammar 14.1, docs/distributed.md §1)
# code: process-local-store
# message: `agent.archivist` is placed on `vault` and reaches `store.notes`, which is on the `sqlite` backend (the built-in for `kind: kv`, which the `mesh` target does not override): that store lives inside whichever process opens it, so a worker would read and write one the hub cannot see
# at: deploy/mesh.yml:8:15
# label: main.yml:15:1 `store.notes` is declared here
# help: a placement moves where a component executes and nothing else, so a store it reaches has to be one every process in the deployment shares: bind this store to a networked backend in the active target's `storage_backends:` (grammar 14.3), or take the component out of the placement so it runs on the hub beside the store (grammar 14.1, docs/distributed.md §1)
# target: mesh
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
store.notes:
  kind: kv
  scope: execution
  value_schema:
    filed: { type: string }
agent.archivist:
  model: model.m
  prompt: File what you are given.
  stores: [store.notes]
  input:
    document: { type: string }
  output:
    verdict: { type: string }
