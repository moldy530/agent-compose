# rule: `execution.outcome` is read only inside the flow's `finally:` node, never in another node's `input:` (grammar 4.1, 7.9, Decision D159)
# code: outcome-outside-finally
# message: `execution.outcome` is readable only inside its flow's `finally:` node, and this is the `input:` binding of node `work`
# at: main.yml:15:25
# help: `execution.outcome` says how the instance ended, so it exists in the one node that runs once it has — the node a flow's `finally:` names — and in no edge guard or other node, which all run before the end: move the read into the finally node, or route on the node output or channel that decided it (grammar 4.1, 7.9, Decision D159)
#
# The same read inside `cleanup` is legal; inside `work`, which runs before
# the instance has an outcome, it is refused by name.
version: "0.1"
flow.f:
  outputs: {}
  nodes:
    work:
      exec: { command: "true" }
      input: { outcome: "execution.outcome" }
    cleanup:
      exec: { command: "true" }
      input: { outcome: "execution.outcome" }
  edges:
    - { from: start, to: work }
    - { from: work, to: end }
  finally: cleanup
