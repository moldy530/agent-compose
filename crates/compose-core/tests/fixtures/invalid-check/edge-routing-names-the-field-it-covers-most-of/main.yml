# rule: the diagnostic names the enum field with the largest covered set (grammar 7.3.1)
# code: non-exhaustive
# message: node `review` of `flow.f` routes on `verdict` and leaves `escalate`, `defer` unrouted
# at: main.yml:28:5
# label: main.yml:23:14 the enum is declared here
# help: cover every variant with guards the exhaustiveness table reads — `==`, `!=`, `in`, and their `&&`/`||`/`!` combinations — or give the node one outgoing edge that is unconditional or carries `else: true`; a term the table does not recognize proves nothing and covers no variant (grammar 7.3.1, Decision D82)
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
agent.a:
  model: model.m
  prompt: Do it.
  output:
    verdict: { enum: [approve, revise, escalate] }
agent.b:
  model: model.m
  prompt: Decide.
  output:
    verdict: { enum: [approve, revise, escalate, defer] }
    tier: { enum: [low, mid, high] }
flow.f:
  outputs: {}
  nodes:
    review: { agent: agent.b, input: "'x'" }
    fast: { agent: agent.a, input: "'y'" }
    slow: { agent: agent.a, input: "'z'" }
  edges:
    - { from: start, to: review }
    - { from: review, to: fast, when: "review.output.verdict in ['approve', 'revise']" }
    - { from: review, to: slow, when: "review.output.tier == 'low'" }
    - { from: fast, to: end }
    - { from: slow, to: end }
