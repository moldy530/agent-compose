# rule: a `server_tools:` field the curated table types as a non-string takes a literal (grammar 12.1, 4.3 class 2)
# code: type-mismatch
# message: `max_uses` of server tool `web_search_20250305` of `provider.main` takes an integer, found a string
# at: main.yml:22:17
# help: a field the curated table models is read at compile time, and an `${ENV}` reference reaches the wire as the string it expands to rather than as the value: only the fields the table types as strings interpolate (grammar 12.1, 4.3 class 2)
#
# The one mismatch that is a rule rather than a slip, and the one an author is
# walked into: `max_usages: ${N}` is second-tier and validates with a warning
# whose help says "did you mean `max_uses`?", and taking that suggestion reaches
# here. So the diagnostic has to name the rule rather than only the symptom —
# grammar 4.3 class 2 promises a provider's non-secret config interpolates, and
# it is the **string** values that do: `runtime.interpolate` answers a string,
# which is not what a field the table types as an integer may carry to the wire.
version: "0.1"

provider.main:
  kind: anthropic
  api_key: ${ANTHROPIC_API_KEY}
  server_tools:
    - type: web_search_20250305
      name: web_search
      max_uses: ${SEARCH_BUDGET}
