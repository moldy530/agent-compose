# rule: `execution.outcome` is read only inside the flow's `finally:` node, never in an edge guard (grammar 4.1, 7.9, Decision D159)
# code: outcome-outside-finally
# message: `execution.outcome` is readable only inside its flow's `finally:` node, and this is an edge guard
# at: main.yml:16:36
# help: `execution.outcome` says how the instance ended, so it exists in the one node that runs once it has — the node a flow's `finally:` names — and in no edge guard or other node, which all run before the end: move the read into the finally node, or route on the node output or channel that decided it (grammar 4.1, 7.9, Decision D159)
version: "0.1"
flow.f:
  outputs: {}
  nodes:
    work:
      exec: { command: "true" }
    cleanup:
      exec: { command: "true" }
  edges:
    - { from: start, to: work }
    - { from: work, to: end, when: "execution.outcome == 'completed'" }
    - { from: work, to: end, else: true }
  finally: cleanup
