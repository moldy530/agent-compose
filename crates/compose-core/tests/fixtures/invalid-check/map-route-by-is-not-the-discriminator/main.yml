# rule: `route_by` equals the item union's discriminator (grammar 8.6 rule 5)
# code: type-mismatch
# message: `route_by: sort` is not the discriminator of the item union, which is `kind`
# at: main.yml:54:19
# label: main.yml:24:24 the discriminator is declared here
# help: `route_by:` is a literal field name and must equal the union's own discriminator (grammar 8.6 rules 5, 8)
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
agent.triage:
  model: model.m
  prompt: Triage.
  input:
    text: { type: string }
  output:
    findings:
      type: array
      max_items: 10
      items:
        discriminator: kind
        variants:
          auto_fixable:
            file: { type: string }
          needs_human:
            summary: { type: string }
agent.fixer:
  model: model.m
  prompt: Fix.
  input:
    file: { type: string }
  output:
    patch: { type: string }
agent.reviewer:
  model: model.m
  prompt: Review.
  input:
    summary: { type: string }
  output:
    ticket: { type: string }
flow.f:
  outputs: {}
  nodes:
    classify:
      agent: agent.triage
      input: { text: "'x'" }
    dispatch:
      map:
        over: "classify.output.findings"
        as: finding
        route_by: sort
        max_concurrency: 4
        routes:
          auto_fixable:
            node: agent.fixer
            input: { file: "finding.file" }
          needs_human:
            node: agent.reviewer
            input: { summary: "finding.summary" }
  edges:
    - { from: start, to: classify }
    - { from: classify, to: dispatch }
    - { from: dispatch, to: end }
