# rule: a `coder:` node's `settings:` key reaching the adaptive thinking form's
# rule: effort is refused, naming where `model:` points (8.9, D141, D167)
# code: reserved-harness-setting
# message: `effort` of `flow.main` node `build` is a `harness: cc` option the generated adapter owns: it is what `model:` resolves to
# at: main.yml:37:11
# label: main.yml:31:18 the harness is bound here
# help: `model:` is already on the node and is an address, so the value is written where it points, not here: `model:` is a registry address, so the one model setting this harness takes is written in the `model.*` definition it names — `thinking:` in that definition's own `settings:`, a `budget_tokens` in its enabled form or an `effort` in its adaptive one, where the provider plugin's schema checks it (grammar 12.2, Decisions D141, D167). `settings:` is open so that a harness option the vendor ships tomorrow is usable the day it ships — it is not a second way to state this construct's own bounds, and a key here that reached one would be the only one no check covers. Refused rather than dropped, because a key silently removed leaves a run doing something no line of the composition says (grammar 8.9, Decision D146, PRD resolved q60 ruling b)
#
# The Agent SDK's `effort` option is where the `cc` driver writes the adaptive
# form's `effort` from the `model.*` definition `model:` names (Decision D167),
# so a `settings:` key spelling it is a second way to state that — and before
# the key was reserved, the one that silently lost, because the driver writes
# its own over whatever `passthrough` carried.
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${ANTHROPIC_API_KEY}
model.smart:
  provider: provider.p
  id: some-model
  settings:
    thinking: { type: adaptive, effort: medium }
state:
  summary: { type: string, default: "" }
flow.main:
  outputs:
    summary: { type: string }
  nodes:
    build:
      coder:
        harness: cc
        model: model.smart
        workspace: "'${REPO_ROOT}'"
        access: read_only
        prompt: Read the tree and report.
        settings:
          effort: high
        output:
          summary: { type: string }
      input: "'go'"
  edges:
    - { from: start, to: build }
    - { from: build, to: end }
