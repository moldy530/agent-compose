# rule: a detached dispatch inside a detached instance is reported once, at the nearer `detach:` (grammar 8.6 rule 7, Decision D94)
# code: detached-write
# message: the map `inner` of `flow.b` detaches `flow.c`, whose node `n` writes the channel `note`
# at: main.yml:42:7
# label: main.yml:56:17 the dispatch is detached here
#
# Both dispatches are detached, so both reach the write — and reporting it
# against each would say one write twice, naming two `detach: true`s for one
# node. What is reported is the nearer one: `flow.b` detaches `flow.c`
# directly, and the reach that runs from `flow.a` stops where a dispatch takes
# over its own detachment.
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
state:
  tasks:
    type: array
    max_items: 9
    items: { type: string }
  note:
    type: array
    max_items: 9
    items: { type: string }
    reduce: append
agent.worker:
  model: model.m
  prompt: Work.
  input:
    text: { type: string }
  output:
    note: { type: string }
flow.c:
  inputs:
    text: { type: string }
  outputs: {}
  nodes:
    n:
      agent: agent.worker
      input: { text: "input.text" }
  edges:
    - { from: start, to: n }
    - { from: n, to: end }
flow.b:
  inputs:
    text: { type: string }
  outputs: {}
  nodes:
    inner:
      map:
        over: "state.tasks"
        node: flow.c
        detach: true
        max_concurrency: 2
        input: { text: "item" }
  edges:
    - { from: start, to: inner }
    - { from: inner, to: end }
flow.a:
  outputs: {}
  nodes:
    fan:
      map:
        over: "state.tasks"
        node: flow.b
        detach: true
        max_concurrency: 2
        input: { text: "item" }
  edges:
    - { from: start, to: fan }
    - { from: fan, to: end }
