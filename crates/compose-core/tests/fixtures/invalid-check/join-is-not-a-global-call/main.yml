# rule: `join` is a method on the list it joins and has no global spelling (grammar 4.1, PRD resolved q85, Decision D168)
# code: invalid-expression
# message: `join` is called with 2 arguments, which is not a form it has
# at: main.yml:29:22
# help: write it as `names.join(', ')` or `names.join()` — the list it joins is the receiver; every other spelling has no overload to call and fails at evaluation (grammar 4.1)
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
agent.a:
  model: model.m
  prompt: Do the thing.
  input:
    text: { type: string }
  output:
    result: { type: string }
flow.f:
  inputs:
    tags:
      type: array
      items: { type: string }
  outputs: {}
  nodes:
    n:
      agent: agent.a
      input: { text: "join(input.tags, ', ')" }
  edges:
    - { from: start, to: n }
    - { from: n, to: end }
