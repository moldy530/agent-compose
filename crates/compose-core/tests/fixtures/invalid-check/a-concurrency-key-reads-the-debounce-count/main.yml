# rule: a trigger's `concurrency.key` does not read `payload.coalesced`, which the debounce it groups has not counted yet (grammar 13.1, PRD resolved q77)
# code: coalesced-in-key
# message: `concurrency.key` of the trigger `on_request` reads `payload.coalesced`, which is not known until the trigger's debounce has closed
# at: main.yml:27:12
# help: both keys are evaluated as each arrival lands — the dedupe key to decide whether it is a repeat, the group key to decide which debounce it joins — and `payload.coalesced` is the count of arrivals the debounce closed over, which exists only once it has: read it in `input:` or `session_key:`, which are bound when the execution starts, and key the arrival off what it carries (grammar 13.1, PRD resolved q77)
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
agent.a:
  model: model.m
  prompt: Do the thing.
  input:
    text: { type: string }
  output:
    result: { type: string }
triggers:
  on_request:
    type: http
    flow: flow.f
    input:
      goal: "payload.body.goal"
    concurrency:
      key: "payload.coalesced > 1 ? 'many' : 'one'"
      debounce: 5s
flow.f:
  inputs:
    goal: { type: string }
  outputs: {}
  nodes:
    n:
      agent: agent.a
      input: { text: "input.goal" }
  edges:
    - { from: start, to: n }
    - { from: n, to: end }
