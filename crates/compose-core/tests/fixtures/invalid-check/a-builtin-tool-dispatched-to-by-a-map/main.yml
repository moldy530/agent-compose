# rule: a `map` dispatch names a node's tool like a `function:` does, so a built-in is refused there too (grammar 5.5, 6.1, D135)
# code: invalid-value
# message: the `map` of node `work` invokes `tool.sandbox`, which binds the built-in `bash`
# at: main.yml:40:15
# label: main.yml:31:12 the built-in is bound here
# help: a built-in hands the **model** the program, so an agent's `tools:` list is its only call site: it declares no `input:` for a node to bind and no `output:` for one to read (grammar 5.5, 6.1, Decision D135). Attach `tool.sandbox` to an agent and let the agent call it, or bind this tool with `exec:` to run a command this composition chose
#
# The other way a node names a tool. `a-builtin-tool-called-from-a-function-node`
# pins the `function:` spelling; this is the second call site of the same rule
# and reaches the same emitter gap — no function is written for a built-in, so a
# dispatch to one would emit `Send`s to a target nothing defines.
#
# The items are shaped like the built-in's own parameters on purpose, so that the
# dispatch is wrong about *this* rule and about nothing else: a `map` with no
# `input:` passes the whole item, and an item the target could not accept would
# raise a whole-item mismatch beside the refusal. Here it can accept it, and the
# dispatch is refused anyway — which is the rule: what a built-in refuses is
# being called from a node at all, not the arguments a node would pass it.
version: "0.1"

state:
  jobs:
    type: array
    max_items: 5
    items:
      type: object
      properties:
        command: { type: string }

tool.sandbox:
  builtin: bash
  workspace: ./work

flow.main:
  outputs: {}
  nodes:
    work:
      map:
        over: "state.jobs"
        node: tool.sandbox
        max_concurrency: 2
  edges:
    - { from: start, to: work }
    - { from: work, to: end }
