# rule: a `dedupe_key` that reads `payload.coalesced` on a trigger with no `debounce:` is told the member does not exist, once — not also that a debounce it does not declare has yet to close (grammar 13.1, 13.3, PRD resolved q77)
# code: unknown-field
# message: `payload.coalesced` names no field of the `http` trigger payload
# at: main.yml:26:17
# help: `payload.coalesced` is the count of arrivals a debounce coalesced into one execution, and it is a member of the payload only on a trigger whose `concurrency:` declares `debounce:` (grammar 13.1, PRD resolved q77)
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
agent.a:
  model: model.m
  prompt: Do the thing.
  input:
    text: { type: string }
  output:
    result: { type: string }
triggers:
  on_request:
    type: http
    flow: flow.f
    input:
      goal: "payload.body.goal"
    dedupe_key: "payload.coalesced > 1 ? 'a' : 'b'"
flow.f:
  inputs:
    goal: { type: string }
  outputs: {}
  nodes:
    n:
      agent: agent.a
      input: { text: "input.goal" }
  edges:
    - { from: start, to: n }
    - { from: n, to: end }
