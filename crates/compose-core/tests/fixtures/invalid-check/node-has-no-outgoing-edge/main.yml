  prompt: Do it.
  output:
    verdict: { enum: [approve, revise, escalate] }
flow.f:
  outputs: {}
  nodes:
    n: { agent: agent.a, input: "'x'" }
    sink: { agent: agent.a, input: "'y'" }
  edges:
    - { from: start, to: n }
    - { from: n, to: sink }
