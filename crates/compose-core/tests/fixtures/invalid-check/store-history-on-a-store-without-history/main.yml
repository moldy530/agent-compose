# rule: a `history` read pages the rows a store records only when its definition declares `history: true`, which the definition the node names decides (grammar 11.1, 11.4, PRD resolved q74)
# code: invalid-value
# message: node `log` reads the history of a key in `store.notes`, which keeps none: its definition does not declare `history: true`
