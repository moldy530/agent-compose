# help: a `kv` store records a history row for every write only when its definition declares `history: true`, so a store that does not has no rows to read — declare `history: true` on `store.notes`, or read the key's current value with `get` (grammar 11.1, 11.4, PRD resolved q74)
version: "0.1"
store.notes:
  kind: kv
  scope: global
  value_schema:
    body: { type: string }
flow.f:
  outputs: {}
  nodes:
    log:
      store: store.notes
      op: history
      key: "'k'"
      limit: 10
  edges:
    - { from: start, to: log }
    - { from: log, to: end }
