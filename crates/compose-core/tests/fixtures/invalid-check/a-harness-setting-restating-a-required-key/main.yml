# rule: a `coder:` node's `settings:` key restating a **required** key is
# rule: refused, and the repair is to delete it rather than write it (8.9, D146)
# code: reserved-harness-setting
# message: `systemPrompt` of `flow.main` node `build` is a `harness: cc` option the generated adapter owns: it is what `prompt:` states
# at: main.yml:41:11
# label: main.yml:35:18 the harness is bound here
# help: take the setting off: `prompt:` is required on every `coder:` block, so it is already on the node and already states this. A bound has to be readable off the construct that holds it, which is why `prompt:` is a key and not a setting, and two spellings of one option would leave a reader and `validate` disagreeing about which wins. `settings:` is open so that a harness option the vendor ships tomorrow is usable the day it ships — it is not a second way to state this construct's own bounds, and a key here that reached one would be the only one no check covers. Refused rather than dropped, because a key silently removed leaves a run doing something no line of the composition says (grammar 8.9, Decision D146, PRD resolved q60 ruling b)
#
# The other half of "a repair has to be followable". `permission_mode:` and
# `access:` are **optional**, so "write the key on the node instead" is a
# sentence an author can act on. `prompt:` is **required** on every `coder:`
# block — it is four lines above the refused setting here — so the same sentence
# would tell them to write a line they have already written. What they have to
# do is take the setting off, and the message says so.
#
# The blind spot this closes is named in `harness.rs`: every other pinned
# `Answered::By` fixture names an *optional* key, so a table that answered every
# reserved option with `By` passed the whole corpus while handing seven rows an
# instruction nobody could follow.
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${ANTHROPIC_API_KEY}
model.smart:
  provider: provider.p
  id: claude-sonnet-4-5
state:
  summary: { type: string, default: "" }
flow.main:
  outputs:
    summary: { type: string }
  nodes:
    build:
      coder:
        harness: cc
        model: model.smart
        workspace: ${REPO_ROOT}
        access: read_only
        prompt: Read the tree and report.
        settings:
          systemPrompt: You are a careful reviewer.
        output:
          summary: { type: string }
      input: "'go'"
  edges:
    - { from: start, to: build }
    - { from: build, to: end }
