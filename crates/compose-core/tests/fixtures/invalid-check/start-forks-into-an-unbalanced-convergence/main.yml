# rule: `start` is a fork like any other vertex (grammar 7.6, 7.6.1)
# code: unbalanced-convergence
# message: node `merge` of `flow.f` is reached from the fork `start` at two different depths
# at: main.yml:24:5
# label: main.yml:26:7 this edge reaches it in 1 step
# label: main.yml:27:7 this one in 2 steps
# help: a convergence reached in two different steps runs twice, once per arrival: route the short branch through the same depth, or make the two edges exclusive — `else: true` on one, or guards grammar 7.6.1 can prove disjoint (grammar 7.6.2, Decisions D69, D112)
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
agent.a:
  model: model.m
  prompt: Do it.
  output:
    verdict: { enum: [approve, revise, escalate] }
flow.f:
  outputs: {}
  nodes:
    first: { agent: agent.a, input: "'x'" }
    merge: { agent: agent.a, input: "'y'" }
  edges:
    - { from: start, to: merge }
    - { from: start, to: first }
    - { from: first, to: merge }
    - { from: merge, to: end }
