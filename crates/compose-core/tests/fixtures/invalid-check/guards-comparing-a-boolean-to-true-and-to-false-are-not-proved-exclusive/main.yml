# rule: rule 3 reads a conjunct `q` and its negation `!q`, not `q == true` against `q == false` (grammar 7.6.1, Decision D169)
# code: unbalanced-convergence
# message: node `merge` of `flow.f` is reached from the fork `a` at two different depths
# at: main.yml:32:5
# label: main.yml:35:7 this edge reaches it in 1 step
# label: main.yml:36:7 this one in 2 steps
# help: a convergence reached in two different steps runs twice, once per arrival: route the short branch through the same depth, or make the two edges exclusive — `else: true` on one, or guards grammar 7.6.1 can prove disjoint (grammar 7.6.2, Decisions D69, D112)
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
agent.checker:
  model: model.m
  prompt: Check.
  output:
    ok: { type: boolean }
agent.writer:
  model: model.m
  prompt: Write.
  output:
    text: { type: string }
flow.f:
  inputs:
    x: { type: boolean }
  outputs: {}
  nodes:
    a: { agent: agent.checker, input: "'a'" }
    draft: { agent: agent.writer, input: "'d'" }
    merge: { agent: agent.writer, input: "'m'" }
  edges:
    - { from: start, to: a }
    - { from: a, to: merge, when: "a.output.ok && input.x == true" }
    - { from: a, to: draft, when: "a.output.ok && input.x == false" }
    - { from: draft, to: merge }
    - { from: merge, to: end }
