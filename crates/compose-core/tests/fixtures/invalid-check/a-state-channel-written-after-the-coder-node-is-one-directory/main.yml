# rule: a `state` channel whose only writer runs after the coder node holds its
# rule: `default:` at that node, so it is one workspace (10.1, 7.6.4, 8.9, D147)
# code: shared-workspace
# message: `flow.fix` node `implement` is dispatched by the map `work` of `flow.main` with `max_concurrency: 4`, and its `workspace:` is one directory for every dispatch
# at: main.yml:64:20
# label: main.yml:95:7 the fan-out is issued here
# help: a harness run is contained by its `workspace:`, so 4 dispatches sharing `state.checkout` are 4 coding agents editing one checkout and overwriting each other's work. `checkout` is written by `record` of `flow.fix`, but not by a node this one runs after on every path from `start`: a channel's writes land when their writer completes (grammar 7.6.4), so what this node reads is still the `default:` every instance starts at — one directory for the whole fan-out. The write has to **dominate** this node the way `map.over`'s producer dominates its map (grammar 8.6 rule 11), which is what an upstream `exec:` or `tool.*` step that clones or worktrees per dispatch does. Two repairs, and each says something different about the graph: bind the item's own path — carry it on the dispatch (`input: { worktree: "item.worktree" }`) and read it here (`workspace: "input.worktree"`), or write `workspace: fresh` for a directory the runtime provisions per dispatch — or declare `max_concurrency: 1` on the map, which says these runs are serial. `workspace:` is evaluated in this node's input scope at every dispatch precisely so the first repair is writable (grammar 8.6, 8.9, Decision D147, PRD resolved q61 ruling b)
#
# The half of PRD resolved q61 ruling b that reading "does the instance write
# this channel anywhere" cannot see. `flow.fix` **does** write `checkout` — the
# `record` node's `writes:` remap lands there — and every dispatch still reads
# the channel's `default:`, because `record` runs in the superstep *after*
# `implement`. Channel values are ordered by step (grammar 7.6.4), so a write
# that lands when its writer completes is invisible to a node that already ran:
# four `cc` runs, four times `/srv/one-and-only`, which is the field report the
# ruling was ratified from.
#
# What the rule reads is therefore **dominance** — every path from `start` to
# the coder node passes through a node that writes the channel — and it is
# dominance for the reason Decision D76 gives `map.over` the same reading: the
# value's existence has to be a guarantee rather than a hope. Mere
# path-existence between the two nodes would accept this composition, and so
# would a writer sitting on a guarded branch beside the reader.
#
# The accepting direction is `check_accepts.rs`'s
# `a_checkout_the_instance_prepares_is_a_directory_per_dispatch`: move this
# `record` node *ahead* of `implement` on the edge list and the same write is
# four directories, prepared per dispatch, which is the shape ruling c names.
# One edge decides which it is.
version: "0.1"
provider.anthropic:
  kind: anthropic
  api_key: ${ANTHROPIC_API_KEY}
model.implementer:
  provider: provider.anthropic
  id: claude-sonnet-4-5
agent.planner:
  model: model.implementer
  prompt: List the goals that need a change.
  output:
    goals:
      type: array
      max_items: 10
      items: { type: string }
state:
  checkout: { type: string, default: "/srv/one-and-only" }
  summary: { type: string, default: "" }
  summaries:
    type: array
    max_items: 10
    items: { type: string }
    reduce: append
    default: []
flow.fix:
  inputs:
    goal: { type: string }
  outputs:
    summary: { type: string }
  nodes:
    implement:
      coder:
        harness: cc
        model: model.implementer
        workspace: "state.checkout"
        prompt: Make the smallest change that satisfies the goal.
        input:
          goal: { type: string }
        output:
          summary: { type: string }
      input:
        goal: "input.goal"
      writes: { summary: summary }
    record:
      exec:
        command: git
        args: ["worktree", "list"]
        output:
          stdout: { type: string }
      writes: { stdout: checkout }
  edges:
    - { from: start, to: implement }
    - { from: implement, to: record }
    - { from: record, to: end }
flow.main:
  outputs:
    summaries:
      type: array
      max_items: 10
      items: { type: string }
  nodes:
    plan:
      agent: agent.planner
      input: "'every failing test'"
    work:
      map:
        over: plan.output.goals
        as: goal
        node: flow.fix
        input:
          goal: "goal"
        max_concurrency: 4
        writes: { summary: summaries }
  edges:
    - { from: start, to: plan }
    - { from: plan, to: work }
    - { from: work, to: end }
