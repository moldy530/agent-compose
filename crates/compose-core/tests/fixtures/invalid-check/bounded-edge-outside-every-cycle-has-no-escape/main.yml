# rule: the source of a `max_iterations` edge is not exempt for standing outside every cycle (grammar 7.4, 9.2, Decision D19)
# code: dead-end
# message: the `max_iterations` edge from `y` to `z` in `flow.f` has no escape
# at: main.yml:45:7
# label: main.yml:38:5 the source node is here
# help: an exhausted edge is not taken whatever its guard says, and a node outside every cycle can still run twice — a loop upstream routes to it once per pass, and `on_error: { fallback: … }` or `human.on_timeout:` schedules it again — so the budget can be spent with the flow still going: give `y` an outgoing edge that is unconditional or carries `else: true` — a guarded escape is not enough (grammar 7.4, 9.2, Decision D19)
#
# This flow has no SCC at all, and `y` still runs twice. `p` fans out to `x` and
# `y` over two unconditional edges, so step 1 is `{x, y}` and `y` spends its
# budget of 1 there; `x` fails, and grammar 9.2 leaves `x`'s own edges
# unevaluated and schedules its fallback `y` in the next step instead, so `y`
# runs again at step 2. On that pass `y -> z` is untakeable (grammar 7.3 rule 5)
# and `y -> w` is false whenever `flag` is, so no edge is taken at all — grammar
# 7.3 rule 7's dead end, which is what the escape rule exists to remove. A node
# no cycle *reaches* is therefore no proof that its budget cannot be spent.
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
agent.a:
  model: model.m
  prompt: Do it.
  output:
    verdict: { enum: [approve, revise] }
state:
  flag: { description: whether the branch is live, type: boolean, default: false }
flow.f:
  outputs: {}
  nodes:
    p: { agent: agent.a, input: "'p'" }
    x:
      agent: agent.a
      input: "'x'"
      on_error: { fallback: y }
    y: { agent: agent.a, input: "'y'" }
    z: { agent: agent.a, input: "'z'" }
    w: { agent: agent.a, input: "'w'" }
  edges:
    - { from: start, to: p }
    - { from: p, to: x }
    - { from: p, to: y }
    - { from: y, to: z, when: "!state.flag", max_iterations: 1 }
    - { from: y, to: w, when: "state.flag" }
    - { from: x, to: end }
    - { from: z, to: end }
    - { from: w, to: end }
