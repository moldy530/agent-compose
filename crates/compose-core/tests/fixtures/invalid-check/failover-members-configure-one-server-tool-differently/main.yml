# rule: a route's members declare one `server_tools:` suite, field for field (grammar 12.2, Decision D122)
# code: mismatched-server-tools
# message: `model.resilient` fails over from `provider.primary` to `provider.spare`, which declares a different `server_tools:` suite: it configures `web_search_20250305` differently
# at: main.yml:43:26
# label: main.yml:43:11 `provider.primary` is the first member's provider
# help: a server tool runs on the provider's side, so each member of a route offers its own suite and which tools the model had depends on which member served the call: declare the same suite, field for field, on both providers, or keep this one knowing the difference (grammar 12.2, Decision D122)
#
# The half a `type:`-only comparison cannot see, and the shape a copy-then-edit
# of a provider actually produces: both members declare web search, and one is
# allowed ninety-nine searches across the whole web where the other gets one, on
# a single domain. What the model was offered differs materially — which is the
# subject of this warning — and the runtime already treats the two as different
# calls, since a journaled model call's request identity carries the whole
# config object.
version: "0.1"

provider.primary:
  kind: anthropic
  api_key: ${ANTHROPIC_API_KEY}
  server_tools:
    - type: web_search_20250305
      name: web_search
      max_uses: 1
      allowed_domains: ["docs.example.com"]

provider.spare:
  kind: anthropic
  api_key: ${FALLBACK_API_KEY}
  server_tools:
    - type: web_search_20250305
      name: web_search
      max_uses: 99

model.primary:
  provider: provider.primary
  id: claude-sonnet-4-6

model.spare:
  provider: provider.spare
  id: claude-haiku-4-5

model.resilient:
  route: [model.primary, model.spare]
