# rule: a `coder:` node's `settings:` key that answers to no first-class key is
# rule: refused, and the message says so instead (grammar 8.9, D146)
# code: reserved-harness-setting
# message: `extraArgs` of `flow.main` node `build` is a `harness: cc` option the generated adapter owns, and no key of this block states it
# at: main.yml:44:11
# label: main.yml:38:18 the harness is bound here
# help: there is no key to write instead: an arbitrary command-line flag is every bound at once — `dangerously-skip-permissions` and `add-dir` among them — so no one key answers it. Take the setting off — what `settings:` buys is the vendor's *other* options, never the ones this node already states. `settings:` is open so that a harness option the vendor ships tomorrow is usable the day it ships — it is not a second way to state this construct's own bounds, and a key here that reached one would be the only one no check covers. Refused rather than dropped, because a key silently removed leaves a run doing something no line of the composition says (grammar 8.9, Decision D146, PRD resolved q60 ruling b)
#
# Decision D140's other half, and the one an author has to be told apart from
# the first: unchecked is not unbounded. `extraArgs` is the Agent SDK's
# arbitrary-CLI-flag option, so a key here would carry
# `dangerously-skip-permissions` and an extra `add-dir` past the `access:` and
# `workspace:` this very node states — through the one surface the grammar
# leaves open.
#
# This is the **wider** half of the reserved set: an option that contains every
# bound at once rather than spelling one, so unlike a key reaching the
# permission mode or the sandbox there is no first-class key to be redirected
# to, and the message says so instead of pointing at the nearest one. Before PRD
# resolved q60 the composition still built and the adapter dropped the value at
# run time, which left an author unable to tell a setting that travelled from
# one that never arrived; it is now refused where it is written.
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${ANTHROPIC_API_KEY}
model.smart:
  provider: provider.p
  id: claude-sonnet-4-5
state:
  summary: { type: string, default: "" }
flow.main:
  outputs:
    summary: { type: string }
  nodes:
    build:
      coder:
        harness: cc
        model: model.smart
        workspace: "'${REPO_ROOT}'"
        access: read_only
        prompt: Read the tree and report.
        settings:
          extraArgs: { add-dir: / }
        output:
          summary: { type: string }
      input: "'go'"
  edges:
    - { from: start, to: build }
    - { from: build, to: end }
