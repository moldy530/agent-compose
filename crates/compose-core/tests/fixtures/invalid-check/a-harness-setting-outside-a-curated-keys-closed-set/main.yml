# rule: a `coder:` node's `settings:` value outside a curated key's closed set of
# rule: words is refused by the word it holds, not by its type (grammar 8.9, D140)
# code: unknown-variant
# message: `sometimes` is not a `web_search` of `flow.main` node `build`
# at: main.yml:37:23
# label: main.yml:37:11 the setting is declared here
# help: `web_search` takes `disabled`, `cached`, `live`
#
# The strict tier's *third* shape, and the one whose whole value is which
# refusal it gives. `web_search` is a string, so nothing about its type is
# wrong: what is wrong is the word, and an author who is told `web_search`
# "takes one of a closed set of words" has been told the type of a value they
# already wrote correctly. Naming the three words is the repair, which is why
# this arm exists separately from the wrong-type one below it — and why a
# fixture pins the message rather than the code, since both arms of the same
# `match` would keep a code-only assertion green.
version: "0.1"
provider.p:
  kind: openai
  api_key: ${OPENAI_API_KEY}
model.smart:
  provider: provider.p
  id: gpt-5-codex
state:
  summary: { type: string, default: "" }
flow.main:
  outputs:
    summary: { type: string }
  nodes:
    build:
      coder:
        harness: codex
        model: model.smart
        workspace: "'${REPO_ROOT}'"
        prompt: Do the work.
        settings:
          web_search: sometimes
        output:
          summary: { type: string }
      input: "'go'"
  edges:
    - { from: start, to: build }
    - { from: build, to: end }
