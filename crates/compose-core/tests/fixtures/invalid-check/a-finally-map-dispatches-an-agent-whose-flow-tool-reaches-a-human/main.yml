# rule: a flow's `finally:` node reaches no `human` node through the `flow.*` tools of an agent its `map` dispatches (grammar 7.9, 7.7, 8.7, Decision D159)
# code: finally-interrupt
# message: `wrap_up`, the `finally:` node of `flow.f`, reaches the `human` node `approve` of `flow.sign`
# at: main.yml:60:12
# label: main.yml:36:5 the `human` node is declared here
# help: a finally node runs once when its instance ends, and a step that must always finish cannot park on a question: it may be no `human` node and reach none — through a `flow:` node, a `map`'s dispatch targets, or the `flow.*` tools of an agent it calls. Take the pause out of what it runs (grammar 7.9, 8.7, 7.7, Decision D159)
#
# The `map` arm of the walk with an `agent.*` target: what the map reaches is
# what its target does, and an agent target reaches the pause through its
# `tools:` rather than through nodes of its own. `a-finally-node-reaches-a-
# human-through-a-map` pins the same arm over a dispatched flow.
version: "0.1"
state:
  names:
    type: array
    max_items: 9
    items: { type: string }
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
agent.caller:
  model: model.m
  prompt: Record how one item ended.
  tools: [flow.sign]
  output:
    note: { type: string }
flow.sign:
  description: Have a person sign off on the record.
  inputs:
    text: { type: string }
  outputs: {}
  nodes:
    approve:
      human:
        input:
          text: { type: string }
        output:
          decision: { enum: [approve, reject] }
      input: { text: "input.text" }
  edges:
    - { from: start, to: approve }
    - { from: approve, to: end }
flow.f:
  outputs: {}
  nodes:
    work:
      exec: { command: "true" }
    wrap_up:
      map:
        over: "state.names"
        node: agent.caller
        max_concurrency: 2
        input: "item + ': ' + execution.outcome"
  edges:
    - { from: start, to: work }
    - { from: work, to: end }
  finally: wrap_up
