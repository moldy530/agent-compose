# rule: a self-edge is a one-node SCC bounded like any other (grammar 7.2, 7.4)
# code: unbounded-cycle
# message: the cycle through `n` in `flow.f` carries no bounded edge
# at: main.yml:21:5
# help: every cycle must terminate: put `max_iterations:` on a `when:`-guarded edge inside it, or give one of its nodes a CEL exit condition — an edge that leaves the cycle, plus in-cycle edges that can all go untaken on one pass (grammar 7.4, Decisions D57, D98)
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
agent.a:
  model: model.m
  prompt: Do it.
  output:
    verdict: { enum: [approve, revise, escalate] }
flow.f:
  outputs: {}
  nodes:
    n: { agent: agent.a, input: "'x'" }
  edges:
    - { from: start, to: n }
    - { from: n, to: n }
    - { from: n, to: end, when: "n.output.verdict == 'approve'" }
