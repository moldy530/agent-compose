# rule: a `GET` trigger does not read through `payload.body` (grammar 13.3, Decision D117)
# code: invalid-expression
# message: `input` of the trigger `on_request` reads `payload.body.goal`, and a `GET` carries no body
# at: main.yml:26:13
# help: `payload.body` is `{}` on every request a `GET` trigger can receive, so reading a member of it fails every one of them: bind from `payload.query` instead, which is where a `GET`'s parameters are (grammar 13.3, Decision D117)
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
agent.a:
  model: model.m
  prompt: Do the thing.
  input:
    text: { type: string }
  output:
    result: { type: string }
triggers:
  on_request:
    type: http
    flow: flow.f
    method: GET
    input:
      goal: "payload.body.goal"
flow.f:
  inputs:
    goal: { type: string }
  outputs: {}
  nodes:
    n:
      agent: agent.a
      input: { text: "input.goal" }
  edges:
    - { from: start, to: n }
    - { from: n, to: end }
