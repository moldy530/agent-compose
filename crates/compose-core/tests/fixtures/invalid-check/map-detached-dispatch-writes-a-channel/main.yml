# rule: a detached dispatch writes no state, however it is spelled (grammar 8.6 rule 7, Decisions D31, D94)
# code: detached-write
# message: the `map` of node `fan` is detached, and `note` of `agent.sink` writes the channel `note`
# at: main.yml:42:9
# label: main.yml:44:17 the dispatch is detached here
# help: a detached dispatch is resolved at dispatch: the join is over the moment it is issued and its outcome is never observed, so what it wrote would land — or not — after everything that reads it (grammar 8.6 rule 7, Decisions D31, D94); drop `detach: true`, or send the result out through the target itself
#
# The parser refuses `detach: true` beside a `writes:` remap
# (invalid-parse/map-detached-dispatch-writes-state.yml). This is the other
# spelling of the same rule, and the one only a whole composition shows: the
# target's output field and the channel share a name, so the write is made by
# name-based wiring with no `writes:` key to refuse (grammar 8.0).
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
state:
  tasks:
    type: array
    max_items: 9
    items: { type: string }
  note:
    type: array
    max_items: 9
    items: { type: string }
    reduce: append
agent.sink:
  model: model.m
  prompt: Record.
  input:
    text: { type: string }
  output:
    note: { type: string }
flow.f:
  outputs: {}
  nodes:
    fan:
      map:
        over: "state.tasks"
        node: agent.sink
        detach: true
        max_concurrency: 2
        input: { text: "item" }
  edges:
    - { from: start, to: fan }
    - { from: fan, to: end }
