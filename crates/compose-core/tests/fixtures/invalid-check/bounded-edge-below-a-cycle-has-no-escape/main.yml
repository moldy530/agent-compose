# rule: the source of a `max_iterations` edge a cycle reaches needs a guaranteed escape (grammar 7.4, Decision D19)
# code: dead-end
# message: the `max_iterations` edge from `n` to `x` in `flow.f` has no escape
# at: main.yml:39:7
# label: main.yml:31:5 the source node is here
# help: an exhausted edge is not taken whatever its guard says, and a node outside every cycle can still run twice — a loop upstream routes to it once per pass, and `on_error: { fallback: … }` or `human.on_timeout:` schedules it again — so the budget can be spent with the flow still going: give `n` an outgoing edge that is unconditional or carries `else: true` — a guarded escape is not enough (grammar 7.4, 9.2, Decision D19)
#
# `n` belongs to no cycle, but the loop through `a` and `b` reaches it: the edge
# `b -> n` is co-takeable with the back-edge `b -> a` (grammar 7.6.1), so `n`
# runs once per pass of that loop and its budget of 3 is spent with the flow
# still going. The pass after that takes `n -> x` out of play (grammar 7.3
# rule 5) and leaves an `approve` verdict with no edge to take at all — grammar
# 7.3 rule 7's dead end, which is what the escape rule exists to remove.
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
model.m:
  provider: provider.p
  id: some-model
agent.a:
  model: model.m
  prompt: Do it.
  output:
    verdict: { enum: [approve, revise, escalate] }
flow.f:
  outputs: {}
  nodes:
    a: { agent: agent.a, input: "'a'" }
    b: { agent: agent.a, input: "'b'" }
    n: { agent: agent.a, input: "'n'" }
    x: { agent: agent.a, input: "'x'" }
    y: { agent: agent.a, input: "'y'" }
  edges:
    - { from: start, to: a }
    - { from: a, to: b }
    - { from: b, to: a, when: "b.output.verdict == 'revise'" }
    - { from: b, to: n, when: "b.output.verdict in ['approve', 'revise', 'escalate']" }
    - { from: n, to: x, when: "n.output.verdict == 'approve'", max_iterations: 3 }
    - { from: n, to: y, when: "n.output.verdict != 'approve'" }
    - { from: x, to: end }
    - { from: y, to: end }
