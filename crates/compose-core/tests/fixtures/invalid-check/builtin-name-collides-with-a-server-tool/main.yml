# rule: a built-in reaches the same `tools` array a provider's suite is appended
# rule: to, so one name there is one tool (grammar 5.5, 12.1, D122, D123)
# code: tool-name-collision
# message: `agent.a` attaches `builtin.list`, whose name collides with the `list` server tool `provider.p` declares
# at: main.yml:35:7
# label: main.yml:26:7 the server tool is declared here
# help: a server tool is appended to the `tools` of every request that connection serves, and the wire refuses an array carrying `list` twice: drop the built-in, whose name is not an author's to change, or declare the suite on a provider this agent's model does not reach (grammar 12.1, 11.5, Decision D122)
# count: 2
#
# The Messages wire is the one where a server tool and a client tool sit under
# one key, so the pair is decidable there and only there — and the agent has to
# be reached from the *connection*, which is what makes this the validator's
# rather than the parser's.
#
# The suite entry is second-tier on purpose: every tool the curated table has a
# row for is pinned to a canonical wire name, and none of those names is a
# built-in's — so the pair a reader can actually write is a tool this release
# has never seen, whose `name:` is the author's own claim about the wire's name
# space (Decision D122). The `unknown-server-tool` warning that entry earns is
# the second diagnostic this fixture declares.
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${K}
  server_tools:
    - type: directory_listing_20260101
      name: list
model.m:
  provider: provider.p
  id: some-model
agent.a:
  model: model.m
  prompt: Decide.
  tools:
    - builtin.list: { root: "./work" }
  output:
    verdict: { type: string }
flow.f:
  outputs: {}
  nodes:
    n:
      agent: agent.a
      input: "'x'"
  edges:
    - { from: start, to: n }
    - { from: n, to: end }
