# rule: a route's members declare one `server_tools:` suite (grammar 12.2, Decision D122)
# code: mismatched-server-tools
# message: `model.resilient` fails over from `provider.primary` to `provider.spare`, which declares a different `server_tools:` suite: it does not declare `web_search_20250305`
# at: main.yml:33:26
# label: main.yml:33:11 `provider.primary` is the first member's provider
# help: a server tool runs on the provider's side, so each member of a route offers its own suite and which tools the model had depends on which member served the call: declare the same suite on both providers, or keep this one knowing the difference (grammar 12.2, Decision D122)
#
# Failover capability is per-chain-member by construction — each provider
# declares its own array — so which tools the model was offered depends on which
# member answered. Visible rather than refused (resolved q30).
version: "0.1"

provider.primary:
  kind: anthropic
  api_key: ${ANTHROPIC_API_KEY}
  server_tools:
    - type: web_search_20250305
      name: web_search

provider.spare:
  kind: anthropic
  api_key: ${FALLBACK_API_KEY}

model.primary:
  provider: provider.primary
  id: claude-sonnet-4-6

model.spare:
  provider: provider.spare
  id: claude-haiku-4-5

model.resilient:
  route: [model.primary, model.spare]
