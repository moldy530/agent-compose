# rule: a `permission_mode:` outside what the node's `access:` level admits is
# rule: refused, naming the mode, the level and the set (grammar 8.9, D146)
# code: widening-permission-mode
# message: `permission_mode: bypassPermissions` of `flow.main` node `build` is outside what `access: workspace_write` admits
# at: main.yml:40:26
# label: main.yml:36:18 `harness: cc` is bound here
# help: `access:` says how far a run may reach and `permission_mode:` says how its harness approves a call inside that reach, so a mode may never grant an operation the level would refuse: `bypassPermissions` bypasses every permission check, and `access: workspace_write` bounds writes to the workspace. `access: workspace_write` admits `default`, `acceptEdits`, `dontAsk`, `auto` and derives `acceptEdits` when the key is absent. Either name one of those, or raise `access:` to a level that admits `bypassPermissions` — `access: full_access`, which asks for no containment at all — because a level is a containment statement a reader sees on the node rather than a mode reaching around one (grammar 8.9, Decision D146, PRD resolved q60 ruling a)
#
# The invariant the whole key is held to: a mode may never grant an operation
# the node's `access:` level would refuse. `bypassPermissions` turns the Agent
# SDK's permission machinery off, and `workspace_write` says writes are bounded
# to the workspace — so this pair is a node whose containment reads one way on
# the page and holds another way at run time, with `validate` clean and
# `visualize` still drawing `workspace_write`.
#
# Both values are legal on their own and only the pair is wrong, which is why
# the message names all three facts a repair needs: the mode, the level, and
# what that level admits. The two repairs are a narrower mode or a wider
# `access:`, and the second is a containment statement a reader sees on the node
# (grammar 8.9, Decision D146, PRD resolved q60 ruling a).
version: "0.1"
provider.p:
  kind: anthropic
  api_key: ${ANTHROPIC_API_KEY}
model.smart:
  provider: provider.p
  id: claude-sonnet-4-5
state:
  summary: { type: string, default: "" }
flow.main:
  outputs:
    summary: { type: string }
  nodes:
    build:
      coder:
        harness: cc
        model: model.smart
        workspace: ${REPO_ROOT}
        access: workspace_write
        permission_mode: bypassPermissions
        prompt: Make the change and report.
        output:
          summary: { type: string }
      input: "'go'"
  edges:
    - { from: start, to: build }
    - { from: build, to: end }
