# rule: `agent_access: full` is a kv level — its extra tools are a kv store's `merge`, `append`, `incr` and `delete`, so a blob store takes `read` or `read_write` (grammar 11.5, PRD resolved q68)
# at: /store.artifacts/agent_access
# via: /$defs/storeDef/allOf/2/then/properties/agent_access/enum
store.artifacts:
  kind: blob
  scope: global
  description: Reports the agent files.
  agent_access: full
