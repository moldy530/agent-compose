# rule: an `auth:` `header:` names the header a credential arrives in, and the empty string names none (grammar 13.3)
# at: /triggers/intake/auth/hmac/header
# via: /$defs/inboundHmac/properties/header/allOf/1/pattern
triggers:
  intake:
    type: http
    flow: flow.support
    auth:
      hmac:
        secret: ${WEBHOOK_SECRET}
        header: ""
