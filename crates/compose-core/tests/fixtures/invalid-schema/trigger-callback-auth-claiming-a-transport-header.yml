# rule: a delivery's bearer `header:` may not be one the request itself writes — `Content-Type`, `Content-Length`, `Host` (grammar 13.3, Decision D127)
# at: /triggers/intake/callback_auth/bearer/header
# via: /$defs/callbackBearerAuth/allOf/1/properties/header/not
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_auth:
      bearer:
        token: ${CALLBACK_TOKEN}
        header: Content-Type
    callback_allow:
      - "https://hooks.example.com/*"
