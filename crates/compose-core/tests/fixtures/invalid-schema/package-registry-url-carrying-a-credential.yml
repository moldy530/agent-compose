# rule: a package_registry url puts no credential before an @ in its authority — that is a literal secret in two emitted files, and the credential is token: (grammar 14.6)
# at: /package_registry/url
# via: /$defs/packageRegistry/properties/url/allOf/1/pattern
version: "0.1"
package_registry:
  url: "https://deploy-user:hunter2@npm.internal.example/repository/npm-group/"
  token: ${NPM_MIRROR_TOKEN}
