# rule: two identical edges are an error - the duplicate adds no transition (grammar 7.2)
# at: /flow.simple/edges
# via: /$defs/flowDef/properties/edges/uniqueItems
flow.simple:
  outputs:
    draft: { type: string }
  nodes:
    write:
      agent: agent.researcher
      input: "input.goal"
  edges:
    - { from: start, to: write }
    - { from: write, to: end }
    - { from: write, to: end }
