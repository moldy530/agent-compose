# rule: `default:` applies to scalar and enum type nodes - on an object it is a state-channel key, not an input-surface one (grammar 3.3, 3.6, 10.1)
# at: /agent.reviewer/input/author
# via: /$defs/typeNode/oneOf
agent.reviewer:
  model: model.smart
  prompt: Review the draft.
  output:
    verdict: { enum: [approve, revise] }
  input:
    author:
      type: object
      properties:
        name: { type: string }
      default: { name: anonymous }
