# rule: one `tools` entry attaches one tool (grammar 5.5 / D123)
# at: /agent.reviewer/tools/0
# via: /$defs/builtinTool/maxProperties
agent.reviewer:
  model: model.smart
  prompt: Review the draft.
  tools:
    - { builtin.read_file: { root: "./work" }, builtin.list: { root: "./work" } }
  output:
    verdict: { enum: [approve, revise] }
