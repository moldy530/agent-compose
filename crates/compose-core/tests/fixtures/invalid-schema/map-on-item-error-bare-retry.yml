# rule: `on_item_error: retry` must carry its policy inline as `{ retry: { max, backoff } }` - a bare retry has no count and no backoff and nothing to inherit one from (grammar 8.6 rule 10 / D73)
# at: /flow.work/nodes/fan/map/on_item_error
# via: /$defs/mapNode/properties/map/properties/on_item_error/oneOf
flow.work:
  outputs:
    done: { type: boolean }
  nodes:
    plan:
      agent: agent.planner
    fan:
      map:
        over: plan.output.tasks
        node: agent.worker
        max_concurrency: 4
        on_item_error: retry
  edges:
    - { from: start, to: plan }
    - { from: plan, to: fan }
    - { from: fan, to: end }
