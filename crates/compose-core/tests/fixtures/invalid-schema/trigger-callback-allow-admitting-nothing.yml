# rule: a `callback_allow:` list admits at least one URL; an empty one refuses every delivery (grammar 13.3 / PRD resolved q33)
# at: /triggers/intake/callback_allow
# via: /$defs/callbackAllow/minItems
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_allow: []
