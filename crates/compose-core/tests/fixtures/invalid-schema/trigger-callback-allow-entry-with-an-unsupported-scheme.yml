# rule: a `callback_allow:` entry names `http` or `https`, the two schemes a callback is delivered over (grammar 13.3 / PRD resolved q33)
# at: /triggers/intake/callback_allow/0
# via: /$defs/callbackAllow/items/allOf/1/pattern
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_allow:
      - "ftp://hooks.example.com/*"
