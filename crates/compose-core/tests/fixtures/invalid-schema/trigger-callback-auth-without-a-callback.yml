# rule: `callback_auth:` identifies a webhook delivery, so it needs a `callback:` to identify (grammar 13.3 / PRD resolved q33)
# at: /triggers/intake
# via: /$defs/httpTrigger/allOf/1/then/required
triggers:
  intake:
    type: http
    flow: flow.support
    callback_auth:
      hmac:
        secret: ${CALLBACK_SECRET}
    callback_allow:
      - "https://hooks.example.com/*"
