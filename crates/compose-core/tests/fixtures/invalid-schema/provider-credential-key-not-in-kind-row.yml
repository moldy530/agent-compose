# rule: the closed per-kind row covers credential keys too - a `vertex` provider's credential key is `credentials_json:`, so `api_key:` is not one of its keys (grammar 12.1 / D106)
# at: /provider.gcp/api_key
# via: /$defs/providerDef/allOf/5/then/properties/api_key
provider.gcp:
  kind: vertex
  project: example-project
  location: us-central1
  api_key: ${VERTEX_API_KEY}
