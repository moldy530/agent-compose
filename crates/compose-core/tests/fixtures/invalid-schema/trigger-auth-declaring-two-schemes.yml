# rule: an inbound `auth:` block declares one scheme, not two: a route verifying either is as open as its weaker half (grammar 13.3 / PRD resolved q32)
# at: /triggers/intake/auth
# via: /$defs/inboundAuth/oneOf
triggers:
  intake:
    type: http
    flow: flow.support
    auth:
      bearer:
        token: ${WEBHOOK_TOKEN}
      hmac:
        secret: ${WEBHOOK_SECRET}
