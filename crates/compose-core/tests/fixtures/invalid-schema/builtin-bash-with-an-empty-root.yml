# rule: `builtin.bash` carries the same non-empty `root` the file tools do; an
# rule: empty one is the shell's working directory left to the runtime (grammar 5.5 / D123)
# at: /agent.reviewer/tools/0/builtin.bash/root
# via: /$defs/builtinTool/properties/builtin.bash/properties/root/allOf/1/minLength
agent.reviewer:
  model: model.smart
  prompt: Review the draft.
  tools:
    - builtin.bash: { root: "", timeout: 30s }
  output:
    verdict: { enum: [approve, revise] }
