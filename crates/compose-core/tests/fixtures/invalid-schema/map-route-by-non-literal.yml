# rule: `route_by` is a literal discriminator field name, never a CEL expression - this keeps exhaustiveness decidable (grammar 8.6 / PRD 5.6)
# at: /flow.triage/nodes/dispatch/map/route_by
# via: /$defs/identifier/pattern
flow.triage:
  outputs:
    done: { type: boolean }
  nodes:
    classify:
      agent: agent.triage
    dispatch:
      map:
        over: classify.output.findings
        route_by: "finding.kind == 'auto_fixable'"
        max_concurrency: 4
        routes:
          auto_fixable: { node: agent.fixer }
  edges:
    - { from: start, to: classify }
    - { from: classify, to: dispatch }
    - { from: dispatch, to: end }
