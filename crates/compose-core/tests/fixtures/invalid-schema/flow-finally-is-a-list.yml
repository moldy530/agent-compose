# rule: a flow names one `finally:` node, never a list of them (grammar 7.9 / D159)
# at: /flow.demo/finally
# via: /$defs/identifier/type
flow.demo:
  outputs: {}
  nodes:
    work: { exec: { command: "true" } }
    first: { exec: { command: "true" } }
    second: { exec: { command: "true" } }
  edges:
    - { from: start, to: work }
    - { from: work, to: end }
  finally: [first, second]
