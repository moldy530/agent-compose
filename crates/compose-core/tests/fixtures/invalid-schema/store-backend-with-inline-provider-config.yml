# rule: `backend:` names an abstract alias only - physical provider config lives in the deploy layer (grammar 11.3 / PRD 5.8)
# at: /store.docs/backend
# via: /$defs/identifier/type
store.docs:
  kind: vector
  scope: global
  embed:
    model: text-embedding-3-small
    provider: provider.openai
  backend:
    provider: chroma
    url: ${CHROMA_URL}
