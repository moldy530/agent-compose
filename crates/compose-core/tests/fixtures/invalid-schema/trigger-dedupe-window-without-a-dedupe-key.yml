# rule: an `http` trigger's `dedupe_window:` is the window of its `dedupe_key:`, which has no default, so the window needs the key (grammar 13.3 / PRD resolved q77)
# at: /triggers/on_request
# via: /$defs/httpTrigger/dependentRequired
triggers:
  on_request:
    type: http
    flow: flow.support
    dedupe_window: 1h
