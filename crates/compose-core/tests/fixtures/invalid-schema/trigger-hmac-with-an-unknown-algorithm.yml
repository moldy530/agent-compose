# rule: an inbound `hmac:` verifies with one of a closed set of digests (grammar 13.3 / PRD resolved q32)
# at: /triggers/intake/auth/hmac/algorithm
# via: /$defs/inboundHmac/properties/algorithm/enum
triggers:
  intake:
    type: http
    flow: flow.support
    auth:
      hmac:
        secret: ${WEBHOOK_SECRET}
        algorithm: md5
