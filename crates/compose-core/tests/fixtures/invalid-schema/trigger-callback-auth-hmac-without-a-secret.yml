# rule: an outbound `hmac:` scheme declares the key it signs deliveries with (grammar 13.3 / PRD resolved q33)
# at: /triggers/intake/callback_auth/hmac
# via: /$defs/callbackHmac/required
triggers:
  intake:
    type: http
    flow: flow.support
    callback: "payload.body.callback_url"
    callback_auth:
      hmac: {}
    callback_allow:
      - "https://hooks.example.com/*"
