# rule: a manual trigger declares no `input:` - CLI arguments are validated directly against the flow's input schema (grammar 13.2 / PRD 5.11)
# at: /triggers/cli
# via: /$defs/manualTrigger/additionalProperties
triggers:
  cli:
    type: manual
    flow: flow.review_loop
    input:
      goal: "payload.body.goal"
