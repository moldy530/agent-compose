# rule: a trace_sink takes url, format and auth and no other key — there is no allowlist, because the address is operator-written config (grammar 14.5, D134)
# at: /trace_sink
# via: /$defs/traceSink/additionalProperties
version: "0.1"
trace_sink:
  url: "https://collector.internal.example/v1/traces"
  allow:
    - "https://collector.internal.example/*"
