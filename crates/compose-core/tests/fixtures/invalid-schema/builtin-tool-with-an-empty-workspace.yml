# rule: a `workspace:` that is written names a directory; omitting it takes the execution's own (grammar 6.1 / D135)
# at: /tool.sandbox/workspace
# via: /$defs/toolDef/properties/workspace/allOf/1/minLength
tool.sandbox:
  builtin: bash
  workspace: ""
agent.reviewer:
  model: model.smart
  prompt: Review the draft.
  tools:
    - tool.sandbox
  output:
    verdict: { enum: [approve, revise] }
