# rule: a file built-in runs no command, so it takes no `timeout` (grammar 5.5 / D50, D123)
# at: /agent.reviewer/tools/0/builtin.list
# via: /$defs/builtinFileTool/additionalProperties
agent.reviewer:
  model: model.smart
  prompt: Review the draft.
  tools:
    - builtin.list: { root: "./work", timeout: 30s }
  output:
    verdict: { enum: [approve, revise] }
