# rule: a `module:` dependency's semver tails are identifiers (grammar 6.1 / Decision D133)
# at: /tool.sign/module
# via: /$defs/moduleImpl/oneOf
tool.sign:
  description: Sign a payload.
  input:
    payload: { type: string }
  output:
    signature: { type: string }
  module:
    path: ./src/tools/sign.ts
    dependencies:
      "@noble/hashes": "1.4.0-+"
