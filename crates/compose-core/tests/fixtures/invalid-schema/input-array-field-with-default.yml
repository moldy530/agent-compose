# rule: `default:` applies to scalar and enum type nodes - on an array it is a state-channel key, not an input-surface one (grammar 3.3, 3.6, 10.1)
# at: /agent.reviewer/input/tags
# via: /$defs/typeNode/oneOf
agent.reviewer:
  model: model.smart
  prompt: Review the draft.
  output:
    verdict: { enum: [approve, revise] }
  input:
    tags:
      type: array
      items: { type: string }
      default: [urgent]
