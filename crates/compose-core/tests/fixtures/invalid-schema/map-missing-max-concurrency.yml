# rule: a map MUST declare max_concurrency - execution bounding is mandatory (grammar 8.6 / PRD 5.6)
# at: /flow.work/nodes/fan/map
# via: /$defs/mapNode/properties/map/required
flow.work:
  outputs:
    done: { type: boolean }
  nodes:
    plan:
      agent: agent.planner
    fan:
      map:
        over: plan.output.tasks
        node: agent.worker
  edges:
    - { from: start, to: plan }
    - { from: plan, to: fan }
    - { from: fan, to: end }
