# rule: `on_timeout:` without `timeout:` declares a route nothing can reach - the pair is jointly optional and jointly required (grammar 8.7 / D52)
# at: /flow.approval/nodes/approve/human
# via: /$defs/humanNode/properties/human/dependentRequired
flow.approval:
  outputs:
    decision: { type: string }
  nodes:
    approve:
      human:
        input:
          draft: { type: string }
        output:
          decision: { enum: [approve, reject] }
        on_timeout: end
  edges:
    - { from: start, to: approve }
    - { from: approve, to: end }
