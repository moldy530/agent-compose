# rule: a group no execution may hold admits nothing, so `concurrency.limit:` is at least 1 (grammar 13.1 / PRD resolved q77)
# at: /triggers/on_request/concurrency/limit
# via: /$defs/triggerConcurrency/properties/limit/minimum
triggers:
  on_request:
    type: http
    flow: flow.support
    concurrency:
      limit: 0
