# rule: an `auth:` `prefix:` is literal text; nothing on it is interpolated (grammar 4.3 class 3, 13.3, Decision D92)
# at: /triggers/intake/auth/hmac/prefix
# via: /$defs/noEnvRefString/not
triggers:
  intake:
    type: http
    flow: flow.support
    auth:
      hmac:
        secret: ${WEBHOOK_SECRET}
        prefix: "${SIG_PREFIX}"
