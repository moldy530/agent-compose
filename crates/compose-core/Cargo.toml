[package]
name = "compose-core"
description = "Compiler core for agent-compose: parser, resolver, validator, IR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Event-level YAML 1.2 parser. Chosen over a tree/serde loader because the
# compiler needs what only the event stream exposes: byte-accurate spans on
# every node, duplicate keys (rejected, never last-wins), tags and merge keys
# as observable events, and explicit anchor/alias ids. Pure Rust, two small
# transitive dependencies, and a `0.0.x` version pins exactly.
saphyr-parser = "0.0.11"
# Edit distance behind the "did you mean `retry`?" help on unknown keys and
# unknown enum variants. Zero dependencies; Damerau-Levenshtein also catches
# transpositions, which a hand-rolled Levenshtein would miss.
strsim = "0.11"
# The flat IR is a JSON document (PRD 5.1), so the artifact needs a serializer.
# `derive` keeps the IR's shape declared next to its types instead of in a
# hand-written writer that could drift from them.
serde = { version = "1", features = ["derive"] }
# The JSON writer itself. Chosen for `BTreeMap` iteration order surviving into
# the output unchanged, which is what makes the emitted artifact byte-identical
# for byte-identical input (PRD 5.12).
serde_json = "1"
# CEL, the spec's one expression language (grammar 4.1). `cel` is the maintained
# successor of `cel-interpreter` from the same repository (cel-rust): it carries
# the ANTLR-generated grammar the CEL specification publishes, so what parses
# here is what the specification defines rather than a hand-written subset.
# Pinned to an exact version — CLAUDE.md requires both interpreters pinned per
# compiler release, because the shared conformance corpus
# (`tests/fixtures/cel-conformance/`) is only evidence of agreement if the two
# implementations it runs against are fixed. `regex` backs `matches()`, which
# grammar 4.1 puts on the supported surface; `chrono` is off because no surface
# in this grammar produces a timestamp or a duration value.
cel = { version = "=0.14.3", default-features = false, features = ["regex"] }
# The RE2 front-end, used for `pattern:` only (grammar 3.3, Decision D12).
# Codegen has to decide whether a pattern can be a *JavaScript* regular
# expression before it emits one, and that is a question about the pattern's
# constructs rather than about the strings it matches — an AST, not an engine.
# `regex` already carries this crate, so it is a name for something the tree
# holds either way rather than a new dependency.
regex-syntax = { version = "0.8", default-features = false, features = ["std"] }

[dev-dependencies]
# Schema-conformance harness only: the compiler itself does not depend on a
# JSON Schema engine. `jsonschema` speaks draft 2020-12; default features pull
# HTTP/file `$ref` resolvers and TLS, which the published schema never needs.
jsonschema = { version = "0.49", default-features = false }
# Maintained fork of the (deprecated) `serde_yaml`; used to transcode example
# and fixture YAML into JSON for validation.
serde_yaml_ng = "0.10"
# AST snapshots for the example corpus: a shape change shows up as a reviewable
# diff instead of silently altering what downstream passes consume.
insta = "1"
