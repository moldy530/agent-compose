[package]
name = "compose-core"
description = "Compiler core for agent-compose: parser, resolver, validator, IR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]

[dev-dependencies]
# Schema-conformance harness only: the compiler itself does not depend on a
# JSON Schema engine. `jsonschema` speaks draft 2020-12; default features pull
# HTTP/file `$ref` resolvers and TLS, which the published schema never needs.
jsonschema = { version = "0.49", default-features = false }
serde_json = "1"
# Maintained fork of the (deprecated) `serde_yaml`; used to transcode example
# and fixture YAML into JSON for validation.
serde_yaml_ng = "0.10"
