[workspace]
resolver = "2"
members = ["crates/compose-core", "crates/agent-compose"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/moldy530/agent-compose"

[workspace.dependencies]
compose-core = { path = "crates/compose-core" }
clap = { version = "4", features = ["derive"] }
