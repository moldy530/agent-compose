[workspace]
resolver = "2"
members = ["crates/compose-core", "crates/agent-compose", "crates/mock-provider"]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/moldy530/agent-compose"

[workspace.dependencies]
compose-core = { path = "crates/compose-core" }
mock-provider = { path = "crates/mock-provider" }
clap = { version = "4", features = ["derive"] }
